<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos to PowerPoint</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #2D3436; background: #fff; padding: 32px 20px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 4px; }
  .subtitle { color: #636E72; font-size: 14px; margin-bottom: 28px; }
  .error-banner {
    background: #FFEAA7; color: #2D3436; padding: 12px 16px; border-radius: 8px;
    font-size: 13px; margin-bottom: 20px; display: none;
  }
  .dropzone {
    border: 2px dashed #DFE6E9; border-radius: 12px; padding: 48px 24px;
    text-align: center; cursor: pointer; background: #F8F9FA;
    transition: all 0.15s ease; margin-bottom: 24px;
  }
  .dropzone.over { border-color: #0984E3; background: #EBF5FF; }
  .dropzone .icon { font-size: 36px; margin-bottom: 8px; }
  .dropzone .label { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .dropzone .hint { color: #636E72; font-size: 13px; }
  .toolbar {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
  }
  .toolbar .count { font-size: 13px; color: #636E72; }
  .toolbar .clear {
    background: none; border: none; color: #D63031;
    font-size: 13px; cursor: pointer; font-weight: 500;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 28px;
  }
  .card {
    position: relative; border-radius: 8px; overflow: hidden;
    border: 1px solid #DFE6E9; background: #fff; cursor: grab; transition: opacity 0.15s;
  }
  .card.dragging { opacity: 0.4; }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
  .card .overlay {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 6px;
    background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
  }
  .card .num { color: #fff; font-size: 11px; font-weight: 700; min-width: 18px; text-align: center; }
  .card .remove {
    background: rgba(0,0,0,0.4); border: none; color: #fff;
    border-radius: 50%; width: 20px; height: 20px; font-size: 12px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .card .filename {
    padding: 5px 7px; font-size: 11px; color: #636E72;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .download-btn {
    width: 100%; padding: 14px 24px; background: #0984E3; color: #fff;
    border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  .download-btn:hover { background: #0773C5; }
  .download-btn:disabled { background: #636E72; cursor: not-allowed; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Photos &rarr; PowerPoint</h1>
  <p class="subtitle">Upload images, reorder by dragging, then download your deck.</p>
  <div class="error-banner" id="errorBanner"></div>

  <div class="dropzone" id="dropzone">
    <div class="icon">&#128247;</div>
    <div class="label">Drop photos here or click to browse</div>
    <div class="hint">PNG, JPG, GIF, WebP supported</div>
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple class="hidden">

  <div id="controls" class="hidden">
    <div class="toolbar">
      <span class="count" id="count"></span>
      <button class="clear" id="clearBtn">Clear all</button>
    </div>
    <div class="grid" id="grid"></div>
    <button class="download-btn" id="downloadBtn">Download PowerPoint</button>
  </div>
</div>

<script>
// ============================================================
// Minimal ZIP writer (STORE, no compression)
// ============================================================
var CRC32_TABLE = (function() {
  var t = new Uint32Array(256);
  for (var i = 0; i < 256; i++) { var c = i; for (var j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[i] = c; }
  return t;
})();
function crc32(d) { var c = 0xFFFFFFFF; for (var i = 0; i < d.length; i++) c = CRC32_TABLE[(c ^ d[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function str2u8(s) { return new TextEncoder().encode(s); }

function createZip(files) {
  var lh = [], ch = [], off = 0;
  files.forEach(function(f) {
    var nb = str2u8(f.name), cr = crc32(f.data), sz = f.data.length;
    var l = new ArrayBuffer(30 + nb.length), lv = new DataView(l);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(8, 0, true);
    lv.setUint32(14, cr, true); lv.setUint32(18, sz, true); lv.setUint32(22, sz, true);
    lv.setUint16(26, nb.length, true); new Uint8Array(l).set(nb, 30);
    var c = new ArrayBuffer(46 + nb.length), cv = new DataView(c);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(10, 0, true); cv.setUint32(16, cr, true); cv.setUint32(20, sz, true);
    cv.setUint32(24, sz, true); cv.setUint16(28, nb.length, true); cv.setUint32(42, off, true);
    new Uint8Array(c).set(nb, 46);
    lh.push({ header: new Uint8Array(l), data: f.data }); ch.push(new Uint8Array(c));
    off += 30 + nb.length + sz;
  });
  var cdo = off, cds = 0; ch.forEach(function(c) { cds += c.length; });
  var e = new ArrayBuffer(22), ev = new DataView(e);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true); ev.setUint32(12, cds, true); ev.setUint32(16, cdo, true);
  var ts = 0;
  lh.forEach(function(l) { ts += l.header.length + l.data.length; });
  ch.forEach(function(c) { ts += c.length; }); ts += 22;
  var r = new Uint8Array(ts), p = 0;
  lh.forEach(function(l) { r.set(l.header, p); p += l.header.length; r.set(l.data, p); p += l.data.length; });
  ch.forEach(function(c) { r.set(c, p); p += c.length; });
  r.set(new Uint8Array(e), p);
  return r;
}

// ============================================================
// Minimal PPTX generator
// ============================================================
var EMU = 914400, SW = 9144000, SH = 5143500;
function in2e(i) { return Math.round(i * EMU); }
function getExt(d) { if (d.indexOf("image/png") !== -1) return "png"; if (d.indexOf("image/gif") !== -1) return "gif"; if (d.indexOf("image/webp") !== -1) return "webp"; return "jpeg"; }
function getCT(e) { return e === "png" ? "image/png" : e === "gif" ? "image/gif" : e === "webp" ? "image/webp" : "image/jpeg"; }
function d2u8(d) { var b = atob(d.split(",")[1]), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }

function buildPptx(il) {
  var fs = [];
  function add(n, c) { fs.push({ name: n, data: str2u8(c) }); }

  var ctS = "", ctI = {};
  il.forEach(function(img, i) {
    ctS += '<Override PartName="/ppt/slides/slide' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>';
    var e = getExt(img.dataUrl); ctI[e] = getCT(e);
  });
  var ctD = '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>';
  Object.keys(ctI).forEach(function(e) { ctD += '<Default Extension="' + e + '" ContentType="' + ctI[e] + '"/>'; });

  add("[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' + ctD + '<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/><Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/><Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/><Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>' + ctS + '</Types>');

  add("_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="ppt/presentation.xml"/></Relationships>');

  var sl = ""; il.forEach(function(_, i) { sl += '<p:sldId id="' + (256 + i) + '" r:id="rId' + (i + 2) + '"/>'; });
  add("ppt/presentation.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><p:presentation xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst><p:sldIdLst>' + sl + '</p:sldIdLst><p:sldSz cx="' + SW + '" cy="' + SH + '"/><p:notesSz cx="' + SH + '" cy="' + SW + '"/></p:presentation>');

  var pr = '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="slideMasters/slideMaster1.xml"/>';
  il.forEach(function(_, i) { pr += '<Relationship Id="rId' + (i + 2) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide' + (i + 1) + '.xml"/>'; });
  pr += '<Relationship Id="rId' + (il.length + 2) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/>';
  add("ppt/_rels/presentation.xml.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + pr + '</Relationships>');

  add("ppt/theme/theme1.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><a:theme xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" name="T"><a:themeElements><a:clrScheme name="C"><a:dk1><a:srgbClr val="000000"/></a:dk1><a:lt1><a:srgbClr val="FFFFFF"/></a:lt1><a:dk2><a:srgbClr val="1E1E1E"/></a:dk2><a:lt2><a:srgbClr val="E7E6E6"/></a:lt2><a:accent1><a:srgbClr val="0984E3"/></a:accent1><a:accent2><a:srgbClr val="00B894"/></a:accent2><a:accent3><a:srgbClr val="FDCB6E"/></a:accent3><a:accent4><a:srgbClr val="E17055"/></a:accent4><a:accent5><a:srgbClr val="6C5CE7"/></a:accent5><a:accent6><a:srgbClr val="00CEC9"/></a:accent6><a:hlink><a:srgbClr val="0984E3"/></a:hlink><a:folHlink><a:srgbClr val="6C5CE7"/></a:folHlink></a:clrScheme><a:fontScheme name="C"><a:majorFont><a:latin typeface="Calibri"/><a:ea typeface=""/><a:cs typeface=""/></a:majorFont><a:minorFont><a:latin typeface="Calibri"/><a:ea typeface=""/><a:cs typeface=""/></a:minorFont></a:fontScheme><a:fmtScheme name="C"><a:fillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:fillStyleLst><a:lnStyleLst><a:ln w="6350"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln w="6350"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln w="6350"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln></a:lnStyleLst><a:effectStyleLst><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle></a:effectStyleLst><a:bgFillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:bgFillStyleLst></a:fmtScheme></a:themeElements></a:theme>');

  add("ppt/slideMasters/slideMaster1.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><p:sldMaster xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><p:cSld><p:bg><p:bgPr><a:solidFill><a:srgbClr val="1E1E1E"/></a:solidFill><a:effectLst/></p:bgPr></p:bg><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/></p:spTree></p:cSld><p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/><p:sldLayoutIdLst><p:sldLayoutId id="2147483649" r:id="rId1"/></p:sldLayoutIdLst></p:sldMaster>');
  add("ppt/slideMasters/_rels/slideMaster1.xml.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="../theme/theme1.xml"/></Relationships>');

  add("ppt/slideLayouts/slideLayout1.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><p:sldLayout xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" type="blank"><p:cSld name="Blank"><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/></p:spTree></p:cSld></p:sldLayout>');
  add("ppt/slideLayouts/_rels/slideLayout1.xml.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="../slideMasters/slideMaster1.xml"/></Relationships>');

  var pad = 0.4, mW = 10 - pad * 2, mH = 5.625 - pad * 2;
  il.forEach(function(img, i) {
    var sn = i + 1, ext = getExt(img.dataUrl), mn = "image" + sn + "." + ext;
    var asp = img.width / img.height, w, h;
    if (asp > mW / mH) { w = mW; h = mW / asp; } else { h = mH; w = mH * asp; }
    var cx = in2e(w), cy = in2e(h), ox = in2e((10 - w) / 2), oy = in2e((5.625 - h) / 2);

    add("ppt/slides/slide" + sn + ".xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><p:cSld><p:bg><p:bgPr><a:solidFill><a:srgbClr val="1E1E1E"/></a:solidFill><a:effectLst/></p:bgPr></p:bg><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/><p:pic><p:nvPicPr><p:cNvPr id="2" name="Pic ' + sn + '"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="rId2"/><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="' + ox + '" y="' + oy + '"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic></p:spTree></p:cSld></p:sld>');
    add("ppt/slides/_rels/slide" + sn + ".xml.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/' + mn + '"/></Relationships>');
    fs.push({ name: "ppt/media/" + mn, data: d2u8(img.dataUrl) });
  });

  return createZip(fs);
}

// ============================================================
// UI
// ============================================================
var images = [];
var dragIdx = null;

var dropzone = document.getElementById("dropzone");
var fileInput = document.getElementById("fileInput");
var controls = document.getElementById("controls");
var grid = document.getElementById("grid");
var countEl = document.getElementById("count");
var clearBtn = document.getElementById("clearBtn");
var downloadBtn = document.getElementById("downloadBtn");
var errorBanner = document.getElementById("errorBanner");

function showError(msg) { errorBanner.textContent = msg; errorBanner.style.display = "block"; }
function hideError() { errorBanner.style.display = "none"; }

dropzone.addEventListener("click", function() { fileInput.click(); });
dropzone.addEventListener("dragover", function(e) { e.preventDefault(); dropzone.classList.add("over"); });
dropzone.addEventListener("dragleave", function() { dropzone.classList.remove("over"); });
dropzone.addEventListener("drop", function(e) {
  e.preventDefault(); dropzone.classList.remove("over");
  processFiles(e.dataTransfer.files);
});
fileInput.addEventListener("change", function(e) { processFiles(e.target.files); e.target.value = ""; });
clearBtn.addEventListener("click", function() { images.length = 0; render(); });
downloadBtn.addEventListener("click", generatePptx);

function processFiles(files) {
  Array.from(files).filter(function(f) { return f.type.startsWith("image/"); }).forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        images.push({
          id: Math.random().toString(36).slice(2),
          name: file.name,
          dataUrl: e.target.result,
          width: img.naturalWidth,
          height: img.naturalHeight
        });
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function render() {
  controls.classList.toggle("hidden", images.length === 0);
  countEl.textContent = images.length + " photo" + (images.length !== 1 ? "s" : "") + " \u00b7 drag to reorder";
  grid.innerHTML = "";
  images.forEach(function(img, idx) {
    var card = document.createElement("div");
    card.className = "card";
    card.draggable = true;

    var thumb = document.createElement("img");
    thumb.src = img.dataUrl; thumb.alt = img.name;
    card.appendChild(thumb);

    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var num = document.createElement("span");
    num.className = "num"; num.textContent = idx + 1;
    overlay.appendChild(num);
    var removeBtn = document.createElement("button");
    removeBtn.className = "remove"; removeBtn.textContent = "\u2715";
    removeBtn.addEventListener("click", function(e) { e.stopPropagation(); images.splice(idx, 1); render(); });
    overlay.appendChild(removeBtn);
    card.appendChild(overlay);

    var fn = document.createElement("div");
    fn.className = "filename"; fn.textContent = img.name;
    card.appendChild(fn);

    card.addEventListener("dragstart", function() { dragIdx = idx; card.classList.add("dragging"); });
    card.addEventListener("dragend", function() { dragIdx = null; card.classList.remove("dragging"); });
    card.addEventListener("dragover", function(e) {
      e.preventDefault();
      if (dragIdx !== null && dragIdx !== idx) {
        var item = images.splice(dragIdx, 1)[0];
        images.splice(idx, 0, item);
        dragIdx = idx;
        render();
      }
    });
    grid.appendChild(card);
  });
}

function generatePptx() {
  if (!images.length) return;
  hideError();
  downloadBtn.disabled = true;
  downloadBtn.textContent = "Generating\u2026";
  setTimeout(function() {
    try {
      var z = buildPptx(images);
      var b = new Blob([z], { type: "application/vnd.openxmlformats-officedocument.presentationml.presentation" });
      var u = URL.createObjectURL(b);
      var a = document.createElement("a"); a.href = u; a.download = "Photo_Album.pptx";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(u); }, 10000);
    } catch (err) { showError("Error: " + err.message); }
    downloadBtn.disabled = false;
    downloadBtn.textContent = "Download PowerPoint";
  }, 50);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Hot Seat — party game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;600;700;800&display=swap');

    :root {
      --char: #201623;
      --card: #2c2033;
      --card-2: #362a3e;
      --line: #4a3b52;
      --cream: #fff3e4;
      --smoke: #a795ae;
      --ember: #ff6b4a;
      --flame: #ffb03a;
      --mint: #7ed7c1;
      --heat: linear-gradient(135deg, #ffb03a 0%, #ff6b4a 55%, #ff4a6b 100%);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(1200px 500px at 50% -200px, rgba(255, 107, 74, 0.18), transparent 65%),
        var(--char);
      color: var(--cream);
      font-family: 'Outfit', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 56px;
    }

    #app {
      width: 100%;
      max-width: 460px;
    }

    .display {
      font-family: 'Lilita One', 'Outfit', sans-serif;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .logo {
      font-size: 44px;
      line-height: 1;
      text-align: center;
      margin: 8px 0 2px;
    }

    .logo.small {
      font-size: 30px;
      margin-top: 0;
    }

    .logo .hot {
      background: var(--heat);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tag {
      text-align: center;
      color: var(--smoke);
      font-size: 14px;
      margin: 0 0 26px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--smoke);
      margin-bottom: 8px;
    }

    .input {
      width: 100%;
      background: #1a1220;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      color: var(--cream);
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 600;
      padding: 13px 14px;
      outline: none;
    }

    .input:focus-visible {
      border-color: var(--flame);
      box-shadow: 0 0 0 3px rgba(255, 176, 58, 0.25);
    }

    .input.codebox {
      text-transform: uppercase;
      letter-spacing: 0.35em;
      text-align: center;
      font-size: 24px;
      font-weight: 800;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      color: #2a1408;
      background: var(--heat);
      transition: transform 0.06s ease, filter 0.15s ease;
      margin-top: 10px;
    }

    .btn:hover {
      filter: brightness(1.06);
    }

    .btn:active {
      transform: scale(0.985);
    }

    .btn:focus-visible {
      outline: 3px solid var(--mint);
      outline-offset: 2px;
    }

    .btn:disabled {
      background: var(--card-2);
      color: var(--smoke);
      cursor: default;
      filter: none;
    }

    .btn.ghost {
      background: transparent;
      border: 1.5px solid var(--line);
      color: var(--cream);
    }

    .btn.ghost:hover {
      border-color: var(--smoke);
    }

    .codeplate {
      background: var(--card-2);
      border: 1.5px dashed var(--flame);
      border-radius: 14px;
      text-align: center;
      padding: 12px 8px 14px;
      margin-bottom: 14px;
    }

    .codeplate .code {
      font-size: 40px;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
    }

    .codeplate .hint {
      font-size: 12.5px;
      color: var(--smoke);
      margin-top: 2px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 14.5px;
      font-weight: 700;
    }

    .chip.locked {
      border-color: var(--mint);
      color: var(--mint);
    }

    .chip.me {
      border-color: var(--flame);
    }

    .seat {
      position: relative;
      margin: 6px auto 16px;
      width: fit-content;
      max-width: 100%;
      padding: 10px 26px;
      border-radius: 999px;
      background: var(--heat);
      color: #2a1408;
      font-size: 20px;
      text-align: center;
      animation: flicker 2.6s ease-in-out infinite;
    }

    @keyframes flicker {

      0%,
      100% {
        box-shadow: 0 0 18px rgba(255, 107, 74, 0.55), 0 0 46px rgba(255, 176, 58, 0.28);
      }

      50% {
        box-shadow: 0 0 30px rgba(255, 107, 74, 0.85), 0 0 70px rgba(255, 176, 58, 0.45);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .seat {
        animation: none;
        box-shadow: 0 0 24px rgba(255, 107, 74, 0.6);
      }

      .dots::after {
        animation: none;
        content: '…';
      }
    }

    .qmeta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: var(--smoke);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .question {
      font-size: 27px;
      line-height: 1.18;
      margin: 2px 0 4px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 4px;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child {
      border-bottom: none;
    }

    .row .name {
      font-weight: 700;
    }

    .row .val {
      color: var(--smoke);
      font-weight: 600;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .row .val.good {
      color: var(--mint);
    }

    .row .val.left {
      text-align: left;
    }

    .toggle {
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: transparent;
      color: var(--smoke);
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 13px;
      padding: 7px 12px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle.on {
      background: var(--mint);
      border-color: var(--mint);
      color: #0f2a22;
    }

    .toggle:focus-visible {
      outline: 3px solid var(--flame);
      outline-offset: 2px;
    }

    .answerplate {
      background: var(--card-2);
      border-left: 4px solid var(--flame);
      border-radius: 10px;
      padding: 12px 14px;
      margin: 10px 0 14px;
      font-size: 19px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .answerplate .lbl {
      display: block;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--smoke);
      margin-bottom: 3px;
    }

    .lead {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--line);
    }

    .lead:last-child {
      border-bottom: none;
    }

    .lead .rank {
      font-size: 20px;
      width: 34px;
      text-align: center;
      flex-shrink: 0;
    }

    .lead .nm {
      font-weight: 700;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lead .pts {
      font-weight: 800;
      color: var(--flame);
    }

    .lead .delta {
      color: var(--mint);
      font-weight: 800;
      font-size: 13px;
      margin-left: 6px;
    }

    .note {
      color: var(--smoke);
      font-size: 13.5px;
      line-height: 1.45;
    }

    .wait {
      text-align: center;
      color: var(--smoke);
      font-weight: 600;
      padding: 8px 0 2px;
    }

    .dots::after {
      content: '…';
      animation: dots 1.4s steps(4) infinite;
    }

    @keyframes dots {
      0% {
        content: '';
      }

      25% {
        content: '.';
      }

      50% {
        content: '..';
      }

      75% {
        content: '...';
      }
    }

    .err {
      background: rgba(255, 74, 107, 0.14);
      border: 1px solid rgba(255, 74, 107, 0.5);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .back {
      background: none;
      border: none;
      color: var(--smoke);
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      padding: 6px 2px;
      margin-bottom: 4px;
    }

    .back:hover {
      color: var(--cream);
    }

    .select {
      width: 100%;
      background: #1a1220;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      color: var(--cream);
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      padding: 12px;
      outline: none;
    }

    .select:focus-visible {
      border-color: var(--flame);
    }

    .sub {
      font-size: 13px;
      color: var(--smoke);
      margin-top: 8px;
      text-align: center;
    }

    .gap {
      height: 12px;
    }

    .setup ol {
      padding-left: 20px;
      line-height: 1.6;
      font-size: 14.5px;
    }

    .setup code {
      background: #1a1220;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 13px;
      color: var(--flame);
    }

    .setup a {
      color: var(--mint);
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // ============================================================================
    // SETUP — paste your Firebase project config here (see setup screen or README)
    // ============================================================================
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "firebase/app";
    import { getAnalytics } from "firebase/analytics";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    const firebaseConfig = {
      apiKey: "AIzaSyCSHabacnuRaoMBe-D_-UZ3wK1rB8mbnxw",
      authDomain: "hot-seat-976fe.firebaseapp.com",
      databaseURL: "https://hot-seat-976fe-default-rtdb.firebaseio.com",
      projectId: "hot-seat-976fe",
      storageBucket: "hot-seat-976fe.firebasestorage.app",
      messagingSenderId: "462821411512",
      appId: "1:462821411512:web:4e983aa05ea1e7ddc3424d",
      measurementId: "G-Y8Q20BDN2N"
    };

    / Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    // ============================================================================

    const QUESTION_BANK = [
      "City where they were born",
      "Name of their high school",
      "Favorite movie of all time",
      "Go-to karaoke song",
      "Dream vacation destination",
      "First job they ever had",
      "Favorite pizza topping",
      "Celebrity they'd cast to play them in a movie",
      "Biggest pet peeve",
      "Favorite ice cream flavor",
      "Childhood nickname",
      "TV show they could rewatch forever",
      "Their usual coffee or tea order",
      "First concert they ever attended",
      "Favorite holiday",
      "A hidden talent they have",
      "Favorite fast food chain",
      "Sport they'd most likely win a medal in",
      "Fictional character they're most like",
      "Favorite season of the year",
      "Number of siblings they have",
      "The app they use most on their phone",
      "Favorite board or card game",
      "A food they refuse to eat",
      "Music artist they play the most right now",
      "Superpower they'd pick",
      "Their middle name",
      "A book they'd recommend to anyone",
      "Their usual breakfast",
      "Animal that best matches their personality",
      "Favorite color",
      "Car they learned to drive in",
      "Favorite restaurant in town",
      "Best subject back in school",
      "Movie they quote the most",
      "The one item they never leave home without",
      "Favorite dessert",
      "Age they got their first phone",
      "Their signature dance move",
      "Favorite outdoor activity",
      "Their celebrity crush",
      "Their comfort food",
      "Favorite video game",
      "Household chore they hate the most",
    ];

    // ---------------------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------------------
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const rid = () => Math.random().toString(36).slice(2, 10);
    const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
    const makeCode = () =>
      Array.from({ length: 4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
    const norm = (s) => (s || "").toLowerCase().trim().replace(/[^\p{L}\p{N}\s]/gu, "").replace(/\s+/g, " ");

    function autoMatch(answer, guess) {
      const a = norm(answer), g = norm(guess);
      if (!a || !g) return false;
      if (a === g) return true;
      if (a.length > 2 && g.length > 2 && (a.includes(g) || g.includes(a))) return true;
      return false;
    }

    function sampleQuestions(count, used) {
      const usedSet = new Set(used || []);
      let pool = QUESTION_BANK.filter((q) => !usedSet.has(q));
      if (pool.length < count) pool = [...QUESTION_BANK];
      const picked = [], copy = [...pool];
      while (picked.length < count && copy.length) {
        picked.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
      }
      return picked;
    }

    const configured = () => FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE");

    // ---------------------------------------------------------------------------
    // State
    // ---------------------------------------------------------------------------
    let db = null;
    let view = "home";          // home | create | join | game
    let me = null;              // { id, name }
    let code = "";
    let G = null;               // live game snapshot from Firebase
    let gameRef = null;
    let inputs = { name: "", code: "", answer: "" };
    let submittedFor = "";      // "round_q" I've locked in for
    let judgeDraft = null;      // { key, judgments }
    let confirmedFor = "";
    let qCount = 20;
    let hotSeatPick = "random";
    let err = "";
    let busy = false;

    const app = document.getElementById("app");
    const meta = () => (G && G.meta) || null;
    const players = () => (G && G.players) || {};
    const qk = () => { const m = meta(); return m ? m.round + "_" + m.qIndex : ""; };
    const hsaNow = () => { const m = meta(); return G && G.hsa && G.hsa[qk()] ? G.hsa[qk()] : null; };
    const guessesNow = () => (G && G.guesses && G.guesses[qk()]) || {};
    const isHost = () => me && meta() && meta().hostId === me.id;
    const iAmHot = () => me && meta() && meta().hotSeatId === me.id;
    const playerName = (pid) => (players()[pid] ? players()[pid].name : "?");
    const playerList = () =>
      Object.entries(players()).map(([id, p]) => ({ id, ...p }))
        .sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
    const questionCount = () => (meta() && meta().questions ? meta().questions.length : 0);

    // ---------------------------------------------------------------------------
    // Firebase wiring
    // ---------------------------------------------------------------------------
    function initFirebase() {
      if (db || !configured()) return;
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
    }

    function listen(c) {
      if (gameRef) gameRef.off();
      gameRef = db.ref("hotseat/" + c);
      gameRef.on("value", (snap) => { G = snap.val(); render(); },
        () => { err = "Lost connection to the game database. Check your Firebase rules allow reads."; render(); });
    }

    async function createGame() {
      const name = inputs.name.trim();
      if (!name) { err = "Enter your name first."; return render(); }
      busy = true; err = ""; render();
      try {
        let c = makeCode();
        for (let i = 0; i < 5; i++) {
          const snap = await db.ref("hotseat/" + c + "/meta").get();
          if (!snap.exists()) break;
          c = makeCode();
        }
        const hostId = rid();
        await db.ref("hotseat/" + c).set({
          meta: { code: c, hostId, phase: "lobby", round: 0, qIndex: 0, hotSeatId: null, createdAt: Date.now() },
          players: { [hostId]: { name, score: 0, joinedAt: Date.now() } },
        });
        me = { id: hostId, name };
        code = c; view = "game";
        listen(c);
      } catch (e) {
        err = "Couldn't create the game. Check your Firebase config and database rules.";
      }
      busy = false; render();
    }

    async function joinGame() {
      const name = inputs.name.trim();
      const c = inputs.code.trim().toUpperCase();
      if (!name) { err = "Enter your name first."; return render(); }
      if (c.length !== 4) { err = "Room codes are 4 letters."; return render(); }
      busy = true; err = ""; render();
      try {
        const snap = await db.ref("hotseat/" + c).get();
        if (!snap.exists()) { busy = false; err = "No game found with code " + c + ". Double-check it with your host."; return render(); }
        const g = snap.val();
        const existing = Object.entries(g.players || {}).find(([, p]) => norm(p.name) === norm(name));
        let myId;
        if (existing) {
          myId = existing[0];
          me = { id: myId, name: existing[1].name };
        } else {
          myId = rid();
          await db.ref("hotseat/" + c + "/players/" + myId).set({ name, score: 0, joinedAt: Date.now() });
          me = { id: myId, name };
        }
        code = c; view = "game";
        listen(c);
      } catch (e) {
        err = "Couldn't join. Check your connection and try again.";
      }
      busy = false; render();
    }

    // ---------------------------------------------------------------------------
    // Host actions
    // ---------------------------------------------------------------------------
    async function startRound() {
      const m = meta();
      const list = playerList();
      if (list.length < 2) { err = "You need at least 2 players to start."; return render(); }
      const hotSeatId = hotSeatPick === "random" || !players()[hotSeatPick]
        ? list[Math.floor(Math.random() * list.length)].id
        : hotSeatPick;
      const questions = sampleQuestions(qCount, m.usedQuestions);
      err = "";
      await gameRef.child("meta").update({
        round: m.round + 1,
        phase: "answering",
        qIndex: 0,
        questions,
        usedQuestions: [...(m.usedQuestions || []), ...questions],
        hotSeatId,
        reveal: null,
      });
    }

    async function closeQuestion() {
      const m = meta();
      const answer = hsaNow();
      if (!answer) { err = "The hot seat hasn't locked in an answer yet."; return render(); }
      const raw = guessesNow();
      const guesses = {}, judgments = {};
      Object.entries(raw).forEach(([pid, text]) => {
        if (pid === m.hotSeatId) return;
        guesses[pid] = text;
        judgments[pid] = autoMatch(answer, text);
      });
      err = "";
      await gameRef.child("meta").update({ phase: "judging", reveal: { answer, guesses, judgments } });
    }

    async function confirmJudgments() {
      const m = meta();
      const reveal = m.reveal || { guesses: {}, judgments: {} };
      const judgments = judgeDraft && judgeDraft.key === qk() ? judgeDraft.judgments : (reveal.judgments || {});
      confirmedFor = qk(); render();
      const updates = { "meta/phase": "results", "meta/reveal/judgments": judgments };
      Object.entries(judgments).forEach(([pid, right]) => {
        if (right) updates["players/" + pid + "/score"] = firebase.database.ServerValue.increment(1);
      });
      await gameRef.update(updates);
    }

    async function nextQuestion() {
      const m = meta();
      submittedFor = ""; judgeDraft = null; inputs.answer = "";
      if (m.qIndex + 1 >= questionCount()) {
        await gameRef.child("meta").update({ phase: "roundEnd" });
      } else {
        await gameRef.child("meta").update({ qIndex: m.qIndex + 1, phase: "answering", reveal: null });
      }
    }

    async function setPhase(phase) { await gameRef.child("meta").update({ phase }); }

    // ---------------------------------------------------------------------------
    // Player actions
    // ---------------------------------------------------------------------------
    async function lockInAnswer() {
      const text = inputs.answer.trim();
      if (!text || !meta()) return;
      busy = true; render();
      try {
        if (iAmHot()) await gameRef.child("hsa/" + qk()).set(text);
        else await gameRef.child("guesses/" + qk() + "/" + me.id).set(text);
        submittedFor = qk();
        inputs.answer = "";
        err = "";
      } catch (e) {
        err = "Couldn't save your answer — try locking in again.";
      }
      busy = false; render();
    }

    // ---------------------------------------------------------------------------
    // Views (HTML string builders)
    // ---------------------------------------------------------------------------
    const logo = (small) =>
      '<h1 class="display logo' + (small ? " small" : "") + '"><span class="hot">HOT</span> SEAT</h1>' +
      (small ? "" : '<p class="tag">How well do your friends really know you?</p>');
    const errBox = () => (err ? '<div class="err">' + esc(err) + "</div>" : "");
    const waitLine = (t) => '<p class="wait">' + t + '<span class="dots"></span></p>';

    function leaderboardHtml(gains) {
      const sorted = playerList().sort((a, b) => b.score - a.score);
      const medal = (i) => (i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1);
      return sorted.map((p, i) =>
        '<div class="lead"><span class="rank display">' + medal(i) + '</span><span class="nm">' + esc(p.name) + "</span>" +
        (gains && gains[p.id] ? '<span class="delta">+1</span>' : "") +
        '<span class="pts">' + (p.score || 0) + "</span></div>").join("");
    }

    function setupView() {
      return logo() + '<div class="card setup">' +
        '<div class="label">One-time setup needed</div>' +
        '<p class="note">This page syncs players through Firebase (a free Google service). To get it running:</p>' +
        "<ol>" +
        '<li>Go to <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a> and create a project (any name).</li>' +
        "<li>In the project, choose <b>Build → Realtime Database → Create database</b>, and start in <b>test mode</b>.</li>" +
        '<li>Go to <b>Project settings → General → Your apps</b>, add a <b>Web app</b>, and copy the <code>firebaseConfig</code> values it shows you.</li>' +
        "<li>Open this HTML file in a text editor and paste those values into the <code>FIREBASE_CONFIG</code> block near the top.</li>" +
        "<li>Upload the file to your server. Done — everyone uses the same URL to play.</li>" +
        "</ol>" +
        '<p class="note">Note: test-mode rules leave the database publicly readable and writable, which is fine for casual party games but don\'t reuse the project for anything sensitive. Test mode also expires after 30 days — you can extend it in the Rules tab.</p>' +
        "</div>";
    }

    function homeView() {
      return logo() +
        '<div class="card"><div class="label">Your name</div>' +
        '<input class="input" id="in-name" maxlength="20" placeholder="e.g. Alex" value="' + esc(inputs.name) + '"></div>' +
        errBox() +
        '<button class="btn" id="bt-host"' + (busy ? " disabled" : "") + ">Host a game</button>" +
        '<button class="btn ghost" id="bt-join"' + (busy ? " disabled" : "") + ">Join with a code</button>" +
        '<p class="sub">Everyone opens this same page on their phone. Answers and scores are shared with the whole room.</p>';
    }

    function createView() {
      return '<button class="back" id="bt-back">← Back</button>' + logo(true) +
        '<div class="card"><div class="label">Hosting as</div>' +
        '<input class="input" id="in-name" maxlength="20" placeholder="Your name" value="' + esc(inputs.name) + '"></div>' +
        errBox() +
        '<button class="btn" id="bt-create"' + (busy ? " disabled" : "") + ">" + (busy ? "Setting up…" : "Create room") + "</button>";
    }

    function joinView() {
      return '<button class="back" id="bt-back">← Back</button>' + logo(true) +
        '<div class="card"><div class="label">Room code</div>' +
        '<input class="input codebox" id="in-code" maxlength="4" placeholder="ABCD" autocapitalize="characters" value="' + esc(inputs.code) + '"></div>' +
        '<div class="card"><div class="label">Your name</div>' +
        '<input class="input" id="in-name" maxlength="20" placeholder="Your name" value="' + esc(inputs.name) + '"></div>' +
        errBox() +
        '<button class="btn" id="bt-dojoin"' + (busy ? " disabled" : "") + ">" + (busy ? "Joining…" : "Join game") + "</button>";
    }

    function pickerCards(startLabel) {
      const opts = playerList().map((p) =>
        '<option value="' + esc(p.id) + '"' + (hotSeatPick === p.id ? " selected" : "") + ">" + esc(p.name) + "</option>").join("");
      return '<div class="card">' +
        '<div class="label">Questions this round</div>' +
        '<select class="select" id="sel-count">' +
        [10, 15, 20].map((n) => '<option value="' + n + '"' + (qCount === n ? " selected" : "") + ">" + n + " — " +
          (n === 10 ? "quick" : n === 15 ? "medium" : "full") + " round</option>").join("") +
        "</select>" +
        '<div class="gap"></div>' +
        '<div class="label">Who takes the hot seat?</div>' +
        '<select class="select" id="sel-hot"><option value="random"' + (hotSeatPick === "random" ? " selected" : "") + ">🎲 Pick someone at random</option>" + opts + "</select>" +
        "</div>" + errBox() +
        '<button class="btn" id="bt-start"' + (playerList().length < 2 ? " disabled" : "") + ">" + startLabel + "</button>";
    }

    function lobbyView() {
      const m = meta();
      let h = logo(true) +
        '<div class="codeplate"><div class="display code">' + esc(m.code) + "</div>" +
        '<div class="hint">Friends join with this code on the same page</div></div>' +
        '<div class="card"><div class="label">In the room (' + playerList().length + ')</div><div class="chips">' +
        playerList().map((p) => '<span class="chip' + (p.id === me.id ? " me" : "") + '">' + esc(p.name) + (p.id === m.hostId ? " ★" : "") + "</span>").join("") +
        "</div></div>";
      if (isHost()) {
        h += pickerCards("Start round 1");
        if (playerList().length < 2) h += '<p class="sub">Waiting for at least one more player to join.</p>';
      } else {
        h += waitLine("Waiting for " + esc(playerName(m.hostId)) + " to start the game");
      }
      return h;
    }

    function answeringView() {
      const m = meta();
      const hotName = esc(playerName(m.hotSeatId));
      const iLocked = submittedFor === qk() || (iAmHot() ? !!hsaNow() : guessesNow()[me.id] != null);
      const hotLocked = !!hsaNow();
      const lockedSet = new Set(Object.keys(guessesNow()));
      let h = '<div class="seat display">🔥 ' + hotName + " is in the hot seat</div>" +
        '<div class="card"><div class="qmeta"><span>Round ' + m.round + "</span><span>Question " + (m.qIndex + 1) + " / " + questionCount() + "</span></div>" +
        '<div class="display question">' + esc(m.questions[m.qIndex]) + "</div></div>";
      if (iLocked) {
        h += waitLine("Locked in ✓ Waiting on the rest of the room");
      } else {
        h += '<div class="card"><div class="label">' +
          (iAmHot() ? "Your answer — the truth!" : "What will " + hotName + " say?") + "</div>" +
          '<input class="input" id="in-answer" maxlength="80" placeholder="Type your answer" value="' + esc(inputs.answer) + '">' +
          '<button class="btn" id="bt-lock"' + (busy || !inputs.answer.trim() ? " disabled" : "") + ">Lock it in</button></div>";
      }
      h += '<div class="card"><div class="label">Who\'s locked in</div><div class="chips">' +
        '<span class="chip' + (hotLocked ? " locked" : "") + '">🔥 ' + hotName + (hotLocked ? " ✓" : "") + "</span>" +
        playerList().filter((p) => p.id !== m.hotSeatId).map((p) =>
          '<span class="chip' + (lockedSet.has(p.id) ? " locked" : "") + '">' + esc(p.name) + (lockedSet.has(p.id) ? " ✓" : "") + "</span>").join("") +
        "</div></div>" + errBox();
      if (isHost()) {
        h += '<button class="btn" id="bt-close"' + (hotLocked ? "" : " disabled") + ">Close question &amp; reveal</button>";
        if (!hotLocked) h += '<p class="sub">You can reveal once ' + (iAmHot() ? "you've" : hotName + " has") + " locked in the real answer.</p>";
      }
      return h;
    }

    function judgingView() {
      const m = meta();
      const hotName = esc(playerName(m.hotSeatId));
      const reveal = m.reveal || { answer: "", guesses: {}, judgments: {} };
      const guesses = reveal.guesses || {};
      const draft = judgeDraft && judgeDraft.key === qk() ? judgeDraft.judgments : (reveal.judgments || {});
      const sent = confirmedFor === qk();
      const entries = Object.entries(guesses);
      const qcard = '<div class="card"><div class="qmeta"><span>Round ' + m.round + "</span><span>Question " + (m.qIndex + 1) + " / " + questionCount() + "</span></div>" +
        '<div class="display question">' + esc(m.questions[m.qIndex]) + "</div>";

      if (!iAmHot()) {
        return '<div class="seat display">🔥 ' + hotName + " is judging</div>" + qcard +
          '<div class="answerplate"><span class="lbl">' + hotName + "'s answer</span>" + esc(reveal.answer) + "</div>" +
          '<div class="label">Everyone\'s guesses</div>' +
          (entries.length === 0 ? '<p class="note">No guesses came in for this one.</p>' : "") +
          entries.map(([pid, text]) =>
            '<div class="row"><span class="name">' + esc(playerName(pid)) + '</span><span class="val">' + (esc(text) || "<em>blank</em>") + "</span></div>").join("") +
          "</div>" + waitLine(hotName + " is deciding who nailed it");
      }

      return '<div class="seat display">🔥 You\'re the judge</div>' + qcard +
        '<div class="answerplate"><span class="lbl">Your answer</span>' + esc(reveal.answer) + "</div>" +
        '<div class="label">Tap to mark each guess right or wrong</div>' +
        (entries.length === 0 ? '<p class="note">No guesses came in for this one.</p>' : "") +
        entries.map(([pid, text]) =>
          '<div class="row"><div style="min-width:0"><div class="name">' + esc(playerName(pid)) + '</div>' +
          '<div class="val left">' + (esc(text) || "<em>blank</em>") + "</div></div>" +
          '<button class="toggle' + (draft[pid] ? " on" : "") + '" data-pid="' + esc(pid) + '"' + (sent ? " disabled" : "") + ">" +
          (draft[pid] ? "✓ Right" : "✗ Wrong") + "</button></div>").join("") +
        "</div>" + errBox() +
        (sent ? waitLine("Ruling sent — updating scores") :
          '<button class="btn" id="bt-confirm">Confirm scores</button>');
    }

    function resultsView() {
      const m = meta();
      const hotName = esc(playerName(m.hotSeatId));
      const reveal = m.reveal || { answer: "", guesses: {}, judgments: {} };
      const guesses = reveal.guesses || {};
      const judgments = reveal.judgments || {};
      const last = m.qIndex + 1 >= questionCount();
      return '<div class="seat display">🔥 ' + hotName + "</div>" +
        '<div class="card"><div class="qmeta"><span>Round ' + m.round + "</span><span>Question " + (m.qIndex + 1) + " / " + questionCount() + "</span></div>" +
        '<div class="display question">' + esc(m.questions[m.qIndex]) + "</div>" +
        '<div class="answerplate"><span class="lbl">The truth</span>' + esc(reveal.answer) + "</div>" +
        Object.entries(guesses).map(([pid, text]) =>
          '<div class="row"><span class="name">' + esc(playerName(pid)) + '</span><span class="val' + (judgments[pid] ? " good" : "") + '">' +
          (esc(text) || "<em>blank</em>") + (judgments[pid] ? " · +1" : "") + "</span></div>").join("") +
        "</div>" +
        '<div class="card"><div class="label">Leaderboard</div>' + leaderboardHtml(judgments) + "</div>" +
        (isHost()
          ? '<button class="btn" id="bt-next">' + (last ? "Finish round" : "Next question") + "</button>"
          : waitLine("Waiting for " + esc(playerName(m.hostId))));
    }

    function roundEndView() {
      const m = meta();
      let h = logo(true) +
        '<div class="card"><div class="label">Round ' + m.round + ' complete — leaderboard</div>' + leaderboardHtml() + "</div>";
      if (isHost()) {
        h += pickerCards("Start round " + (m.round + 1)) +
          '<button class="btn ghost" id="bt-end">End game</button>';
      } else {
        h += waitLine("Waiting for " + esc(playerName(m.hostId)) + " to start the next round");
      }
      return h;
    }

    function overView() {
      const sorted = playerList().sort((a, b) => b.score - a.score);
      const champ = sorted[0];
      return logo(true) +
        '<div class="seat display">🏆 ' + (champ ? esc(champ.name) : "—") + " wins!</div>" +
        '<div class="card"><div class="label">Final standings</div>' + leaderboardHtml() + "</div>" +
        (isHost() ? '<button class="btn ghost" id="bt-onemore">Actually… one more round</button>' : "");
    }

    function gameView() {
      if (!G || !meta()) return waitLine("Connecting");
      switch (meta().phase) {
        case "lobby": return lobbyView();
        case "answering": return answeringView();
        case "judging": return judgingView();
        case "results": return resultsView();
        case "roundEnd": return roundEndView();
        case "over": return overView();
        default: return waitLine("Connecting");
      }
    }

    // ---------------------------------------------------------------------------
    // Render + event binding (focus-preserving)
    // ---------------------------------------------------------------------------
    function render() {
      const active = document.activeElement && document.activeElement.id;
      let selStart = null;
      if (active && typeof document.activeElement.selectionStart === "number") {
        selStart = document.activeElement.selectionStart;
      }

      let html;
      if (!configured()) html = setupView();
      else if (view === "home") html = homeView();
      else if (view === "create") html = createView();
      else if (view === "join") html = joinView();
      else html = gameView();
      app.innerHTML = html;
      bind();

      if (active) {
        const el = document.getElementById(active);
        if (el) {
          el.focus();
          if (selStart != null) { try { el.selectionStart = el.selectionEnd = selStart; } catch (e) { } }
        }
      }
    }

    function on(id, fn) { const el = document.getElementById(id); if (el) el.onclick = fn; }

    function bind() {
      const nameEl = document.getElementById("in-name");
      if (nameEl) nameEl.oninput = (e) => { inputs.name = e.target.value; };
      const codeEl = document.getElementById("in-code");
      if (codeEl) codeEl.oninput = (e) => {
        inputs.code = e.target.value.toUpperCase();
        if (e.target.value !== inputs.code) { e.target.value = inputs.code; }
      };
      const ansEl = document.getElementById("in-answer");
      if (ansEl) {
        ansEl.oninput = (e) => {
          inputs.answer = e.target.value;
          const b = document.getElementById("bt-lock");
          if (b) b.disabled = busy || !inputs.answer.trim();
        };
        ansEl.onkeydown = (e) => { if (e.key === "Enter") lockInAnswer(); };
      }

      on("bt-host", () => { err = ""; view = "create"; render(); });
      on("bt-join", () => { err = ""; view = "join"; render(); });
      on("bt-back", () => { err = ""; view = "home"; render(); });
      on("bt-create", createGame);
      on("bt-dojoin", joinGame);
      on("bt-start", startRound);
      on("bt-lock", lockInAnswer);
      on("bt-close", closeQuestion);
      on("bt-confirm", confirmJudgments);
      on("bt-next", nextQuestion);
      on("bt-end", () => setPhase("over"));
      on("bt-onemore", () => setPhase("roundEnd"));

      const selCount = document.getElementById("sel-count");
      if (selCount) selCount.onchange = (e) => { qCount = Number(e.target.value); };
      const selHot = document.getElementById("sel-hot");
      if (selHot) selHot.onchange = (e) => { hotSeatPick = e.target.value; };

      document.querySelectorAll(".toggle[data-pid]").forEach((btn) => {
        btn.onclick = () => {
          const pid = btn.getAttribute("data-pid");
          const m = meta();
          const reveal = (m && m.reveal) || { judgments: {} };
          const base = judgeDraft && judgeDraft.key === qk() ? judgeDraft.judgments : { ...(reveal.judgments || {}) };
          judgeDraft = { key: qk(), judgments: { ...base, [pid]: !base[pid] } };
          render();
        };
      });
    }

    // ---------------------------------------------------------------------------
    // Boot
    // ---------------------------------------------------------------------------
    try { initFirebase(); } catch (e) { err = "Firebase failed to load — check your config values."; }
    render();
  </script>
</body>

</html>

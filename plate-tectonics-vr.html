<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Plate Tectonics VR</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#06090f; color:#dde; font-family:system-ui,sans-serif; overflow:hidden; }
    #app { position:fixed; inset:0; }
    #status { position:fixed; top:10px; right:10px; background:rgba(0,0,0,.55); border:1px solid #2a3340; padding:6px 10px; border-radius:6px; font-size:12px; z-index:5; }
    #status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#5fa; margin-right:6px; vertical-align:middle; }
    #help { position:fixed; bottom:10px; left:10px; background:rgba(0,0,0,.55); border:1px solid #2a3340; padding:8px 12px; border-radius:6px; font-size:12px; max-width:340px; z-index:5; line-height:1.45; }
    #help b { color:#fc8; }
  </style>
</head>
<body>
<div id="app"></div>

<div id="status"><span class="dot"></span><span id="status-text">Loading…</span></div>
<div id="help">
  <b>VR (Quest 3):</b> point a controller and pull the trigger to click buttons, grab plates, or grab the gold pedestal to rotate.<br>
  <b>Desktop:</b> left-click + drag plates or pedestal &middot; click buttons with the cursor &middot; right-drag to orbit the camera.
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================================
// 1. ENGINE BOOTSTRAP
//    Renderer, scene, camera, lighting. Persistent across all scenes.
// ============================================================================
const statusEl = document.getElementById('status-text');
const setStatus = m => { statusEl.textContent = m; };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x06090f, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;
document.getElementById('app').appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const world = new THREE.Scene();
world.background = new THREE.Color(0x06090f);
world.fog = new THREE.Fog(0x06090f, 6, 18);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.05, 200);
camera.position.set(0, 1.6, 1.4);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 1.4, -0.5);
orbit.enableDamping = true;
orbit.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };

// Lighting (warm key from upper right, cool fill from left, ambient hemi)
const hemi = new THREE.HemisphereLight(0x7a8898, 0x1a1410, 0.65);
world.add(hemi);
const key = new THREE.DirectionalLight(0xfff2d8, 1.05);
key.position.set(2.5, 4, 1.2); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0005;
world.add(key);
const rim = new THREE.DirectionalLight(0x88a4d4, 0.4);
rim.position.set(-3, 2, -2);
world.add(rim);

// Ground grid (helps orientation in VR)
const grid = new THREE.GridHelper(20, 40, 0x2a3340, 0x141a22);
grid.material.opacity = 0.45; grid.material.transparent = true;
world.add(grid);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================================
// 2. SHARED HELPERS
//    Text panels, buttons, geometry helpers. Reused by every scene.
// ============================================================================

// Build a CanvasTexture-backed text panel. Simple, readable, no font loading.
function makeTextPanel(opts) {
  const {
    text, width = 2, height = 0.6,
    bg = '#15202a', fg = '#fff', accent = null,
    fontSize = 32, padding = 24, lineHeight = 1.3,
    align = 'left', titleSize = 0
  } = opts;
  const cw = 1024, ch = Math.round(cw * (height/width));
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  const ctx = c.getContext('2d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, cw, ch);
  if (accent) {
    ctx.fillStyle = accent;
    ctx.fillRect(0, 0, 8, ch);
  }
  ctx.fillStyle = fg;
  ctx.textBaseline = 'top';
  ctx.font = `${fontSize}px system-ui, sans-serif`;
  ctx.textAlign = align;

  // Word-wrap with explicit \n support
  const lines = [];
  const paragraphs = text.split('\n');
  const maxW = cw - padding * 2 - (accent ? 12 : 0);
  for (const p of paragraphs) {
    if (p === '') { lines.push(''); continue; }
    const words = p.split(' ');
    let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxW) {
        lines.push(cur);
        cur = w;
      } else cur = test;
    }
    if (cur) lines.push(cur);
  }
  const xBase = align === 'center' ? cw/2 : padding + (accent ? 12 : 0);
  let y = padding;
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], xBase, y);
    y += fontSize * lineHeight;
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, height), mat);
  mesh.userData.canvas = c;
  mesh.userData.ctx = ctx;
  mesh.userData.tex = tex;
  return mesh;
}

// Clickable 3D button with hover state and label.
function makeButton({ label, color = '#2a5298', hover = '#ffaa00', width = 0.7, height = 0.22, onClick }) {
  const group = new THREE.Group();
  const geo = new THREE.BoxGeometry(width, height, 0.04);
  const mat = new THREE.MeshStandardMaterial({ color, metalness: 0.1, roughness: 0.6 });
  const box = new THREE.Mesh(geo, mat);
  box.castShadow = true;
  group.add(box);

  // Label as text panel mounted on the front face
  const labelPlane = makeTextPanel({
    text: label, width: width * 0.95, height: height * 0.85,
    bg: '#00000000', fg: '#fff',
    fontSize: 64, align: 'center', padding: 8
  });
  // Manually re-render with transparent background
  const ctx = labelPlane.userData.ctx;
  const cw = labelPlane.userData.canvas.width, ch = labelPlane.userData.canvas.height;
  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 80px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Wrap if needed
  const lines = label.split('\n');
  const lh = 90;
  const startY = ch/2 - (lines.length - 1) * lh / 2;
  lines.forEach((ln, i) => ctx.fillText(ln, cw/2, startY + i * lh));
  labelPlane.userData.tex.needsUpdate = true;
  labelPlane.position.z = 0.022;
  group.add(labelPlane);

  group.userData.isButton = true;
  group.userData.baseColor = new THREE.Color(color);
  group.userData.hoverColor = new THREE.Color(hover);
  group.userData.box = box;
  group.userData.onClick = onClick;
  return group;
}

// Slab cross-section: a box showing crust + mantle layers as colored stripes.
// Used in simulation scenes as the "ground" the continents sit on.
function makeMantleSlab({ width = 4, height = 0.5, depth = 0.5 }) {
  const g = new THREE.Group();
  // Mantle (warm orange-red) — bottom 70%
  const mantleH = height * 0.7;
  const mantle = new THREE.Mesh(
    new THREE.BoxGeometry(width, mantleH, depth),
    new THREE.MeshStandardMaterial({ color: 0x8b3a1a, roughness: 0.95 })
  );
  mantle.position.y = -height/2 + mantleH/2;
  g.add(mantle);
  // Asthenosphere (glowing orange) — middle 15%
  const asthH = height * 0.18;
  const asth = new THREE.Mesh(
    new THREE.BoxGeometry(width, asthH, depth),
    new THREE.MeshStandardMaterial({
      color: 0xff7733, emissive: 0xcc4400, emissiveIntensity: 0.6, roughness: 0.5
    })
  );
  asth.position.y = -height/2 + mantleH + asthH/2;
  g.add(asth);
  // Lithosphere base (dark grey) — top sliver
  const lithH = height - mantleH - asthH;
  const lith = new THREE.Mesh(
    new THREE.BoxGeometry(width, lithH, depth),
    new THREE.MeshStandardMaterial({ color: 0x2a2a30, roughness: 0.9 })
  );
  lith.position.y = -height/2 + mantleH + asthH + lithH/2;
  g.add(lith);
  g.userData.surfaceY = -height/2 + height; // top of slab in local coords
  g.userData.height = height;
  return g;
}

// Maximum displacement (above the plate's flat top) for each terrain style.
// Continental hills are very visible — comparable to ~70% of plate thickness;
// oceanic ridges stay subtle so the plate still reads as a flat seafloor.
const TERRAIN_MAX_ELEV = { continental: 0.14, oceanic: 0.012, none: 0 };

// Stable per-plate noise phase derived from dimensions, so two plates of
// different sizes get distinct terrain patterns deterministically.
function _terrainPhi(width, depth, height) {
  return width * 3.7 + depth * 1.9 + height * 17.1;
}

// Sample the terrain height at a point on a plate, in plate-local coordinates
// (origin = plate center). Three octaves of summed sines, with the largest
// component weighted most heavily for big rolling hills, plus a smooth squared
// falloff toward the perimeter so coastlines stay flush with the plate's sides.
function _terrainHeightAt(x, z, width, depth, maxElev, phi) {
  const e1 = Math.sin(x * 3.5 + phi)         * Math.cos(z * 4.0 + phi * 1.3) * 1.4;
  const e2 = Math.sin(x * 8.0 + phi * 2)     * Math.cos(z * 6.5 + phi * 0.7) * 0.5;
  const e3 = Math.sin(x * 16  + phi * 3)     * Math.cos(z * 14  + phi * 1.7) * 0.25;
  const e  = (e1 + e2 + e3) / 2.15;          // normalize so theoretical max ≈ 1
  const fx = 1 - Math.pow(Math.abs(x) / (width/2), 2);
  const fz = 1 - Math.pow(Math.abs(z) / (depth/2), 2);
  const fall = Math.max(0, fx) * Math.max(0, fz);
  return Math.max(0, e) * maxElev * fall;
}

// Builds the geometry for a continent — a subdivided box whose inner top-face
// vertices are displaced upward by the terrain noise above, with vertex colors
// that darken sides, lift peaks toward brown, and tint the highest peaks lighter
// (suggesting rocky/snowy alpine zones). Perimeter top vertices stay at base
// height so the sides remain flush.
function makeContinentGeometry(width, depth, height, terrain = 'continental', baseColor = 0x4a7c4e) {
  const isOceanic = terrain === 'oceanic';
  const isFlat    = terrain === 'none';
  const segW = isFlat ? 1 : (isOceanic ? 8  : 18);
  const segD = isFlat ? 1 : (isOceanic ? 5  : 11);
  const geo = new THREE.BoxGeometry(width, height, depth, segW, 1, segD);

  const positions = geo.attributes.position;
  const baseCol   = new THREE.Color(baseColor);
  const peakCol   = isOceanic
    ? new THREE.Color(baseColor).multiplyScalar(0.55)
    : new THREE.Color(0x9a7855);                       // tan/brown mountain tops
  const alpineCol = new THREE.Color(0xb5a890);         // pale rocky/snowy crests
  const sideCol   = isOceanic ? new THREE.Color(0x2a3540) : new THREE.Color(0x5d3a1f);
  const bottomCol = new THREE.Color(0x171717);

  const maxElev = TERRAIN_MAX_ELEV[terrain] ?? 0;
  const phi     = _terrainPhi(width, depth, height);
  const colors  = new Float32Array(positions.count * 3);

  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    const z = positions.getZ(i);
    const onTop        = Math.abs(y - height/2) < 0.001;
    const onBottom     = Math.abs(y + height/2) < 0.001;
    const onPerimeterX = Math.abs(Math.abs(x) - width/2) < 0.0005;
    const onPerimeterZ = Math.abs(Math.abs(z) - depth/2) < 0.0005;

    let c;
    if (onTop && !onPerimeterX && !onPerimeterZ && !isFlat) {
      // Inner top face — displace upward and color by elevation
      const elev = _terrainHeightAt(x, z, width, depth, maxElev, phi);
      positions.setY(i, height/2 + elev);
      const t = Math.min(1, elev / maxElev);
      // Two-stage gradient: green → brown → pale alpine
      if (t < 0.7) {
        c = baseCol.clone().lerp(peakCol, (t / 0.7) * 0.85);
      } else {
        c = peakCol.clone().lerp(alpineCol, (t - 0.7) / 0.3);
      }
    } else if (onTop) {
      c = baseCol.clone();   // flush coast at base color
    } else if (onBottom) {
      c = bottomCol;
    } else {
      // Side wall — gradient from darker base near bottom to lighter near top
      const tY = (y + height/2) / height;
      c = sideCol.clone().lerp(baseCol, tY * 0.35);
    }
    colors[i * 3]     = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  return geo;
}

// Scatter a few low-poly trees across the top of a continental plate, sampling
// the same terrain noise so each tree sits on the actual hill at its location
// instead of getting buried below the surface.
function addTreesToContinent(mesh, width, depth, height) {
  const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1f3a25, roughness: 0.9 });
  const trunkMat   = new THREE.MeshStandardMaterial({ color: 0x3a2818, roughness: 0.95 });
  const maxElev = TERRAIN_MAX_ELEV.continental;
  const phi     = _terrainPhi(width, depth, height);
  const numTrees = Math.max(3, Math.round(width * depth * 8));
  for (let i = 0; i < numTrees; i++) {
    const tree = new THREE.Group();
    tree.userData.isTree = true;
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.006, 0.008, 0.03, 5), trunkMat
    );
    trunk.position.y = 0.015;
    tree.add(trunk);
    const foliage = new THREE.Mesh(
      new THREE.ConeGeometry(0.025, 0.06, 6), foliageMat
    );
    foliage.position.y = 0.06;
    tree.add(foliage);
    const tx = (Math.random() - 0.5) * width * 0.75;
    const tz = (Math.random() - 0.5) * depth * 0.75;
    const ty = _terrainHeightAt(tx, tz, width, depth, maxElev, phi);
    // Plant the tree on top of whatever hill / valley it lands in
    tree.position.set(tx, height/2 + ty + 0.002, tz);
    tree.rotation.y = Math.random() * Math.PI * 2;
    const s = 0.85 + Math.random() * 0.4;
    tree.scale.set(s, s, s);
    mesh.add(tree);
  }
}

// A "continent" — subdivided box with displaced terrain top, vertex-colored
// for elevation tinting, plus tree decorations on continental variants.
function makeContinent({ name, width = 1, depth = 0.4, height = 0.12, color = 0x4a7c4e, terrain = 'continental' }) {
  const geo = makeContinentGeometry(width, depth, height, terrain, color);
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData.name        = name;
  mesh.userData.width       = width;
  mesh.userData.depth       = depth;
  mesh.userData.height      = height;
  mesh.userData.baseColor   = color;     // remembered so resizing scenes can rebuild geometry
  mesh.userData.terrain     = terrain;
  mesh.userData.isContinent = true;
  mesh.userData.draggable   = true;
  if (terrain === 'continental') addTreesToContinent(mesh, width, depth, height);
  return mesh;
}

// ============================================================================
// 3. INTERACTION SYSTEM
//    Raycaster-based hover/click + grab-and-drag for both XR controllers and
//    desktop mouse. The active scene exposes `clickables` and `draggables`
//    arrays — this layer stays generic.
// ============================================================================
const raycaster = new THREE.Raycaster();
const tmpVec = new THREE.Vector3();
const tmpDir = new THREE.Vector3();
const tmpMat = new THREE.Matrix4();

let hoveredButton = null;
let dragTarget = null;
let dragController = null;
let dragOffsetWorld = new THREE.Vector3();
let dragStartDistance = 0;
// Rotator drag state — set when isRotator object is grabbed; null otherwise
let rotState = null;
const TILT_MIN = -Math.PI / 1.7;  // ~-105° (lets user lean it back to look "down" on top)
const TILT_MAX =  Math.PI / 12;   // ~+15°
const ROT_SENS_VR = 2.5;          // radians per meter of hand motion
const ROT_SENS_MOUSE = 3.0;       // radians per NDC unit

const controllers = [];
const controllerModelFactory = new XRControllerModelFactory();

for (let i = 0; i < 2; i++) {
  const ctl = renderer.xr.getController(i);
  ctl.userData.id = i;
  ctl.addEventListener('selectstart', () => onSelectStart(ctl));
  ctl.addEventListener('selectend', () => onSelectEnd(ctl));
  world.add(ctl);
  // Visible ray
  const lineGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -10)
  ]);
  const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.7 }));
  ctl.add(line);
  // Hand model
  const grip = renderer.xr.getControllerGrip(i);
  grip.add(controllerModelFactory.createControllerModel(grip));
  world.add(grip);
  controllers.push(ctl);
}

function makeControllerRay(controller) {
  tmpMat.identity().extractRotation(controller.matrixWorld);
  const origin = new THREE.Vector3().setFromMatrixPosition(controller.matrixWorld);
  const direction = new THREE.Vector3(0, 0, -1).applyMatrix4(tmpMat).normalize();
  return { origin, direction };
}

function intersectButtons(ray) {
  raycaster.set(ray.origin, ray.direction);
  const targets = sceneManager.getClickables().map(g => g.userData.box || g);
  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) return null;
  // Walk up to the button group
  let obj = hits[0].object;
  while (obj && !obj.userData.isButton) obj = obj.parent;
  return obj || null;
}

function intersectDraggables(ray) {
  raycaster.set(ray.origin, ray.direction);
  const targets = sceneManager.getDraggables();
  const hits = raycaster.intersectObjects(targets, false);
  return hits.length ? hits[0] : null;
}

function setHover(btn) {
  if (hoveredButton === btn) return;
  if (hoveredButton) {
    hoveredButton.userData.box.material.color.copy(hoveredButton.userData.baseColor);
    hoveredButton.scale.set(1, 1, 1);
  }
  hoveredButton = btn;
  if (hoveredButton) {
    hoveredButton.userData.box.material.color.copy(hoveredButton.userData.hoverColor);
    hoveredButton.scale.set(1.05, 1.05, 1.05);
  }
}

function onSelectStart(controller) {
  const ray = makeControllerRay(controller);
  // Buttons take priority
  const btn = intersectButtons(ray);
  if (btn) {
    btn.userData.onClick?.();
    return;
  }
  // Then draggables
  const hit = intersectDraggables(ray);
  if (hit && !dragTarget) {
    dragTarget = hit.object;
    dragController = controller;
    dragStartDistance = hit.distance;
    if (dragTarget.userData.isRotator && dragTarget.userData.platform) {
      // Rotation mode — track controller world position
      const platform = dragTarget.userData.platform;
      rotState = {
        type: 'vr',
        platform,
        controller,
        startCtrlPos: new THREE.Vector3().setFromMatrixPosition(controller.matrixWorld),
        startRotX: platform.rotation.x,
        startRotY: platform.rotation.y
      };
    } else {
      // Position-drag mode (continents). Offset must be in WORLD space — the
      // dragTarget sits inside a rotatable platform group, so its local position
      // differs from its world position once the platform is tilted/spun.
      const targetWorldPos = new THREE.Vector3();
      dragTarget.getWorldPosition(targetWorldPos);
      const hitWorldPos = ray.origin.clone().add(ray.direction.clone().multiplyScalar(dragStartDistance));
      dragOffsetWorld.copy(targetWorldPos).sub(hitWorldPos);
      sceneManager.current?.onDragStart?.(dragTarget);
    }
  }
}
function onSelectEnd(controller) {
  if (dragTarget && dragController === controller) {
    if (!rotState) sceneManager.current?.onDragEnd?.(dragTarget);
    dragTarget = null;
    dragController = null;
    rotState = null;
  }
}

// Desktop mouse fallback (fires fake controller events)
const mouse = new THREE.Vector2();
let mouseDown = false;
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return; // left only
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const ray = { origin: raycaster.ray.origin.clone(), direction: raycaster.ray.direction.clone() };
  const btn = intersectButtons(ray);
  if (btn) { btn.userData.onClick?.(); return; }
  const hit = intersectDraggables(ray);
  if (hit) {
    dragTarget = hit.object;
    dragController = null; // signals mouse drag
    dragStartDistance = hit.distance;
    orbit.enabled = false;
    if (dragTarget.userData.isRotator && dragTarget.userData.platform) {
      const platform = dragTarget.userData.platform;
      rotState = {
        type: 'mouse',
        platform,
        startMouseNDC: mouse.clone(),
        startRotX: platform.rotation.x,
        startRotY: platform.rotation.y
      };
    } else {
      // World-space offset so the grab-point on the continent stays under the cursor
      const targetWorldPos = new THREE.Vector3();
      dragTarget.getWorldPosition(targetWorldPos);
      const hitWorldPos = ray.origin.clone().add(ray.direction.clone().multiplyScalar(dragStartDistance));
      dragOffsetWorld.copy(targetWorldPos).sub(hitWorldPos);
      sceneManager.current?.onDragStart?.(dragTarget);
    }
  }
});
renderer.domElement.addEventListener('pointermove', e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  if (!dragTarget) {
    // Hover detection on desktop
    raycaster.setFromCamera(mouse, camera);
    const ray = { origin: raycaster.ray.origin.clone(), direction: raycaster.ray.direction.clone() };
    setHover(intersectButtons(ray));
  }
});
renderer.domElement.addEventListener('pointerup', () => {
  if (dragTarget) {
    if (!rotState) sceneManager.current?.onDragEnd?.(dragTarget);
    dragTarget = null;
    rotState = null;
    orbit.enabled = true;
  }
});

function updateDrag() {
  if (!dragTarget) return;

  // ---- Rotation drag (pedestal) ----
  if (rotState) {
    if (rotState.type === 'vr') {
      const ctrlPos = new THREE.Vector3().setFromMatrixPosition(rotState.controller.matrixWorld);
      const dx = ctrlPos.x - rotState.startCtrlPos.x;
      const dy = ctrlPos.y - rotState.startCtrlPos.y;
      rotState.platform.rotation.y = rotState.startRotY + dx * ROT_SENS_VR;
      rotState.platform.rotation.x = THREE.MathUtils.clamp(
        rotState.startRotX - dy * ROT_SENS_VR, TILT_MIN, TILT_MAX
      );
    } else { // mouse
      const dx = mouse.x - rotState.startMouseNDC.x;
      const dy = mouse.y - rotState.startMouseNDC.y;
      rotState.platform.rotation.y = rotState.startRotY + dx * ROT_SENS_MOUSE;
      rotState.platform.rotation.x = THREE.MathUtils.clamp(
        rotState.startRotX + dy * ROT_SENS_MOUSE, TILT_MIN, TILT_MAX
      );
    }
    return;
  }

  // ---- Position drag (continents) ----
  let ray;
  if (dragController) {
    ray = makeControllerRay(dragController);
  } else {
    raycaster.setFromCamera(mouse, camera);
    ray = raycaster.ray;
  }
  const targetWorld = ray.origin.clone().add(ray.direction.clone().multiplyScalar(dragStartDistance));
  targetWorld.add(dragOffsetWorld);
  // Convert to parent-local space FIRST so constraints operate in the platform's
  // own coordinate system (correct even when the platform is rotated/tilted).
  const targetLocal = dragTarget.parent.worldToLocal(targetWorld.clone());
  sceneManager.current?.constrainDrag?.(dragTarget, targetLocal);
  dragTarget.position.copy(targetLocal);
  sceneManager.current?.onDragMove?.(dragTarget);
}

// ============================================================================
// 4. SCENE MANAGER
//    Each scene = a Group + lifecycle hooks. Manager swaps groups in/out.
// ============================================================================
class Scene {
  constructor(name) {
    this.name = name;
    this.group = new THREE.Group();
    this.clickables = [];
    this.draggables = [];
    this._built = false;
  }
  build() { /* override */ this._built = true; }
  enter() { /* override */ }
  exit() { /* override */ }
  update(dt, t) { /* override */ }
  // optional: onDragStart/onDragMove/onDragEnd/constrainDrag
}

const sceneManager = {
  scenes: new Map(),
  current: null,
  register(scene) { this.scenes.set(scene.name, scene); },
  show(name) {
    if (this.current) {
      this.current.exit();
      world.remove(this.current.group);
    }
    setHover(null);
    const next = this.scenes.get(name);
    if (!next) return;
    if (!next._built) next.build();
    this.current = next;
    world.add(next.group);
    next.enter();
    setStatus(`Scene: ${next.name}`);
  },
  getClickables() { return this.current?.clickables ?? []; },
  getDraggables() { return this.current?.draggables ?? []; }
};

// "Back to Menu" button you can drop into any non-menu scene
function makeBackButton(onBack) {
  const btn = makeButton({
    label: '← Menu', color: '#3a3a4a', hover: '#ffaa00',
    width: 0.5, height: 0.16, onClick: onBack
  });
  return btn;
}

// 6. SCENE: INFORMATION
//    Three stations arranged in an arc. Each has a title, description, and a
//    looping mini-animation. Plus a vocabulary panel.
// ============================================================================
class InformationScene extends Scene {
  constructor() { super('Information'); }
  build() {
    super.build();
    const g = this.group;

    // Header
    const header = makeTextPanel({
      text: 'Plate Boundaries',
      width: 2.2, height: 0.3, bg: '#0a1320', fg: '#FFD060',

    });

    g.add(header);

    // Four stations in an arc around the user
    const stations = [
      {
        title: 'Convergent (continent–continent)',
        body: 'When two continental plates push into each other, neither can sink — both crumple upward into folded mountain ranges.\n\nExample: the HIMALAYAS, where India is still pushing into Asia. Mount Everest grows about 4 mm taller every year.',
        accent: '#c25450', angle: -0.9,
        anim: g => this.buildConvergentAnim(g)
      },
      {
        title: 'Convergent (ocean–continent)',
        body: 'When a dense oceanic plate meets a lighter continental plate, the oceanic plate sinks beneath in a process called subduction. As it descends and melts, magma rises and feeds a chain of volcanoes on the continent above.\n\nExample: the ANDES MOUNTAINS, where the Nazca Plate is subducting beneath South America.',
        accent: '#d4a04a', angle: -0.3,
        anim: g => this.buildSubductionAnim(g)
      },
      {
        title: 'Divergent',
        body: 'When two plates pull apart, hot magma rises from below to fill the gap and cools into new crust.\n\nExample: the EAST AFRICAN RIFT VALLEY, where the African plate is slowly splitting in two. On the seafloor, divergent boundaries create mid-ocean ridges.',
        accent: '#6ea75e', angle: 0.3,
        anim: g => this.buildDivergentAnim(g)
      },
      {
        title: 'Transform',
        body: 'When two plates grind sideways past each other, friction builds until they suddenly slip — releasing the energy as an earthquake. No crust is created or destroyed.\n\nExample: the SAN ANDREAS FAULT in California.',
        accent: '#e8a850', angle: 0.9,
        anim: g => this.buildTransformAnim(g)
      }
    ];
    const radius = 3.2;
    const animUpdaters = [];
    for (const s of stations) {
      const st = new THREE.Group();
      st.position.set(Math.sin(s.angle) * radius, 1.5, -Math.cos(s.angle) * radius);
      st.lookAt(0, 1.5, 0);

      const title = makeTextPanel({
        text: s.title, width: 1.6, height: 0.22,
        bg: '#101820', fg: '#fff', accent: s.accent,
        fontSize: 36, padding: 14
      });
      title.position.y = 0.85;
      st.add(title);

      const body = makeTextPanel({
        text: s.body, width: 1.6, height: 0.85,
        bg: '#0d141c', fg: '#cdd', fontSize: 24, padding: 18, lineHeight: 1.4
      });
      body.position.y = 0.35;
      st.add(body);

      // Mini-animation below the text
      const animGroup = new THREE.Group();
      animGroup.position.y = -0.4;
      const updater = s.anim(animGroup);
      st.add(animGroup);
      animUpdaters.push(updater);

      g.add(st);
    }
    this.animUpdaters = animUpdaters;

    // Vocabulary panel (large, behind the user — they can turn around)
    const vocabText =
      'Lithosphere — Earth\'s rigid outer layer (crust + uppermost mantle).\n' +
      'Asthenosphere — Hot, partly melted layer of mantle that plates float on.\n' +
      'Convection currents — Slow circular flow of hot mantle that drives plate motion.\n' +
      'Subduction — When one plate sinks beneath another at a convergent boundary.\n' +
      'Magma — Melted rock beneath Earth\'s surface (called lava once it erupts).\n' +
      'Fault — A crack in Earth\'s crust where rock layers move against each other.';
    const vocab = makeTextPanel({
      text: 'KEY VOCABULARY\n\n' + vocabText,
      width: 3.0, height: 1.6,
      bg: '#10182a', fg: '#dde', accent: '#88ccff',
      fontSize: 28, padding: 26, lineHeight: 1.5
    });
    vocab.position.set(0, 1.5, 2.4);
    vocab.rotation.y = Math.PI;
    g.add(vocab);

    // Back button
    const back = makeBackButton(() => sceneManager.show('Menu'));
    back.position.set(0, 0.5, -1.6);

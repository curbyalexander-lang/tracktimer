   EVALUATION ENGINE

function normalize(t){return(t||"").toLowerCase().replace(/[^a-z0-9\s]/g," ");}
function matchesKw(input,keywords){const n=normalize(input);return keywords.some(kw=>n.includes(kw.toLowerCase()));}
function isRelevant(item,activities,season){const actMatch=item.activities==="all"||activities.some(a=>item.activities.includes(a));const seaMatch=item.seasons==="all"||(Array.isArray(item.seasons)?item.seasons.includes(season):true);return actMatch&&seaMatch;}

function evaluatePlanFn(td){
  const{ageGroup,activities,days,month,groupSize,environment}=td;const season=getSeason(month);const ageLabel=AGE_GROUPS.find(g=>g.value===ageGroup)?.label||ageGroup;const ageIndex=AGE_GROUPS.findIndex(g=>g.value===ageGroup);const minAgeIndices={"4-6":0,"7-10":1,"11-12":2,"13-14":3,"15-17":4,"18+":5};
  let issues=[],notes=[],strengths=[];
  activities.forEach(a=>{const rule=APPROPRIATENESS[a];if(rule){const minIdx=minAgeIndices[rule.minAge]||0;if(ageIndex<minIdx)issues.push("**"+a+"** — "+rule.flag);}});
  activities.forEach(a=>{if(isWaterActivity(a)&&season==="winter")issues.push("**"+a+" in "+month+"** — "+SEASONAL_WARNINGS.winter.water);if(isWinterActivity(a)&&season==="summer")issues.push("**"+a+" in "+month+"** — "+SEASONAL_WARNINGS.summer.winter);});
  if(SEASONAL_WARNINGS[season]?.general)notes.push(SEASONAL_WARNINGS[season].general);
  // Environment warnings
  if(environment&&ENV_WARNINGS[environment]){notes.push("**"+environment+" environment:** "+ENV_WARNINGS[environment].notes);}
  if(environment==="Arctic / Tundra"&&ageIndex<3)issues.push("**Arctic/tundra environments with "+ageLabel+" learners** — This is an extreme environment requiring specialized training and gear. It is not appropriate for participants under high school age without exceptional preparation.");
  if(environment==="Desert"&&season==="summer"&&["4-6","7-10"].includes(ageGroup))issues.push("**Desert in summer with young children** — Extreme heat in desert environments poses severe risk for young children, who are more susceptible to heat illness and dehydration.");
  if(days>=5)notes.push(DURATION_FLAGS.long);if(days>=3&&["4-6","7-10"].includes(ageGroup))notes.push(DURATION_FLAGS.young_long);if(groupSize>=20)notes.push(DURATION_FLAGS.large_group);
  if(activities.length>1)strengths.push("Combining multiple activities gives learners a well-rounded outdoor experience.");if(!issues.length)strengths.push("Your activity selections are developmentally appropriate for "+ageLabel+" learners.");if(season==="fall"||season==="spring")strengths.push(month+" is generally an excellent time for outdoor education — moderate temperatures and beautiful conditions.");
  let out="## Trip Evaluation\n\n**Plan:** "+activities.join(", ")+" in a **"+environment+"** environment with "+ageLabel+" learners, "+days+" day(s) in "+month+", group of "+groupSize+".\n\n";
  if(strengths.length)out+="### What Looks Good\n"+strengths.map(s=>"- "+s).join("\n")+"\n\n";
  if(issues.length)out+="### Concerns\n"+issues.map(i=>"- "+i).join("\n")+"\n\n";
  if(notes.length)out+="### Things to Keep in Mind\n"+notes.map(n=>"- "+n).join("\n")+"\n\n";
  const approved=issues.length===0;
  out+=approved?"✅ **This plan is approved — proceed to risk assessment!** Your activity and age group combinations are appropriate. Keep the seasonal notes in mind as you plan.":"⚠️ **Please revise your plan before proceeding.** The concerns listed above involve safety issues that need to be addressed.";
  return{text:out,approved};
}

function evaluateRisksFn(td,ra){
  const season=getSeason(td.month);const relevant=RISK_DB.filter(r=>isRelevant(r,td.activities,season));
  const results={human:{found:[],missed:[]},environmental:{found:[],missed:[]},equipment:{found:[],missed:[]}};
  relevant.forEach(r=>{const answer=ra[r.cat]||"";if(matchesKw(answer,r.kw))results[r.cat].found.push(r);else results[r.cat].missed.push(r);});
  let out="## Risk Assessment Evaluation\n\n",totalFound=0,totalCriticalMissed=0;
  ["human","environmental","equipment"].forEach(cat=>{
    const label=cat==="human"?"🩹 Human":cat==="environmental"?"🌦️ Environmental":"🎒 Equipment";out+="### "+label+" Risks\n\n";
    const{found,missed}=results[cat];totalFound+=found.length;
    if(found.length)out+="**You identified:** "+found.map(r=>r.text).join(", ")+" — nice work!\n\n";else out+="**You didn't identify any specific risks in this category.** This is a significant gap.\n\n";
    const criticalMissed=missed.filter(r=>r.importance>=2);totalCriticalMissed+=criticalMissed.length;
    if(criticalMissed.length){out+="**Risks you should consider:**\n";criticalMissed.slice(0,5).forEach(r=>{out+="- **"+r.text+"** — "+r.why+"\n";});if(criticalMissed.length>5)out+="- ...and "+(criticalMissed.length-5)+" more considerations.\n";out+="\n";}
  });
  const ratio=totalFound/Math.max(1,totalFound+totalCriticalMissed);const approved=ratio>=0.35&&totalCriticalMissed<=8;
  out+=approved?"\n✅ **Risk assessment is solid — proceed to equipment planning!** You identified "+totalFound+" relevant risks.":"\n⚠️ **Please reconsider the risks above before proceeding.** You missed several critical risks.";
  return{text:out,approved,stats:{found:totalFound,missed:totalCriticalMissed}};
}

function evaluateEquipmentFn(td,ea){
  const season=getSeason(td.month);const relevant=EQUIP_DB.filter(r=>isRelevant(r,td.activities,season));const found=[],missed=[];
  relevant.forEach(r=>{if(matchesKw(ea,r.kw))found.push(r);else missed.push(r);});
  let out="## Equipment Evaluation\n\n";
  if(found.length){out+="### What You've Got Covered\n";found.forEach(r=>{out+="- ✅ "+r.text+"\n";});out+="\n";}
  const critical=missed.filter(r=>r.importance>=2),nice=missed.filter(r=>r.importance<2);
  if(critical.length){out+="### Critical Items You're Missing\n";critical.forEach(r=>{out+="- ❌ **"+r.text+"** — "+r.why+"\n";});out+="\n";}
  if(nice.length){out+="### Also Worth Packing\n";nice.forEach(r=>{out+="- "+r.text+" — "+r.why+"\n";});out+="\n";}
  out+="**Score: "+found.length+" of "+relevant.length+" recommended items identified.**\n\n";
  const approved=critical.length<=3;
  out+=approved?"✅ **Equipment list looks good — you're ready to hit the trail!**":"⚠️ **You're missing some critical items — please revise.**";
  return{text:out,approved};
}

function pickScenarios(td,count=3){
  const season=getSeason(td.month);const types=["human","environmental","equipment"];const picked=[];
  types.forEach(type=>{const pool=SCENARIO_DB.filter(s=>s.type===type&&isRelevant(s,td.activities,season));if(pool.length){picked.push({...pool[Math.floor(Math.random()*pool.length)],response:"",feedback:"",feedbackIcon:"",score:0});}});
  while(picked.length<count){const remaining=SCENARIO_DB.filter(s=>isRelevant(s,td.activities,season)&&!picked.find(p=>p.text===s.text));if(!remaining.length)break;picked.push({...remaining[Math.floor(Math.random()*remaining.length)],response:"",feedback:"",feedbackIcon:"",score:0});}
  return picked;
}

function evaluateScenarioResponse(scenario,response){
  const results={hit:[],missed:[],total:0,critical:0,criticalHit:0};
  scenario.keyActions.forEach(ka=>{const matched=matchesKw(response,ka.kw);if(matched){results.hit.push(ka);if(ka.p>=3)results.criticalHit++;}else results.missed.push(ka);results.total++;if(ka.p>=3)results.critical++;});
  const ratio=results.hit.length/Math.max(1,results.total);const criticalRatio=results.criticalHit/Math.max(1,results.critical);
  let grade,icon;
  if(criticalRatio>=0.8&&ratio>=0.6){grade="🟢 **Excellent response!**";icon="✅";}else if(criticalRatio>=0.5||ratio>=0.4){grade="🟡 **Good effort, but some gaps:**";icon="🤔";}else{grade="🔴 **This needs improvement:**";icon="⚠️";}
  let out=grade+"\n\n";
  if(results.hit.length){out+="### What You Got Right\n";results.hit.forEach(ka=>{out+="- ✅ "+ka.a+"\n";});out+="\n";}
  if(results.missed.length){out+="### What You Missed\n";results.missed.forEach(ka=>{out+="- "+(ka.p>=3?"❌ **Critical:** ":"⚪ ")+ka.a+"\n";});out+="\n";}
  out+="### Best Practices\nIn this type of situation, the priority order is: **1) Assess immediate danger, 2) Stabilize the situation, 3) Communicate, 4) Decide on evacuation vs. field treatment, 5) Document the incident.** Always have a clear chain of command and never leave an injured or ill person alone.\n";
  return{text:out,icon,score:Math.round(ratio*100)};
}

function generateDebriefFn(td,riskStats,equipResult,scenarios){
  const scenarioScores=scenarios.filter(s=>s.score!==undefined).map(s=>s.score);const avgScore=scenarioScores.length?Math.round(scenarioScores.reduce((a,b)=>a+b,0)/scenarioScores.length):0;
  let out="## 🎉 Expedition Debrief\n\n### Overall Assessment\nYou planned a **"+td.activities.join(", ")+"** trip in a **"+(td.environment||"general")+"** environment for **"+(AGE_GROUPS.find(g=>g.value===td.ageGroup)?.label)+"** learners in **"+td.month+"**. ";
  if(avgScore>=70)out+="Your overall performance was strong — you demonstrated solid outdoor leadership thinking across planning, risk awareness, and incident response.\n\n";else if(avgScore>=40)out+="Your overall performance showed good foundational knowledge with some important gaps to address.\n\n";else out+="This simulation revealed several areas for growth. Outdoor leadership is a skill built through study and experience — use this feedback as a roadmap.\n\n";
  out+="### Strengths\n";if(riskStats.found>=5)out+="- You identified **"+riskStats.found+" risks** — showing strong awareness of hazards.\n";if(avgScore>=50)out+="- Your scenario responses averaged **"+avgScore+"%** — demonstrating solid crisis thinking.\n";out+="- You completed all phases of the planning process — many outdoor incidents happen when planning steps are skipped.\n\n";
  out+="### Growth Areas\n";if(riskStats.missed>5)out+="- You missed **"+riskStats.missed+" significant risks**. Build the habit of using a systematic checklist.\n";const mc=scenarios.filter(s=>s.feedbackIcon==="⚠️").length;if(mc)out+="- "+mc+" of your scenario responses missed critical actions. Practice: **assess → stabilize → communicate → decide → document.**\n";out+="- Review the equipment gaps identified in Phase 3.\n\n";
  out+="### Key Takeaways\n1. **Planning is protection.** Every risk you identify in advance is one you're prepared to handle.\n2. **Gear fails — have backups.** Redundancy in navigation, communication, and shelter can save lives.\n3. **People before schedule.** When a participant is in distress, the itinerary is no longer the priority.\n4. **Communication is continuous.** Emergency contacts, group check-ins, and participant briefings prevent most crises.\n5. **Debrief every trip.** Real outdoor educators reflect after every excursion.\n\n";
  out+="### Real-World Application\nThe skills you practiced here — risk assessment, equipment planning, and incident response — are the same skills professional outdoor educators use every day. Keep building this foundation, and you'll lead with confidence in the field. **The trail is calling — go lead well.** ⛰️";
  return out;
}

/* ═══════════════════════════════════════════════
   PRINT REPORT
   ═══════════════════════════════════════════════ */
function buildPrintReport(studentName,td,riskResult,equipResult,scenarios,debrief){
  const ageLabel=AGE_GROUPS.find(g=>g.value===td.ageGroup)?.label||td.ageGroup;const scenarioScores=scenarios.filter(s=>s.score!==undefined).map(s=>s.score);const avgScenario=scenarioScores.length?Math.round(scenarioScores.reduce((a,b)=>a+b,0)/scenarioScores.length):0;const riskFound=riskResult?.stats?.found||0;const riskMissed=riskResult?.stats?.missed||0;const riskTotal=riskFound+riskMissed;const riskPct=riskTotal?Math.round((riskFound/riskTotal)*100):0;const overallScore=Math.round((riskPct+avgScenario)/2);const date=new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Trailhead Report — ${studentName}</title><style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Source+Serif+4:wght@400;500&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Source Serif 4',Georgia,serif;color:#2B2B2B;padding:40px 50px;max-width:800px;margin:0 auto;font-size:14px;line-height:1.6}h1{font-family:'Outfit',sans-serif;color:#2D6A4F;font-size:24px;margin-bottom:2px}h2{font-family:'Outfit',sans-serif;color:#2D6A4F;font-size:16px;margin:20px 0 8px;padding-bottom:4px;border-bottom:2px solid #B7E4C7}h3{font-family:'Outfit',sans-serif;color:#2D6A4F;font-size:14px;margin:14px 0 6px}.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;padding-bottom:16px;border-bottom:3px solid #2D6A4F}.header-left{flex:1}.subtitle{font-family:'Outfit',sans-serif;color:#7A7265;font-size:12px;letter-spacing:0.1em;text-transform:uppercase}.name{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;margin-top:8px}.date{color:#7A7265;font-size:12px;margin-top:4px}.score-box{background:#F0F7F2;border:2px solid #95D5B2;border-radius:12px;padding:16px 24px;text-align:center;min-width:120px}.score-number{font-family:'Outfit',sans-serif;font-size:36px;font-weight:800;color:#2D6A4F}.score-label{font-family:'Outfit',sans-serif;font-size:11px;color:#7A7265;text-transform:uppercase;letter-spacing:0.08em}.trip-params{background:#F0EBE1;border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:13px}.trip-params strong{color:#2D6A4F}.scores-row{display:flex;gap:12px;margin:16px 0}.mini-score{flex:1;background:#FDFAF5;border:1px solid #D5CEBF;border-radius:8px;padding:10px;text-align:center}.mini-score .num{font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;color:#2D6A4F}.mini-score .lbl{font-family:'Outfit',sans-serif;font-size:10px;color:#7A7265;text-transform:uppercase;letter-spacing:0.05em}.scenario-item{margin:8px 0;padding:8px 12px;background:#FFF8F0;border-left:3px solid #E8B86D;border-radius:0 6px 6px 0;font-size:13px}.scenario-item .type{font-family:'Outfit',sans-serif;font-weight:700;font-size:11px;color:#C17817;text-transform:uppercase}.scenario-item .sc-score{font-family:'Outfit',sans-serif;font-weight:700;color:#2D6A4F}.debrief-section{margin-top:20px;padding:16px;background:#F0F7F2;border-radius:10px;border:1px solid #95D5B2}.footer{margin-top:30px;padding-top:12px;border-top:1px solid #D5CEBF;font-size:11px;color:#7A7265;text-align:center;font-family:'Outfit',sans-serif}@media print{body{padding:20px 30px}}</style></head><body><div class="header"><div class="header-left"><h1>⛰️ Trailhead Report</h1><div class="subtitle">Outdoor Education Simulation</div><div class="name">${studentName}</div><div class="date">${date}</div></div><div class="score-box"><div class="score-number">${overallScore}%</div><div class="score-label">Overall Score</div></div></div><div class="trip-params"><strong>Trip Plan:</strong> ${td.activities.join(", ")} &nbsp;|&nbsp; <strong>Environment:</strong> ${td.environment||"Not specified"} &nbsp;|&nbsp; <strong>Learners:</strong> ${ageLabel} &nbsp;|&nbsp; <strong>Month:</strong> ${td.month} &nbsp;|&nbsp; <strong>Duration:</strong> ${td.days} day(s) &nbsp;|&nbsp; <strong>Group Size:</strong> ${td.groupSize}</div><div class="scores-row"><div class="mini-score"><div class="num">${riskPct}%</div><div class="lbl">Risk Assessment</div><div style="font-size:11px;color:#7A7265;margin-top:2px">${riskFound} of ${riskTotal} risks identified</div></div><div class="mini-score"><div class="num">${avgScenario}%</div><div class="lbl">Scenario Response</div><div style="font-size:11px;color:#7A7265;margin-top:2px">Avg across ${scenarioScores.length} scenarios</div></div></div><h2>🔥 Scenario Performance</h2>${scenarios.map((s,i)=>'<div class="scenario-item"><span class="type">'+s.type+'</span> — Scenario '+(i+1)+': <span class="sc-score">'+(s.score||0)+'%</span><br><span style="font-size:12px;color:#7A7265">'+s.text.slice(0,120)+'...</span></div>').join("")}<h2>⭐ Debrief Summary</h2><div class="debrief-section" style="font-size:13px;line-height:1.7">${(debrief||"").split("\n").map(line=>{const t=line.trim();if(!t)return"<br>";if(t.startsWith("### "))return"<h3>"+t.slice(4)+"</h3>";if(t.startsWith("## "))return"<h2 style='border:none;margin:12px 0 6px'>"+t.slice(3)+"</h2>";if(/^[-•]\s/.test(t))return"<div style='padding-left:16px'>• "+t.replace(/^[-•]\s/,"")+"</div>";if(/^\d+\.\s/.test(t))return"<div style='padding-left:16px'>"+t+"</div>";return"<p style='margin:4px 0'>"+t+"</p>";}).join("")}</div><div class="footer">Trailhead Outdoor Education Simulation • Generated ${date} • This report is for feedback purposes and is not a formal assessment.</div><script>window.onload=function(){window.print();}<\/script></body></html>`;
}

/* ═══════════════════════════════════════════════
   UI COMPONENTS
   ═══════════════════════════════════════════════ */
function Md({text}){if(!text)return null;return <div>{text.split("\n").map((line,i)=>{const t=line.trim();if(!t)return <br key={i}/>;if(t.startsWith("### "))return <h4 key={i} style={S.h4}>{inl(t.slice(4))}</h4>;if(t.startsWith("## "))return <h3 key={i} style={S.h3}>{inl(t.slice(3))}</h3>;if(/^[-•]\s/.test(t))return <div key={i} style={S.bullet}><span style={S.dot}>•</span>{inl(t.replace(/^[-•]\s/,""))}</div>;if(/^\d+\.\s/.test(t)){const m=t.match(/^(\d+)\.\s(.*)/);return <div key={i} style={S.bullet}><span style={S.nd}>{m[1]}.</span>{inl(m[2])}</div>;}return <p key={i} style={S.p}>{inl(t)}</p>;})}</div>;}
function inl(text){return text.split(/(\*\*[^*]+\*\*)/).map((p,i)=>p.startsWith("**")&&p.endsWith("**")?<strong key={i} style={{color:"var(--accent)"}}>{p.slice(2,-2)}</strong>:p);}
function Chip({label,selected,onClick}){return <button onClick={onClick} style={{padding:"6px 14px",borderRadius:20,fontSize:"0.8rem",fontFamily:"var(--font-display)",fontWeight:600,cursor:"pointer",transition:"all 0.2s",border:"2px solid",background:selected?"var(--accent)":"var(--surface-alt)",color:selected?"#fff":"var(--text)",borderColor:selected?"var(--accent)":"var(--border)"}}>{label}</button>;}
function Btn({children,onClick,disabled,variant="primary",style:s}){const v={primary:{background:"var(--accent)",color:"#fff",border:"none"},secondary:{background:"var(--surface-alt)",color:"var(--text)",border:"2px solid var(--border)"},ghost:{background:"transparent",color:"var(--accent)",border:"none",textDecoration:"underline"},warn:{background:"var(--accent-muted)",color:"#fff",border:"none"}};return <button onClick={onClick} disabled={disabled} style={{padding:"10px 20px",borderRadius:10,fontFamily:"var(--font-display)",fontWeight:700,fontSize:"0.86rem",cursor:disabled?"not-allowed":"pointer",transition:"all 0.2s",opacity:disabled?0.5:1,display:"inline-flex",alignItems:"center",gap:8,...v[variant],...s}}>{children}</button>;}
function TA({value,onChange,placeholder,rows=4}){return <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows} style={{width:"100%",padding:"12px 14px",borderRadius:10,border:"2px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:"0.9rem",fontFamily:"var(--font-body)",resize:"vertical",outline:"none",boxSizing:"border-box"}}/>;}
function FeedbackBox({text,icon="🧭"}){if(!text)return null;return <div style={{background:"var(--surface-feedback)",border:"1px solid var(--border-accent)",borderRadius:14,padding:"16px 20px",marginTop:16,boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><span style={{fontSize:"1.1rem"}}>{icon}</span><span style={{fontFamily:"var(--font-display)",fontWeight:700,fontSize:"0.82rem",color:"var(--accent)",textTransform:"uppercase",letterSpacing:"0.07em"}}>Trail Guide Feedback</span></div><div style={{fontSize:"0.9rem",color:"var(--text)"}}><Md text={text}/></div></div>;}
const S={phaseTitle:{fontFamily:"var(--font-display)",color:"var(--accent)",margin:"0 0 6px",fontSize:"1.5rem"},phaseDesc:{color:"var(--text-muted)",margin:"0 0 20px",fontSize:"0.88rem"},label:{display:"block",fontFamily:"var(--font-display)",fontWeight:700,fontSize:"0.86rem",color:"var(--text)",marginBottom:6},hint:{color:"var(--text-muted)",fontSize:"0.8rem",margin:"0 0 8px",lineHeight:1.5},chipRow:{display:"flex",flexWrap:"wrap",gap:8,marginBottom:18},input:{width:"100%",padding:"10px 14px",borderRadius:10,border:"2px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:"0.9rem",fontFamily:"var(--font-body)",outline:"none",boxSizing:"border-box"},h3:{margin:"14px 0 6px",color:"var(--accent)",fontFamily:"var(--font-display)",fontSize:"1.1rem"},h4:{margin:"12px 0 4px",color:"var(--accent)",fontFamily:"var(--font-display)",fontSize:"1rem"},bullet:{paddingLeft:18,position:"relative",margin:"4px 0",lineHeight:1.6},dot:{position:"absolute",left:4,color:"var(--accent)"},nd:{position:"absolute",left:2,color:"var(--accent)",fontWeight:700},p:{margin:"5px 0",lineHeight:1.6}};

/* ═══════════════════════════════════════════════
   MAIN APP
   ═══════════════════════════════════════════════ */
function Trailhead(){
  const[phase,setPhase]=useState(-1);const[studentName,setStudentName]=useState("");const[tripData,setTripData]=useState({ageGroup:"",activities:[],days:0,groupSize:0,month:"",environment:""});const[riskAnswers,setRiskAnswers]=useState({human:"",environmental:"",equipment:""});const[equipmentAnswer,setEquipmentAnswer]=useState("");const[scenarios,setScenarios]=useState([]);const[currentScenario,setCurrentScenario]=useState(0);const[mishapResponse,setMishapResponse]=useState("");const[planResult,setPlanResult]=useState(null);const[riskResult,setRiskResult]=useState(null);const[equipResult,setEquipResult]=useState(null);const[debrief,setDebrief]=useState("");
  const topRef=useRef(null);useEffect(()=>{topRef.current?.scrollIntoView({behavior:"smooth"});},[phase]);
  const toggle=a=>setTripData(d=>({...d,activities:d.activities.includes(a)?d.activities.filter(x=>x!==a):[...d.activities,a]}));
  const{ageGroup,activities,days,groupSize,month,environment}=tripData;const planValid=ageGroup&&activities.length>0&&days>0&&groupSize>0&&month&&environment;const riskValid=riskAnswers.human&&riskAnswers.environmental&&riskAnswers.equipment;const sc=scenarios[currentScenario];const allScenariosDone=scenarios.length>0&&scenarios.every(s=>s.feedback);const canProceedMishaps=scenarios.length>=3&&allScenariosDone;

  if(phase===-1){return <div style={{minHeight:"100vh",background:"var(--surface)",color:"var(--text)",fontFamily:"var(--font-body)"}}><div style={{maxWidth:640,margin:"0 auto",padding:"50px 24px",textAlign:"center"}}>
    <div style={{fontSize:"3.5rem",marginBottom:10}}>⛰️</div>
    <h1 style={{fontFamily:"var(--font-display)",fontSize:"2.2rem",color:"var(--accent)",margin:"0 0 6px",letterSpacing:"-0.02em"}}>Trailhead</h1>
    <p style={{fontFamily:"var(--font-display)",fontSize:"0.95rem",color:"var(--text-muted)",margin:"0 0 28px",letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:500}}>Outdoor Education Simulation</p>
    <p style={{fontSize:"0.93rem",color:"var(--text)",lineHeight:1.7,maxWidth:460,margin:"0 auto 24px"}}>Plan an outdoor excursion, assess risks, prepare equipment, and navigate real-time mishaps. Your trail guide will challenge your thinking and help you grow as an outdoor educator.</p>
    <div style={{maxWidth:320,margin:"0 auto 28px",textAlign:"left"}}><label style={{fontFamily:"var(--font-display)",fontWeight:700,fontSize:"0.86rem",display:"block",marginBottom:6,color:"var(--text)",textAlign:"center"}}>Your Name</label><input type="text" value={studentName} onChange={e=>setStudentName(e.target.value)} placeholder="Enter your full name" style={{width:"100%",padding:"10px 14px",borderRadius:10,border:"2px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:"0.9rem",fontFamily:"var(--font-body)",outline:"none",boxSizing:"border-box",textAlign:"center"}}/></div>
    <div style={{display:"flex",justifyContent:"center",gap:14,marginBottom:32,flexWrap:"wrap"}}>{["🗺️ Plan","⚠️ Assess","🎒 Equip","🔥 Respond","⭐ Debrief"].map((s,i)=><div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5,padding:"10px 14px",borderRadius:12,background:"var(--surface-alt)",minWidth:72}}><span style={{fontSize:"1.3rem"}}>{s.split(" ")[0]}</span><span style={{fontFamily:"var(--font-display)",fontSize:"0.72rem",fontWeight:600,color:"var(--text-muted)"}}>{s.split(" ")[1]}</span></div>)}</div>
    <div onClick={()=>{if(studentName.trim())setPhase(0);}} style={{display:"inline-flex",flexDirection:"column",alignItems:"center",gap:6,cursor:studentName.trim()?"pointer":"not-allowed",transition:"transform 0.2s",padding:"20px 48px",borderRadius:18,background:studentName.trim()?"var(--accent)":"var(--border)",color:"#fff",boxShadow:studentName.trim()?"0 6px 24px rgba(45,106,79,0.35)":"none",opacity:studentName.trim()?1:0.5}} onMouseEnter={e=>{if(studentName.trim())e.currentTarget.style.transform="translateY(-3px)";}} onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";}}>
      <span style={{fontSize:"3.5rem",lineHeight:1}}>🥾</span><span style={{fontFamily:"var(--font-display)",fontWeight:800,fontSize:"1.15rem",letterSpacing:"0.06em",textTransform:"uppercase"}}>Start Here</span></div>
    {!studentName.trim()&&<p style={{marginTop:12,fontSize:"0.8rem",color:"var(--text-muted)",fontStyle:"italic"}}>Enter your name above to begin</p>}
  </div></div>;}

  return <div style={{minHeight:"100vh",background:"var(--surface)",color:"var(--text)",fontFamily:"var(--font-body)",fontSize:"0.91rem"}}><div ref={topRef} style={{maxWidth:720,margin:"0 auto",padding:"14px 20px 32px"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:2}}><span style={{fontSize:"1.3rem"}}>⛰️</span><span style={{fontFamily:"var(--font-display)",fontWeight:800,fontSize:"1.05rem",color:"var(--accent)"}}>Trailhead</span></div>
    <div style={{display:"flex",gap:4,alignItems:"center",padding:"14px 0 6px",flexWrap:"wrap"}}>{PHASE_LABELS.map((label,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:4}}><div style={{padding:"5px 12px",borderRadius:20,fontSize:"0.76rem",fontWeight:600,fontFamily:"var(--font-display)",background:i===phase?"var(--accent)":i<phase?"var(--accent-muted)":"var(--surface-alt)",color:i<=phase?"#fff":"var(--text-muted)",transition:"all 0.3s"}}>{label}</div>{i<4&&<span style={{color:"var(--text-muted)",fontSize:"0.65rem"}}>›</span>}</div>)}</div>
    <div style={{marginTop:18}}>
      {phase===0&&<><h2 style={S.phaseTitle}>🗺️ Plan Your Outdoor Excursion</h2><p style={S.phaseDesc}>Set the parameters of your trip. Consider who your learners are and what activities are appropriate.</p><label style={S.label}>Age Group of Learners</label><div style={S.chipRow}>{AGE_GROUPS.map(g=><Chip key={g.value} label={g.label} selected={ageGroup===g.value} onClick={()=>setTripData(d=>({...d,ageGroup:g.value}))}/>)}</div><label style={S.label}>Activities (select all that apply)</label><div style={S.chipRow}>{ACTIVITIES.map(a=><Chip key={a} label={a} selected={activities.includes(a)} onClick={()=>toggle(a)}/>)}</div><label style={S.label}>Month of Excursion</label><div style={S.chipRow}>{MONTHS.map(m=><Chip key={m} label={m} selected={month===m} onClick={()=>setTripData(d=>({...d,month:m}))}/>)}</div><label style={S.label}>Environment Type</label><div style={S.chipRow}>{ENVIRONMENTS.map(e=><Chip key={e} label={e} selected={environment===e} onClick={()=>setTripData(d=>({...d,environment:e}))}/>)}</div><div style={{display:"flex",gap:16,marginBottom:18,flexWrap:"wrap"}}><div style={{flex:1,minWidth:140}}><label style={S.label}>Duration (days)</label><input type="number" min={1} max={30} value={days||""} onChange={e=>setTripData(d=>({...d,days:parseInt(e.target.value)||0}))} style={S.input} placeholder="e.g. 3"/></div><div style={{flex:1,minWidth:140}}><label style={S.label}>Group Size</label><input type="number" min={1} max={200} value={groupSize||""} onChange={e=>setTripData(d=>({...d,groupSize:parseInt(e.target.value)||0}))} style={S.input} placeholder="e.g. 24"/></div></div><Btn onClick={()=>setPlanResult(evaluatePlanFn(tripData))} disabled={!planValid}>{planResult?"Re-Evaluate Plan":"Evaluate My Plan"} →</Btn>{planResult&&<FeedbackBox text={planResult.text} icon="🧭"/>}{planResult&&<div style={{marginTop:18}}>{planResult.approved?<Btn onClick={()=>setPhase(1)}>Continue to Risk Assessment →</Btn>:<Btn onClick={()=>setPhase(1)} variant="warn">Continue Anyway →</Btn>}</div>}</>}
      {phase===1&&<><h2 style={S.phaseTitle}>⚠️ Risk Assessment</h2><p style={S.phaseDesc}>Identify potential risks for your {activities.join(", ")} trip in a {environment} environment with {AGE_GROUPS.find(g=>g.value===ageGroup)?.label} learners in {month}.</p><label style={S.label}>🩹 Human Risks</label><p style={S.hint}>Health, fitness, behavior, medical conditions, allergies, supervision, experience levels...</p><TA value={riskAnswers.human} onChange={v=>setRiskAnswers(r=>({...r,human:v}))} placeholder="List the human risks you anticipate..." rows={3}/><label style={{...S.label,marginTop:16}}>🌦️ Environmental Risks</label><p style={S.hint}>Weather, terrain, wildlife, water, altitude, visibility, natural hazards...</p><TA value={riskAnswers.environmental} onChange={v=>setRiskAnswers(r=>({...r,environmental:v}))} placeholder="List the environmental risks you anticipate..." rows={3}/><label style={{...S.label,marginTop:16}}>🎒 Equipment Risks</label><p style={S.hint}>Failures, missing items, improper sizing, batteries, maintenance...</p><TA value={riskAnswers.equipment} onChange={v=>setRiskAnswers(r=>({...r,equipment:v}))} placeholder="List the equipment risks you anticipate..." rows={3}/><div style={{marginTop:18}}><Btn onClick={()=>setRiskResult(evaluateRisksFn(tripData,riskAnswers))} disabled={!riskValid}>{riskResult?"Re-Analyze":"Analyze My Risk Assessment"} →</Btn></div>{riskResult&&<FeedbackBox text={riskResult.text} icon="⚠️"/>}{riskResult&&<div style={{marginTop:18}}>{riskResult.approved?<Btn onClick={()=>setPhase(2)}>Continue to Equipment Check →</Btn>:<Btn onClick={()=>setPhase(2)} variant="warn">Continue Anyway →</Btn>}</div>}</>}
      {phase===2&&<><h2 style={S.phaseTitle}>🎒 Equipment Checklist</h2><p style={S.phaseDesc}>What equipment, gear, and supplies will your group need? Be thorough!</p><label style={S.label}>Your Equipment List</label><p style={S.hint}>Personal gear, group equipment, safety, food/water, navigation, communication, shelter, clothing, activity-specific items...</p><TA value={equipmentAnswer} onChange={setEquipmentAnswer} placeholder="List all equipment and supplies you'd bring..." rows={6}/><div style={{marginTop:18}}><Btn onClick={()=>setEquipResult(evaluateEquipmentFn(tripData,equipmentAnswer))} disabled={!equipmentAnswer.trim()}>{equipResult?"Re-Check":"Check My Equipment List"} →</Btn></div>{equipResult&&<FeedbackBox text={equipResult.text} icon="🎒"/>}{equipResult&&<div style={{marginTop:18}}>{equipResult.approved?<Btn onClick={()=>{setScenarios(pickScenarios(tripData));setPhase(3);}}>Begin the Expedition →</Btn>:<Btn onClick={()=>{setScenarios(pickScenarios(tripData));setPhase(3);}} variant="warn">Begin Anyway →</Btn>}</div>}</>}
      {phase===3&&<><h2 style={S.phaseTitle}>🔥 Navigate the Unexpected</h2><p style={S.phaseDesc}>Things don't always go as planned. Handle these scenarios.</p>{scenarios.length>0&&<><div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>{scenarios.map((s,i)=><Chip key={i} label={(s.feedback?"✅":"⚠️")+" Scenario "+(i+1)} selected={i===currentScenario} onClick={()=>{setCurrentScenario(i);setMishapResponse(s.response||"");}}/>)}</div>{sc&&<div style={{background:"var(--surface-scenario)",border:"2px solid var(--border-scenario)",borderRadius:14,padding:"16px 20px",marginBottom:16}}><div style={{fontFamily:"var(--font-display)",fontWeight:700,fontSize:"0.82rem",color:"var(--scenario-label)",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>⚠️ Scenario {currentScenario+1} of {scenarios.length} <span style={{marginLeft:10,fontSize:"0.73rem",fontWeight:400,textTransform:"none",color:"var(--text-muted)"}}>({sc.type})</span></div><div style={{fontSize:"0.93rem",lineHeight:1.65}}><Md text={sc.text}/></div></div>}{sc&&!sc.feedback&&<><label style={S.label}>How do you respond?</label><TA value={mishapResponse} onChange={setMishapResponse} placeholder="What actions do you take? What's your priority? Who do you communicate with?" rows={4}/><div style={{marginTop:12}}><Btn onClick={()=>{const result=evaluateScenarioResponse(sc,mishapResponse);setScenarios(prev=>prev.map((s,i)=>i===currentScenario?{...s,feedback:result.text,feedbackIcon:result.icon,response:mishapResponse,score:result.score}:s));}} disabled={!mishapResponse.trim()}>Submit Response →</Btn></div></>}{sc?.feedback&&<FeedbackBox text={sc.feedback} icon={sc.feedbackIcon||"🧭"}/>}{allScenariosDone&&<div style={{display:"flex",gap:12,marginTop:20,flexWrap:"wrap"}}><Btn onClick={()=>{const more=pickScenarios(tripData,1);if(more.length){setScenarios(prev=>[...prev,more[0]]);setCurrentScenario(scenarios.length);setMishapResponse("");}}} variant="secondary">🔥 Another Scenario</Btn></div>}</>}{canProceedMishaps&&<div style={{marginTop:18}}><Btn onClick={()=>{setDebrief(generateDebriefFn(tripData,riskResult?.stats||{found:0,missed:0},equipResult,scenarios));setPhase(4);}}>Proceed to Debrief →</Btn></div>}</>}
      {phase===4&&<><h2 style={S.phaseTitle}>🎉 Expedition Debrief</h2><p style={S.phaseDesc}>Your expedition is complete. Here's how you did.</p>{!debrief&&<div style={{textAlign:"center",padding:"24px 0"}}><Btn onClick={()=>setDebrief(generateDebriefFn(tripData,riskResult?.stats||{found:0,missed:0},equipResult,scenarios))}>Generate Full Debrief ⭐</Btn></div>}{debrief&&<><FeedbackBox text={debrief} icon="⭐"/><div style={{marginTop:20,display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}><Btn onClick={()=>{const html=buildPrintReport(studentName,tripData,riskResult,equipResult,scenarios,debrief);const w=window.open("","_blank");if(w){w.document.write(html);w.document.close();}else alert("Please allow popups to print your report.");}}>🖨️ Print Report</Btn><span style={{fontSize:"0.8rem",color:"var(--text-muted)",fontStyle:"italic"}}>Opens a printable report in a new tab</span></div></>}</>}
    </div>
    {phase>0&&<div style={{marginTop:24,paddingTop:14,borderTop:"1px solid var(--border)"}}><Btn variant="ghost" onClick={()=>setPhase(phase-1)}>← Back to {PHASE_LABELS[phase-1]}</Btn></div>}
  </div></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Trailhead/>);
</script>
</body>
</html>

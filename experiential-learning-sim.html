<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiential Learning Planning Simulation</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1218;--bg2:#171c26;--bg3:#1e2533;--bg4:#2a3245;
  --gold:#f0c040;--gold-dim:#c9a02e;--gold-bg:rgba(240,192,64,.07);
  --teal:#40d9b0;--teal-bg:rgba(64,217,176,.07);
  --coral:#f07060;--coral-bg:rgba(240,112,96,.07);
  --blue:#60a0f0;--purple:#a080f0;
  --t1:#eae8e2;--t2:#a8a4a0;--t3:#686560;
  --bdr:rgba(240,192,64,.12);
  --r:12px;--r2:8px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;line-height:1.6;overflow-x:hidden}

/* ---- Layout ---- */
.app{max-width:880px;margin:0 auto;padding:16px}
.header{text-align:center;padding:44px 16px 36px;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:48px;height:3px;background:var(--gold);border-radius:2px}
.header h1{font-family:'Playfair Display',serif;font-size:clamp(1.7rem,4vw,2.5rem);font-weight:700;letter-spacing:-.3px;margin-bottom:8px}
.header p{font-size:1rem;color:var(--t2);font-weight:300;max-width:520px;margin:0 auto}

/* ---- Progress ---- */
.prog-wrap{position:sticky;top:8px;z-index:100;background:var(--bg);padding:8px 0;display:none}
.prog-bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--teal));border-radius:3px;transition:width .6s ease}
.prog-meta{display:flex;justify-content:space-between;margin-top:5px;font-size:.72rem;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:600}

/* ---- Phase chrome ---- */
.phase{display:none;animation:fadeIn .45s ease}.phase.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.badge{display:inline-block;background:var(--gold-bg);border:1px solid rgba(240,192,64,.25);border-radius:20px;padding:3px 13px;font-size:.72rem;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.9px;margin-bottom:14px}
.ph-title{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:700;color:var(--gold);margin-bottom:8px}
.ph-narr{font-size:.95rem;color:var(--t2);margin-bottom:22px;max-width:660px;line-height:1.7}

/* ---- Cards / Options (still used in some places) ---- */
.opt-label{font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:8px}
.card{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .2s}
.card:hover{background:var(--bg4);transform:translateX(3px)}
.card.sel{border-color:var(--gold);background:var(--gold-bg)}.card.sel::before{background:var(--gold)}
.card h4{font-size:.95rem;font-weight:600;margin-bottom:2px}.card p{font-size:.84rem;color:var(--t2);line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}

/* ---- Buttons ---- */
.btn-row{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-bottom:36px;gap:10px}
.btn{font-family:'DM Sans',sans-serif;font-size:.92rem;font-weight:600;border:none;border-radius:var(--r2);padding:11px 26px;cursor:pointer;transition:all .2s;letter-spacing:.2px}
.btn-p{background:var(--gold);color:var(--bg)}.btn-p:hover{background:var(--gold-dim);transform:translateY(-1px);box-shadow:0 4px 14px rgba(240,192,64,.2)}
.btn-p:disabled{background:var(--t3);cursor:not-allowed;transform:none;box-shadow:none}
.btn-s{background:transparent;color:var(--t2);border:1px solid var(--bdr)}.btn-s:hover{border-color:var(--t3);color:var(--t1)}

/* ---- Feedback panels ---- */
.fb{border-radius:var(--r);padding:18px 22px;margin:16px 0 22px;display:none}
.fb.vis{display:block;animation:fadeIn .35s ease}
.fb.trade{background:var(--teal-bg);border:1px solid rgba(64,217,176,.2)}
.fb.trade h4{color:var(--teal)}
.fb.warn{background:var(--coral-bg);border:1px solid rgba(240,112,96,.2)}
.fb.warn h4{color:var(--coral)}
.fb.event{background:linear-gradient(135deg,rgba(160,128,240,.08),rgba(96,160,240,.06));border:1px solid rgba(160,128,240,.25)}
.fb.event h4{color:var(--purple)}
.fb h4{font-family:'Playfair Display',serif;font-size:.92rem;margin-bottom:6px}
.fb p{font-size:.88rem;color:var(--t2);line-height:1.65}

/* ============ INTERACTIVE WIDGETS ============ */

/* -- Drag & drop ranking -- */
.rank-zone{min-height:48px;border:2px dashed var(--bdr);border-radius:var(--r);padding:8px;transition:border-color .2s}
.rank-zone.over{border-color:var(--gold)}
.rank-item{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);padding:12px 16px;cursor:grab;transition:all .2s;display:flex;align-items:center;gap:10px;margin-bottom:6px;user-select:none;touch-action:none}
.rank-item:active{cursor:grabbing;opacity:.85;transform:scale(.98)}
.rank-item .grip{color:var(--t3);font-size:1rem;flex-shrink:0}
.rank-item h4{font-size:.9rem;font-weight:600;margin-bottom:1px}
.rank-item p{font-size:.8rem;color:var(--t2);line-height:1.4}
.rank-num{width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* -- Budget allocator -- */
.budget-bar-wrap{margin-bottom:16px}
.budget-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.budget-header .cat{font-weight:600;font-size:.88rem}
.budget-header .amt{font-size:.88rem;color:var(--gold);font-weight:600}
.budget-track{height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;position:relative;cursor:pointer}
.budget-fill{height:100%;border-radius:5px;transition:width .15s ease}
.budget-remaining{text-align:right;font-size:.82rem;color:var(--t3);margin-top:6px;font-weight:500}
.budget-remaining.over{color:var(--coral)}
.budget-total-bar{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-top:4px}
.budget-total-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:4px;transition:width .3s ease}
.budget-total-fill.over{background:linear-gradient(90deg,var(--coral),#f04040)}

/* -- Stakeholder map -- */
.smap{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:1.4;border-radius:var(--r);overflow:hidden;margin:16px 0;max-width:600px}
.smap-quad{background:var(--bg3);padding:16px;position:relative;min-height:140px;transition:background .2s}
.smap-quad.over{background:var(--bg4)}
.smap-label{position:absolute;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--t3)}
.smap-label.tl{top:8px;left:10px}.smap-label.tr{top:8px;right:10px}.smap-label.bl{bottom:8px;left:10px}.smap-label.br{bottom:8px;right:10px}
.smap-axis{font-size:.72rem;color:var(--t3);text-align:center;font-weight:500;margin-top:4px;font-style:italic}
.smap-axis-y{position:absolute;left:-36px;top:50%;transform:rotate(-90deg) translateX(-50%);transform-origin:0 0;white-space:nowrap;font-size:.72rem;color:var(--t3);font-weight:500;font-style:italic}
.smap-chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--bdr);border-radius:16px;padding:4px 10px 4px 8px;font-size:.78rem;font-weight:500;cursor:grab;margin:3px;user-select:none;touch-action:none;transition:all .15s}
.smap-chip:active{cursor:grabbing;transform:scale(.95)}
.smap-chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.smap-tray{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:12px;margin-bottom:10px;min-height:48px;display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}

/* -- Risk matrix -- */
.risk-matrix{display:grid;grid-template-columns:auto repeat(3,1fr);grid-template-rows:auto repeat(3,1fr);gap:2px;margin:16px 0;max-width:520px}
.rm-corner{background:transparent}
.rm-head{background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);padding:8px;border-radius:var(--r2)}
.rm-cell{background:var(--bg3);border-radius:var(--r2);min-height:70px;padding:8px;cursor:pointer;transition:all .2s;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.rm-cell:hover{background:var(--bg4)}
.rm-cell.g{border:1px solid rgba(64,217,176,.15)}.rm-cell.y{border:1px solid rgba(240,192,64,.15)}.rm-cell.r{border:1px solid rgba(240,112,96,.15)}
.risk-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:.72rem;font-weight:600;cursor:grab;user-select:none;touch-action:none}
.risk-chip.physical{background:rgba(240,112,96,.15);color:var(--coral)}
.risk-chip.emotional{background:rgba(160,128,240,.15);color:var(--purple)}
.risk-chip.logistical{background:rgba(96,160,240,.15);color:var(--blue)}
.risk-chip.equity{background:rgba(240,192,64,.15);color:var(--gold)}
.risk-tray{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:10px;margin-bottom:10px;min-height:40px;display:flex;flex-wrap:wrap;gap:4px}

/* -- Timeline builder -- */
.timeline{position:relative;margin:20px 0;padding-left:32px}
.tl-line{position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--bdr)}
.tl-item{position:relative;margin-bottom:16px;animation:fadeIn .3s ease}
.tl-dot{position:absolute;left:-25px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--gold);background:var(--bg)}
.tl-dot.filled{background:var(--gold)}
.tl-card{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);padding:12px 16px}
.tl-card h4{font-size:.88rem;font-weight:600;margin-bottom:4px}
.tl-input{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:6px;color:var(--t1);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:8px 10px;margin-top:6px;resize:none;line-height:1.5}
.tl-input:focus{outline:none;border-color:var(--gold)}
.tl-input::placeholder{color:var(--t3)}
.tl-add{display:flex;align-items:center;gap:6px;color:var(--gold);font-size:.85rem;font-weight:600;cursor:pointer;padding:8px 0;transition:opacity .2s}
.tl-add:hover{opacity:.7}

/* -- Kolb wheel -- */
.kolb-wheel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;max-width:440px;margin:16px auto;aspect-ratio:1}
.kolb-q{border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;transition:all .25s;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.kolb-q.active{border-color:var(--gold);transform:scale(1.03)}
.kolb-q h4{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.kolb-q p{font-size:.78rem;line-height:1.4;opacity:.8}
.kolb-q.ce{background:rgba(240,192,64,.08);color:var(--gold)}.kolb-q.ro{background:rgba(64,217,176,.08);color:var(--teal)}
.kolb-q.ac{background:rgba(96,160,240,.08);color:var(--blue)}.kolb-q.ae{background:rgba(160,128,240,.08);color:var(--purple)}
.kolb-input{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:6px;color:var(--t1);font-family:'DM Sans',sans-serif;font-size:.86rem;padding:10px;margin-top:10px;resize:vertical;min-height:60px;line-height:1.5;display:none}
.kolb-input.active{display:block;animation:fadeIn .3s ease}
.kolb-input:focus{outline:none;border-color:var(--gold)}
.kolb-input::placeholder{color:var(--t3)}

/* -- Summary -- */
.sum-section{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:24px;margin-bottom:18px}
.sum-section h3{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--gold);margin-bottom:12px}
.sum-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:.88rem}
.sum-row:last-child{border:none}.sum-row .lb{color:var(--t3);font-weight:500}.sum-row .vl{color:var(--t1);font-weight:600;text-align:right;max-width:55%}
.gauge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:16px 0}
.gauge{background:var(--bg2);border-radius:var(--r2);padding:18px;text-align:center}
.gauge svg{transform:rotate(-90deg);width:80px;height:80px}
.gauge circle{fill:none;stroke-width:6}.gauge .bg{stroke:var(--bg3)}
.gauge .fl{stroke-dasharray:220;stroke-dashoffset:220;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.gauge-n{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;margin-top:-56px;position:relative}
.gauge-l{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-top:40px}
.ref-box{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:22px;margin:16px 0}
.ref-box h4{font-family:'Playfair Display',serif;color:var(--teal);margin-bottom:8px;font-size:.95rem}
.ref-box p{color:var(--t2);font-size:.88rem;line-height:1.7;margin-bottom:8px}
.ref-box p:last-child{margin:0}
textarea.big-ref{width:100%;min-height:110px;background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);color:var(--t1);font-family:'DM Sans',sans-serif;font-size:.9rem;padding:14px;resize:vertical;line-height:1.6;margin-top:8px}
textarea.big-ref:focus{outline:none;border-color:var(--gold)}
textarea.big-ref::placeholder{color:var(--t3)}
.intro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:24px 0}
.intro-card{background:var(--bg3);border-radius:var(--r2);padding:16px;border:1px solid var(--bdr)}
.intro-card .ic{font-size:1.4rem;margin-bottom:6px}
.intro-card h4{font-size:.88rem;font-weight:600;margin-bottom:3px}
.intro-card p{font-size:.78rem;color:var(--t2);line-height:1.4}

/* -- Responsive -- */
@media(max-width:600px){
  .app{padding:10px}
  .smap{grid-template-columns:1fr;grid-template-rows:repeat(4,120px);max-width:100%}
  .risk-matrix{grid-template-columns:auto repeat(3,1fr);font-size:.7rem}
  .kolb-wheel{max-width:100%}
  .btn-row{flex-direction:column}.btn-row .btn{width:100%;text-align:center}
  .gauge-grid{grid-template-columns:1fr 1fr}
}
@media print{.prog-wrap,.btn-row{display:none}body{background:#fff;color:#222}.sum-section,.ref-box,.gauge{break-inside:avoid}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header"><h1>Experiential Learning<br>Planning Simulation</h1><p>Design a real learning experience — not by clicking through forms, but by building, allocating, mapping, and reflecting at each step.</p></div>
  <div class="prog-wrap" id="progWrap"><div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div><div class="prog-meta"><span id="progPhase">—</span><span id="progPct">0%</span></div></div>
  <div id="screens"></div>
</div>
<script>
// ===================== ENGINE =====================
const S={phase:0,d:{},tradeoffs:[],sc:{feasibility:50,depth:50,equity:50,safety:50,reflection:50}};
const PHASES=['intro','learners','experience','budget','stakeholders','risk','disruption','reflection','summary'];
const PHASE_NAMES=['Welcome','Learners','Experience','Budget','Stakeholders','Risk','Disruption','Reflection','Summary'];

function go(n){S.phase=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function next(){go(S.phase+1)}
function prev(){go(S.phase-1)}

function render(){
  const c=document.getElementById('screens');
  c.innerHTML=builders[S.phase]();
  const pw=document.getElementById('progWrap');
  pw.style.display=S.phase>0?'block':'none';
  const pct=Math.round(S.phase/(PHASES.length-1)*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progPct').textContent=pct+'%';
  document.getElementById('progPhase').textContent=PHASE_NAMES[S.phase]||'';
  if(builders[S.phase+'_init'])builders[S.phase+'_init']();
}

// ===================== BUILDERS =====================
const builders={};

// ---------- 0: INTRO ----------
builders[0]=()=>`<div class="phase active">
  <div class="badge">Concrete Experience → Reflective Observation</div>
  <div class="ph-title">Welcome, Planner</div>
  <div class="ph-narr">You are about to design an experiential learning activity from the ground up. This is not a form — you will actively build your plan through hands-on interactive tools at every phase.</div>
  <div class="intro-grid">
    <div class="intro-card"><div class="ic">🎯</div><h4>Rank Priorities</h4><p>Drag and drop to rank what matters most for your learners.</p></div>
    <div class="intro-card"><div class="ic">💰</div><h4>Allocate Budget</h4><p>Distribute limited funds across competing needs using interactive sliders.</p></div>
    <div class="intro-card"><div class="ic">🗺️</div><h4>Map Stakeholders</h4><p>Place stakeholders on an influence-interest grid by dragging chips.</p></div>
    <div class="intro-card"><div class="ic">⚠️</div><h4>Build a Risk Matrix</h4><p>Assess risks by placing them on a likelihood × impact grid.</p></div>
    <div class="intro-card"><div class="ic">🌀</div><h4>Survive a Disruption</h4><p>An unexpected event will force you to adapt your plan in real time.</p></div>
    <div class="intro-card"><div class="ic">🔄</div><h4>Design Reflection via Kolb</h4><p>Map your reflection plan directly onto Kolb's experiential cycle.</p></div>
  </div>
  <div class="btn-row"><div></div><button class="btn btn-p" onclick="next()">Begin Planning →</button></div>
</div>`;

// ---------- 1: LEARNERS ----------
builders[1]=()=>{
  const settingOpts=[
    {v:'k12',t:'K–12 School',d:'Institutional support, schedules, administrative approval.'},
    {v:'community',t:'Community / Youth Org',d:'More flexibility, fewer institutional resources.'},
    {v:'informal',t:'Informal / Independent',d:'Homeschool co-op, camp, museum — maximum freedom.'}
  ];
  const ageOpts=[
    {v:'elementary',t:'Elementary (5–10)',d:'Concrete, sensory-rich, high supervision.'},
    {v:'middle',t:'Middle School (11–14)',d:'Growing abstraction, peer influence, need for autonomy.'},
    {v:'high',t:'High School (15–18)',d:'Complex experiences, authentic engagement.'},
    {v:'college',t:'College (18–24)',d:'Self-directed, handles ambiguity, professional contexts.'},
    {v:'adult',t:'Adult (25+)',d:'Rich prior experience, relevance-driven, competing responsibilities.'}
  ];
  // Priority ranking items
  const priorities=[
    {id:'safety',label:'Physical & Emotional Safety',icon:'🛡️'},
    {id:'depth',label:'Depth of Learning',icon:'📚'},
    {id:'access',label:'Equity & Access for All',icon:'♿'},
    {id:'engage',label:'Engagement & Fun',icon:'🎯'},
    {id:'feasibility',label:'Logistical Feasibility',icon:'⚙️'},
    {id:'transfer',label:'Transfer to Real Life',icon:'🔗'}
  ];
  return `<div class="phase active">
    <div class="badge">Phase 1 of 7</div>
    <div class="ph-title">Who Are Your Learners?</div>
    <div class="ph-narr">Start by defining your context, then <strong>rank your planning priorities</strong> by dragging them into your preferred order. What matters most will shape every decision that follows.</div>
    <div class="opt-label">Setting</div>
    <div class="opts">${settingOpts.map(o=>`<div class="card" onclick="sel(this,'setting','${o.v}')" data-g="setting"><h4>${o.t}</h4><p>${o.d}</p></div>`).join('')}</div>
    <div class="opt-label">Age Group</div>
    <div class="opts">${ageOpts.map(o=>`<div class="card" onclick="sel(this,'ageGroup','${o.v}')" data-g="ageGroup"><h4>${o.t}</h4><p>${o.d}</p></div>`).join('')}</div>
    <div class="opt-label" style="margin-top:8px">Group Size: <span id="gsVal" style="color:var(--gold)">${S.d.groupSize||20}</span> learners</div>
    <input type="range" min="6" max="60" value="${S.d.groupSize||20}" style="width:100%;accent-color:var(--gold);margin:6px 0 18px" oninput="S.d.groupSize=+this.value;document.getElementById('gsVal').textContent=this.value">
    <div class="opt-label">Drag to Rank Your Planning Priorities (#1 = most important)</div>
    <div id="rankZone" class="rank-zone">${priorities.map((p,i)=>`<div class="rank-item" draggable="true" data-id="${p.id}"><span class="rank-num">${i+1}</span><span class="grip">⠿</span><div><h4>${p.icon} ${p.label}</h4></div></div>`).join('')}</div>
    <div id="fb1" class="fb trade"></div>
    <div class="btn-row"><button class="btn btn-s" onclick="prev()">← Back</button><button class="btn btn-p" id="nx1" onclick="submit1()" disabled>Continue →</button></div>
  </div>`;
};
builders['1_init']=()=>initRankDrag('rankZone');

// ---------- 2: EXPERIENCE TYPE + TIMELINE ----------
builders[2]=()=>{
  const types=[
    {v:'discovery',t:'Discovery',d:'Field trips, nature exploration, museum visits, guided investigations.',icon:'🔍'},

// ===================== INTERACTION LOGIC =====================

// -- Generic select --
function sel(el,key,val){
  document.querySelectorAll(`[data-g="${key}"]`).forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  S.d[key]=val;
  checkReady();
}

// -- Multi-select toggle --
function togMulti(el,key,val){
  if(!S.d[key])S.d[key]=[];
  el.classList.toggle('sel');
  const i=S.d[key].indexOf(val);
  if(i>-1)S.d[key].splice(i,1);else S.d[key].push(val);
  checkReady();
}

// -- Phase readiness --
function checkReady(){
  const p=S.phase;
  let ok=false;
  switch(p){
    case 1:ok=S.d.setting&&S.d.ageGroup&&S.d.priorities&&S.d.priorities.length>=6;break;
    case 2:ok=S.d.expType&&S.d.duration&&checkTLReady();break;
    case 3:ok=S.d.budget&&checkBudgetReady();break;
    case 4:ok=countPlacedStakeholders()>=4;break;
    case 5:ok=countPlacedRisks()>=5&&document.getElementById('mitigationPlan')?.value.trim().length>15;break;
    case 6:ok=S.d.disruptionResponse&&(document.getElementById('adaptPlan')?.value.trim().length>20);break;
    case 7:ok=checkKolbReady()&&S.d.reflectMode&&S.d.reflectMode.length>0;break;
    default:ok=true;
  }
  const btn=document.getElementById('nx'+p);
  if(btn)btn.disabled=!ok;
}

// -- Drag & Drop Ranking --
function initRankDrag(zoneId){
  const zone=document.getElementById(zoneId);
  if(!zone)return;
  let dragEl=null;
  zone.addEventListener('dragstart',e=>{
    dragEl=e.target.closest('.rank-item');
    if(dragEl)e.dataTransfer.effectAllowed='move';
  });
  zone.addEventListener('dragover',e=>{
    e.preventDefault();
    const target=e.target.closest('.rank-item');
    if(target&&target!==dragEl){
      const rect=target.getBoundingClientRect();
      const mid=rect.top+rect.height/2;
      if(e.clientY<mid)zone.insertBefore(dragEl,target);
      else zone.insertBefore(dragEl,target.nextSibling);
    }
  });
  zone.addEventListener('dragend',()=>{updateRankNums(zoneId);dragEl=null});
  // Touch support
  let touchEl=null,touchClone=null,lastOver=null;
  zone.addEventListener('touchstart',e=>{
    touchEl=e.target.closest('.rank-item');
    if(!touchEl)return;
    touchEl.style.opacity='.5';
  },{passive:true});
  zone.addEventListener('touchmove',e=>{
    if(!touchEl)return;
    e.preventDefault();
    const t=e.touches[0];
    const over=document.elementFromPoint(t.clientX,t.clientY)?.closest('.rank-item');
    if(over&&over!==touchEl){
      const rect=over.getBoundingClientRect();
      const mid=rect.top+rect.height/2;
      if(t.clientY<mid)zone.insertBefore(touchEl,over);
      else zone.insertBefore(touchEl,over.nextSibling);
    }
  },{passive:false});
  zone.addEventListener('touchend',()=>{
    if(touchEl)touchEl.style.opacity='1';
    touchEl=null;
    updateRankNums(zoneId);
  });
}
function updateRankNums(zoneId){
  const items=document.querySelectorAll(`#${zoneId} .rank-item`);
  S.d.priorities=[];
  items.forEach((it,i)=>{
    it.querySelector('.rank-num').textContent=i+1;
    S.d.priorities.push(it.dataset.id);
  });
  checkReady();
}

// -- Timeline --
function addTLItem(){
  const tl=document.getElementById('timeline');
  const n=tl.querySelectorAll('.tl-item').length+1;
  const div=document.createElement('div');
  div.className='tl-item';
  div.innerHTML=`<div class="tl-dot"></div><div class="tl-card"><h4>Moment ${n}</h4><textarea class="tl-input" placeholder="What happens at this point in the experience?" rows="2" oninput="checkTL()"></textarea></div>`;
  tl.appendChild(div);
}
function checkTL(){checkReady()}
function checkTLReady(){
  const inputs=document.querySelectorAll('#timeline .tl-input');
  let filled=0;
  inputs.forEach(i=>{if(i.value.trim().length>5)filled++});
  return filled>=3;
}

// -- Budget --
let budgetDragging=null;
const budgetAlloc={transport:0,site:0,materials:0,food:0,staffing:0,contingency:0};
function selBudget(el,val,total){
  sel(el,'budget',val);
  S.d.budgetTotal=total;
  document.getElementById('budgetSliders').style.display='block';
  Object.keys(budgetAlloc).forEach(k=>budgetAlloc[k]=0);
  updateBudgetUI();
}
function startBudgetDrag(e,cat){
  e.preventDefault();
  budgetDragging=cat;
  const move=ev=>{
    const t=ev.touches?ev.touches[0]:ev;
    const track=document.getElementById('bt_'+cat);
    const rect=track.getBoundingClientRect();
    let pct=Math.round(((t.clientX-rect.left)/rect.width)*100);
    pct=Math.max(0,Math.min(100,pct));
    // Check total
    const others=Object.entries(budgetAlloc).reduce((s,[k,v])=>k===cat?s:s+v,0);
    if(others+pct>100)pct=100-others;
    budgetAlloc[cat]=pct;
    updateBudgetUI();
  };
  const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);budgetDragging=null;checkReady()};
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
  document.addEventListener('touchmove',move,{passive:false});
  document.addEventListener('touchend',up);
}
function updateBudgetUI(){
  const total=Object.values(budgetAlloc).reduce((a,b)=>a+b,0);
  Object.entries(budgetAlloc).forEach(([k,v])=>{
    document.getElementById('bf_'+k).style.width=v+'%';
    document.getElementById('ba_'+k).textContent=v+'%';
  });
  const rem=100-total;
  const el=document.getElementById('budgetRemaining');
  el.textContent=rem===0?'✓ Fully allocated':`${rem}% remaining`;
  el.className='budget-remaining'+(rem<0?' over':'');
  const tf=document.getElementById('budgetTotalFill');
  tf.style.width=total+'%';
  tf.className='budget-total-fill'+(total>100?' over':'');
  S.d.budgetAlloc={...budgetAlloc};
}
function checkBudgetReady(){
  const total=Object.values(budgetAlloc).reduce((a,b)=>a+b,0);
  return total>=90&&total<=100;
}

// -- Stakeholder Map --
function initStakeholderDrag(){
  const quads=document.querySelectorAll('.smap-quad');
  const tray=document.getElementById('smapTray');
  quads.forEach(q=>{
    q.addEventListener('dragover',e=>{e.preventDefault();q.classList.add('over')});
    q.addEventListener('dragleave',()=>q.classList.remove('over'));
    q.addEventListener('drop',e=>{
      e.preventDefault();q.classList.remove('over');
      const sid=e.dataTransfer.getData('text/plain');
      const chip=document.querySelector(`.smap-chip[data-sid="${sid}"]`);
      if(chip)q.appendChild(chip);
      checkReady();
    });
  });
  tray.addEventListener('dragover',e=>e.preventDefault());
  tray.addEventListener('drop',e=>{
    e.preventDefault();
    const sid=e.dataTransfer.getData('text/plain');
    const chip=document.querySelector(`.smap-chip[data-sid="${sid}"]`);
    if(chip)tray.appendChild(chip);
    checkReady();
  });
  document.querySelectorAll('.smap-chip').forEach(chip=>{
    chip.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',chip.dataset.sid)});
  });
}
function countPlacedStakeholders(){
  let n=0;
  document.querySelectorAll('.smap-quad').forEach(q=>{n+=q.querySelectorAll('.smap-chip').length});
  return n;
}

  });
  tray.addEventListener('dragover',e=>e.preventDefault());
  tray.addEventListener('drop',e=>{
    e.preventDefault();
    const rid=e.dataTransfer.getData('text/plain');
    const chip=document.querySelector(`.risk-chip[data-rid="${rid}"]`);
    if(chip)tray.appendChild(chip);
    checkReady();
  });
  document.querySelectorAll('.risk-chip').forEach(chip=>{
    chip.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',chip.dataset.rid)});
  });
}
function countPlacedRisks(){
  let n=0;
  document.querySelectorAll('.rm-cell').forEach(c=>{n+=c.querySelectorAll('.risk-chip').length});
  return n;
}
function checkRisk(){checkReady()}

// -- Touch drag fallback for stakeholder & risk --
let touchDragEl=null,touchGhost=null;
function touchDragStart(e){
  touchDragEl=e.target.closest('.smap-chip,.risk-chip');
  if(!touchDragEl)return;
  touchDragEl.style.opacity='.4';
  touchGhost=touchDragEl.cloneNode(true);
  touchGhost.style.position='fixed';touchGhost.style.pointerEvents='none';touchGhost.style.zIndex='9999';touchGhost.style.opacity='.8';
  document.body.appendChild(touchGhost);
  const t=e.touches[0];
  touchGhost.style.left=(t.clientX-40)+'px';touchGhost.style.top=(t.clientY-15)+'px';
}
function touchDragMove(e){
  if(!touchDragEl)return;
  e.preventDefault();
  const t=e.touches[0];
  if(touchGhost){touchGhost.style.left=(t.clientX-40)+'px';touchGhost.style.top=(t.clientY-15)+'px'}
}
function touchDragEnd(e){
  if(!touchDragEl)return;
  touchDragEl.style.opacity='1';
  if(touchGhost){touchGhost.remove();touchGhost=null}
  const t=e.changedTouches[0];
  const dropTarget=document.elementFromPoint(t.clientX,t.clientY);
  const zone=dropTarget?.closest('.smap-quad,.rm-cell,.smap-tray,.risk-tray');
  if(zone)zone.appendChild(touchDragEl);
  touchDragEl=null;
  checkReady();
}

// -- Kolb Wheel --
function toggleKolb(el,stage){
  el.classList.toggle('active');
  const inp=document.getElementById('ki_'+stage);
  inp.classList.toggle('active');
  if(inp.classList.contains('active'))inp.focus();
  checkReady();
}
function checkKolbReady(){
  const stages=['ce','ro','ac','ae'];
  let filled=0;
  stages.forEach(s=>{
    const v=document.getElementById('ki_'+s)?.value.trim();
    if(v&&v.length>10)filled++;
  });
  return filled>=3;
}
function checkP6(){checkReady()}
function checkP7(){checkReady()}

// ===================== SUBMISSIONS =====================

function submit1(){
  const{setting,ageGroup,groupSize,priorities}=S.d;
  const top=priorities[0];
  let t='';
  if(top==='safety')t='You ranked safety as your top priority. This will serve you well in risk planning, but watch that it does not cause you to avoid experiences with genuine challenge. Growth often requires managed discomfort.';
  else if(top==='depth')t='Depth of learning is your top priority. This means you need to protect time for reflection and resist the temptation to pack the schedule. Fewer activities, deeply processed, beats a full itinerary.';
  else if(top==='access')t='Leading with equity is powerful. Every subsequent decision should be stress-tested: does this choice include or exclude? Who is most likely to be left out?';
  else if(top==='engage')t='Engagement is your top priority — but remember, engagement is a means, not an end. Fun without reflection is recreation. Build in processing that converts excitement into learning.';
  else if(top==='feasibility')t='You are being pragmatic by prioritizing feasibility. That is realistic, but watch for the risk of playing it too safe. The most feasible plan is not always the most transformative.';
  else t='You prioritized real-world transfer. That means your reflection design must explicitly ask: "What will you do differently because of this experience?" Hold yourself to that standard.';
  if(groupSize>40)t+=' With '+groupSize+' learners, every logistical decision is amplified. Consider cohort models.';
  if(ageGroup==='adult'&&setting==='k12')t+=' Adult learners in a K–12 setting is unusual — make sure the experience is designed for adults, not adapted from a children\'s program.';
  showFb('fb1','trade','Priority Trade-Off',t);
  S.tradeoffs.push({phase:'Learner Context',text:t});
  next();
}

function submit2(){
  const{expType,duration}=S.d;
  // Collect timeline entries
  const tls=[];document.querySelectorAll('#timeline .tl-input').forEach(i=>{if(i.value.trim())tls.push(i.value.trim())});
  S.d.timeline=tls;
  let t='';
  if(expType==='immersive'&&duration==='half-day'){t='An immersive experience in a half day is a contradiction. Immersion requires sustained time. Your depth score will reflect this tension.';S.sc.depth-=15;S.sc.feasibility+=5}
  else if(expType==='apprenticeship'){t='Apprenticeship depends on your community partner\'s reliability. Your timeline should include partner check-in points. The learning ceiling is high, but so is your dependency on someone you don\'t fully control.';S.sc.depth+=8;S.sc.feasibility-=5}
  else if(expType==='immersive'&&duration==='extended'){t='This is the gold standard — deep, sustained immersion. The planning burden is enormous but the potential for transformative learning (Mezirow) is at its highest.';S.sc.depth+=15;S.sc.feasibility-=12}
  else{t='Your experience type and duration align well. Your timeline shows intentional sequencing — make sure each moment has a clear purpose, not just a scheduled time.';S.sc.depth+=5}
  if(tls.length>=5){t+=' Your detailed timeline shows strong sequential thinking. Consider which moments need the most facilitation energy.';S.sc.depth+=3}
  showFb('fb2','trade','Experience Design',t);
  S.tradeoffs.push({phase:'Experience Design',text:t});
  next();
}

function submit3(){
  const{budget,budgetAlloc}=S.d;
  let t='';
  if(budgetAlloc.contingency<5){t='You allocated almost nothing to contingency reserves. When something goes wrong — and it will — you will have no financial cushion. Even 5–10% can save your plan.';S.sc.safety-=8}
  else if(budgetAlloc.contingency>=15){t='A healthy contingency reserve shows experienced planning. You are prepared for the unexpected.';S.sc.safety+=5}
  if(budgetAlloc.transport>40){t+=' Transportation is consuming a huge share of your budget. Is there a closer site that would free up funds for the experience itself?';S.sc.feasibility-=5}
  if(budgetAlloc.materials<5&&(S.d.expType==='outdoor'||S.d.expType==='discovery')){t+=' Very little allocated to materials for a '+S.d.expType+' experience. Make sure learners have what they need to engage meaningfully.'}
  if(budgetAlloc.food===0&&(S.d.duration==='full-day'||S.d.duration==='multi-day'||S.d.duration==='extended')){
    t+=' You allocated nothing to food for a '+S.d.duration+' experience. Hungry learners do not learn. Even if families pack food, someone will forget.';S.sc.equity-=5;
    showFb('fw3','warn','Equity Concern','Zero food budget on a full-day or longer experience creates a hidden cost barrier. Some families may not be able to send adequate food.');
  }
  if(!t)t='Your budget allocation reflects clear priorities. Every dollar tells a story about what you value.';
  showFb('fb3','trade','Budget Trade-Off',t);
  S.tradeoffs.push({phase:'Budget',text:t});
  next();
}

function submit4(){
  // Read stakeholder placements
  const map={};
  document.querySelectorAll('.smap-quad').forEach(q=>{
    q.querySelectorAll('.smap-chip').forEach(c=>{map[c.dataset.sid]=q.dataset.q});
  });
  S.d.stakeholderMap=map;
  let t='';
  if(map.families==='lo-lo'||map.families==='hi-lo'){t='You placed families in a low-interest quadrant. Be careful — families who feel uninformed or uninvited may resist the experience or pull learners out. Even if their interest seems low, proactive communication builds trust.';S.sc.equity-=5}
  if(map.learners==='lo-lo'||map.learners==='hi-lo'){t+=' You placed learners themselves in a low-interest position. If learners are not genuinely interested, the experience becomes compliance, not learning. How will you build their investment before the experience?';S.sc.depth-=5}
  if(map.admin==='hi-hi'){t+=' You identified administration as high-influence and high-interest. That is a powerful ally — leverage their enthusiasm to secure resources and institutional support.';S.sc.feasibility+=5}
  if(map.partner==='hi-hi'){t+=' Your community partner is high-influence and high-interest — an ideal collaborator. Protect this relationship. Clear communication about expectations, roles, and learner needs prevents misalignment.';S.sc.depth+=5}
  if(!t)t='Your stakeholder map shows thoughtful analysis of who has influence and interest. Use this map to prioritize your communication plan — spend the most energy on the high-influence stakeholders.';
  showFb('fb4','trade','Stakeholder Analysis',t);
  S.tradeoffs.push({phase:'Stakeholders',text:t});
  next();
}

function submit5(){
  // Read risk placements
  const riskMap={};
  document.querySelectorAll('.rm-cell').forEach(c=>{
    c.querySelectorAll('.risk-chip').forEach(r=>{riskMap[r.dataset.rid]=c.dataset.r});
  });
  S.d.riskMap=riskMap;
  S.d.mitigationPlan=document.getElementById('mitigationPlan')?.value.trim()||'';
  let t='';
  const highRisks=Object.entries(riskMap).filter(([_,v])=>v.includes('hi-hi')||v.includes('hi-med')||v.includes('med-hi'));
  if(highRisks.length>=3){t='You identified '+highRisks.length+' high-severity risks. That is a lot of red on your matrix. Consider whether the experience design itself can be modified to reduce risk, rather than relying entirely on mitigation.';S.sc.safety-=8}
  else if(highRisks.length===0){
    t='No high-severity risks? Either this is a very low-risk experience, or you may be underestimating potential problems. Experienced planners know that overconfidence is itself a risk.';S.sc.safety-=5;
    showFb('fw5','warn','Risk Awareness','Consider whether you have genuinely assessed worst-case scenarios. What would happen if your highest-likelihood risk actually occurred during the experience?');
  }
  else{t='Your risk assessment shows balanced judgment — you identified real dangers without catastrophizing. Your mitigation plan for the top risk is the kind of specific, actionable preparation that separates good planning from great planning.';S.sc.safety+=8}
  if(S.d.mitigationPlan.length>80)S.sc.safety+=5;
  showFb('fb5','trade','Risk Assessment',t);
  S.tradeoffs.push({phase:'Risk Assessment',text:t});
  next();
}

function submit6(){
  S.d.adaptPlan=document.getElementById('adaptPlan')?.value.trim()||'';
  const dis=S.d.disruption;
  const rs=dis.scoring[S.d.disruptionResponse];
  if(rs)Object.entries(rs).forEach(([k,v])=>{S.sc[k]=Math.max(0,Math.min(100,S.sc[k]+v))});
  let t='';
  if(S.d.adaptPlan.length>120){t='Your adaptation plan is detailed and specific — that is exactly what is needed in a crisis. Vague intentions collapse under pressure; concrete steps hold up.';S.sc.feasibility+=5;S.sc.reflection+=3}
  else{t='Your adaptation plan could be more specific. In a real disruption, the facilitator who has rehearsed specific steps responds faster and with more confidence than the one who plans to "figure it out."';S.sc.feasibility-=3}
  showFb('fb6','trade','Disruption Response',t);
  S.tradeoffs.push({phase:'Disruption',text:t});
  next();
}

function submit7(){
  const stages=['ce','ro','ac','ae'];
  S.d.kolb={};
  stages.forEach(s=>{S.d.kolb[s]=document.getElementById('ki_'+s)?.value.trim()||''});
  let filledCount=stages.filter(s=>S.d.kolb[s].length>10).length;
  let t='';
  if(filledCount===4){t='You addressed all four stages of Kolb\'s cycle. This is sophisticated experiential design — the full loop from experience through reflection, conceptualization, and experimentation maximizes learning transfer.';S.sc.reflection+=15;S.sc.depth+=5}
  else if(filledCount===3){t='You addressed three of four Kolb stages. Consider which stage you skipped — that gap represents a missed opportunity in the learning cycle.';S.sc.reflection+=8}
  else{t='Fewer than three Kolb stages filled suggests the reflection design needs more development. Experience without structured reflection risks remaining at the surface.';S.sc.reflection-=5}
  if(S.d.reflectMode?.includes('creative')){S.sc.reflection+=5;t+=' Including creative expression as a reflection mode gives learners with diverse strengths a way to demonstrate understanding beyond writing or speaking.'}
  showFb('fb7','trade','Reflection Design',t);
  S.tradeoffs.push({phase:'Reflection',text:t});
  next();
}

// ===================== DISRUPTION GENERATOR =====================
function generateDisruption(){
  const{expType,duration,budget}=S.d;
  const pool=[];
  if(expType==='outdoor'||expType==='discovery')pool.push({title:'Severe Weather Advisory',narrative:'Two days before your experience, a severe weather advisory is issued. Rain and thunderstorms are expected. Outdoor activities will be unsafe, but your partner site remains available indoors.',options:[
    {value:'postpone',title:'Postpone Entirely',desc:'Wait for good weather. Preserves the plan but disrupts schedules.'},
    {value:'modify',title:'Adapt to Indoor Alternative',desc:'Redesign activities for an indoor or sheltered setting. Learners still go.'},
    {value:'hybrid',title:'Virtual Prep Now, Field Later',desc:'Use the day for preparation and relationship-building, field experience on a makeup day.'}
  ],scoring:{postpone:{feasibility:-5,depth:3,safety:8},modify:{feasibility:5,depth:-3,safety:5,reflection:3},hybrid:{feasibility:-3,depth:5,reflection:5}}});
  pool.push({title:'Partner Contact Lost',narrative:'48 hours before the experience, your primary community partner contact cancels. A colleague they recommended is available but has never worked with young people and does not know your objectives.',options:[
    {value:'substitute',title:'Accept the Substitute',desc:'Brief them quickly. Accept the interaction may be less polished.'},
    {value:'self-facilitate',title:'Go Without a Partner',desc:'Lead it yourself. Lose expert authenticity but gain full control.'},
    {value:'reschedule',title:'Reschedule for Original Partner',desc:'Push back the date. Preserves quality but disrupts everything else.'}
  ],scoring:{substitute:{feasibility:5,depth:-5,safety:-3},'self-facilitate':{feasibility:3,depth:-8,safety:5},reschedule:{feasibility:-8,depth:5,reflection:3}}});
  if(budget==='minimal'||budget==='moderate')pool.push({title:'Hidden Cost Barriers',narrative:'A week before the experience, three families have not returned permission forms and two say their children cannot participate due to cost — even though the activity is free. You suspect hidden costs (gear, lunch, sunscreen) create barriers.',options:[
    {value:'fund-solve',title:'Remove All Hidden Costs',desc:'Provide everything needed. Every learner participates identically.'},
    {value:'outreach',title:'Personal Family Outreach',desc:'Call each family. Learn their concerns and solve one by one.'},
    {value:'alt-path',title:'Create Parallel Participation',desc:'Design a meaningful alternative for those who cannot attend in person.'}
  ],scoring:{'fund-solve':{equity:12,feasibility:-5,safety:3},outreach:{equity:10,depth:3,feasibility:-3,reflection:3},'alt-path':{equity:5,depth:-3,feasibility:5,reflection:5}}});
  if(expType==='immersive')pool.push({title:'Learner in Emotional Crisis',narrative:'During the immersive experience, one learner becomes emotionally overwhelmed — homesick, anxious, withdrawing. Other learners notice. The learner says they want to go home.',options:[
    {value:'support',title:'Individual Support & Processing',desc:'Sit with the learner privately. Listen, validate, co-create a plan. Another adult covers the group.'},
    {value:'group',title:'Facilitated Group Discussion',desc:'With the learner\'s permission, use this as a learning moment about challenge, discomfort, and support.'},
    {value:'send-home',title:'Arrange Early Departure',desc:'Respect their wish. Arrange safe transport home and provide an independent reflection activity.'}
  ],scoring:{support:{safety:8,depth:3,equity:5,reflection:5},group:{depth:8,reflection:8,safety:-3,equity:3},'send-home':{safety:5,feasibility:5,depth:-8,equity:-3}}});
  // Default
  if(pool.length===0)pool.push({title:'Transportation Falls Through',narrative:'Morning of the experience. The bus company double-booked. No vehicles. Your site is 25 minutes away. You have 30 learners and 2 hours.',options:[
    {value:'carpool',title:'Emergency Carpool',desc:'Call every contact. Organize rides. Some will arrive late.'},
    {value:'relocate',title:'Relocate the Experience',desc:'Find a walkable alternative. Site changes, objectives stay.'},
    {value:'cancel',title:'Cancel and Reschedule',desc:'Call it off. Use the day for prep. Reschedule with confirmed transport.'}
  ],scoring:{carpool:{feasibility:-8,safety:-5},relocate:{feasibility:3,depth:-5,reflection:5,safety:3},cancel:{feasibility:-3,depth:3,safety:8}}});
  return pool[Math.floor(Math.random()*pool.length)];
}

// ===================== FEEDBACK =====================
function showFb(id,type,title,text){
  const el=document.getElementById(id);
  if(!el)return;
  el.className='fb '+type+' vis';
  const icon=type==='trade'?'⚖️':type==='warn'?'⚠':'⚡';
  el.innerHTML=`<h4>${icon} ${title}</h4><p>${text}</p>`;
}

// ===================== SUMMARY =====================
function buildSummary(){
  const d=S.d,s=S.sc;
  Object.keys(s).forEach(k=>{s[k]=Math.max(5,Math.min(100,s[k]))});
  const L={setting:{k12:'K–12 School',community:'Community / Youth Org',informal:'Informal / Independent'},ageGroup:{elementary:'Elementary (5–10)',middle:'Middle School (11–14)',high:'High School (15–18)',college:'College (18–24)',adult:'Adult (25+)'},expType:{discovery:'Discovery',outdoor:'Outdoor Challenge',apprenticeship:'Apprenticeship / Citizen Science',immersive:'Immersive'},duration:{'half-day':'Half Day','full-day':'Full Day','multi-day':'Multi-Day',extended:'Extended (1 week+)'},budget:{minimal:'Minimal ($0–100)',moderate:'Moderate ($100–500)',substantial:'Substantial ($500–2K)',major:'Major ($2K+)'}};
  const l=(k)=>L[k]?.[d[k]]||d[k]||'—';
  const gc=v=>v>=65?'var(--teal)':v>=40?'var(--gold)':'var(--coral)';
  const mkGauge=(label,val)=>{const off=220-(220*val/100);return`<div class="gauge"><svg viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="35"/><circle class="fl" cx="40" cy="40" r="35" stroke="${gc(val)}" style="stroke-dashoffset:${off}" /></svg><div class="gauge-n" style="color:${gc(val)}">${val}</div><div class="gauge-l">${label}</div></div>`};
  // Kolb summary
  let kolbHtml='';
  if(d.kolb){
    const labels={ce:'Concrete Experience',ro:'Reflective Observation',ac:'Abstract Conceptualization',ae:'Active Experimentation'};
    kolbHtml=Object.entries(d.kolb).filter(([_,v])=>v).map(([k,v])=>`<p><strong style="color:var(--gold)">${labels[k]}:</strong> ${v}</p>`).join('');
  }
  // Priorities
  const priLabels={safety:'Safety',depth:'Depth of Learning',access:'Equity & Access',engage:'Engagement',feasibility:'Feasibility',transfer:'Real-Life Transfer'};
  return `<div class="phase active">
    <div class="badge">Your Planning Profile</div>
    <div class="ph-title">Experience Plan Summary</div>
    <div class="ph-narr">Here is the experiential learning activity you built, the trade-offs you navigated, and your planning profile. Review, reflect, and consider what you would change.</div>
    <div class="sum-section"><h3>Your Decisions</h3>
      <div class="sum-row"><span class="lb">Setting</span><span class="vl">${l('setting')}</span></div>
      <div class="sum-row"><span class="lb">Age Group</span><span class="vl">${l('ageGroup')}</span></div>
      <div class="sum-row"><span class="lb">Group Size</span><span class="vl">${d.groupSize||20} learners</span></div>
      <div class="sum-row"><span class="lb">Top Priority</span><span class="vl">${priLabels[d.priorities?.[0]]||'—'}</span></div>
      <div class="sum-row"><span class="lb">Experience Type</span><span class="vl">${l('expType')}</span></div>
      <div class="sum-row"><span class="lb">Duration</span><span class="vl">${l('duration')}</span></div>
      <div class="sum-row"><span class="lb">Budget</span><span class="vl">${l('budget')}</span></div>
      <div class="sum-row"><span class="lb">Budget Allocation</span><span class="vl">${d.budgetAlloc?Object.entries(d.budgetAlloc).filter(([_,v])=>v>0).map(([k,v])=>`${k}: ${v}%`).join(', '):'—'}</span></div>
      <div class="sum-row"><span class="lb">Reflection Modes</span><span class="vl">${(d.reflectMode||[]).join(', ')||'—'}</span></div>
    </div>
    ${d.timeline?`<div class="sum-section"><h3>Your Activity Timeline</h3>${d.timeline.map((t,i)=>`<div style="margin-bottom:10px;padding-left:16px;border-left:2px solid var(--gold)"><div style="font-size:.78rem;color:var(--t3);font-weight:600;text-transform:uppercase;margin-bottom:2px">Moment ${i+1}</div><div style="font-size:.88rem;color:var(--t2);line-height:1.6">${t}</div></div>`).join('')}</div>`:''}
    <div class="sum-section"><h3>Planning Profile Scores</h3>
      <p style="font-size:.85rem;color:var(--t2);margin-bottom:14px">These reflect cumulative trade-offs. No plan scores perfectly everywhere — the goal is intentional balance.</p>
      <div class="gauge-grid">${mkGauge('Feasibility',s.feasibility)}${mkGauge('Depth',s.depth)}${mkGauge('Equity',s.equity)}${mkGauge('Safety',s.safety)}${mkGauge('Reflection',s.reflection)}</div>
    </div>
    <div class="sum-section"><h3>Trade-Offs You Navigated</h3>${S.tradeoffs.map(t=>`<div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.04)"><div style="font-weight:600;color:var(--gold);font-size:.82rem;margin-bottom:3px">${t.phase}</div><div style="font-size:.85rem;color:var(--t2);line-height:1.6">${t.text}</div></div>`).join('')}</div>
    ${kolbHtml?`<div class="ref-box"><h4>Your Kolb Cycle Design</h4>${kolbHtml}</div>`:''}
    ${d.adaptPlan?`<div class="ref-box"><h4>Your Disruption Adaptation Plan</h4><p>${d.adaptPlan}</p></div>`:''}
    ${d.mitigationPlan?`<div class="ref-box"><h4>Your Risk Mitigation Plan</h4><p>${d.mitigationPlan}</p></div>`:''}
    <div class="sum-section"><h3>Final Reflection</h3>
      <p style="font-size:.88rem;color:var(--t2);margin-bottom:6px">Take a moment to reflect on your planning process.</p>
      <textarea class="big-ref" placeholder="What did you learn about designing experiential learning? Which trade-off surprised you most? What would you do differently?"></textarea>
      <p style="font-size:.84rem;color:var(--t3);margin-top:12px;line-height:1.7">Consider: Which decision was hardest? Where did you feel tension between what you wanted and what was feasible? How did the disruption change your thinking? How does this connect to your own experiences as a learner?</p>
    </div>
    <div class="btn-row"><button class="btn btn-s" onclick="location.reload()">↺ Start Over</button><button class="btn btn-p" onclick="window.print()">Print Summary</button></div>
  </div>`;
}

// ===================== INIT =====================
render();
// Animate gauges
const obs=new MutationObserver(()=>{document.querySelectorAll('.gauge .fl').forEach(el=>{const t=el.style.strokeDashoffset;el.style.strokeDashoffset='220';requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.strokeDashoffset=t}))})});
obs.observe(document.getElementById('screens'),{childList:true,subtree:true});
</script>

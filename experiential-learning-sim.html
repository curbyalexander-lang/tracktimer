<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiential Learning Planning Simulation</title>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #1a1e2e;
  --bg-secondary: #232840;
  --bg-card: #2a3050;
  --bg-card-hover: #313760;
  --accent-gold: #e8b931;
  --accent-gold-dim: #c49a20;
  --accent-teal: #3ec9b0;
  --accent-coral: #e8735a;
  --accent-blue: #5b8def;
  --accent-purple: #9b7bea;
  --text-primary: #e8e6e1;
  --text-secondary: #a8a5a0;
  --text-dim: #706d68;
  --border: rgba(232, 185, 49, 0.15);
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.4);
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Source Sans 3', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
}

.grain-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}

.app-container {
  max-width: 860px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
}

/* Header */
.sim-header {
  text-align: center;
  padding: 50px 20px 40px;
  position: relative;
}

.sim-header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 3px;
  background: var(--accent-gold);
  border-radius: 2px;
}

.sim-header h1 {
  font-family: 'Bitter', serif;
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 12px;
  letter-spacing: -0.5px;
}

.sim-header .subtitle {
  font-size: 1.05rem;
  color: var(--text-secondary);
  font-weight: 300;
  max-width: 540px;
  margin: 0 auto;
}

/* Progress bar */
.progress-container {
  margin: 30px 0 10px;
  position: sticky;
  top: 10px;
  z-index: 100;
  background: var(--bg-primary);
  padding: 10px 0;
}

.progress-bar-bg {
  height: 6px;
  background: var(--bg-card);
  border-radius: 3px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-gold), var(--accent-teal));
  border-radius: 3px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.progress-label {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  font-size: 0.78rem;
  color: var(--text-dim);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Phase screens */
.phase-screen {
  display: none;
  animation: fadeSlideIn 0.5s ease;
}

.phase-screen.active {
  display: block;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.phase-title {
  font-family: 'Bitter', serif;
  font-size: 1.5rem;
  font-weight: 600;
  margin: 30px 0 8px;
  color: var(--accent-gold);
}

.phase-narrative {
  font-size: 1rem;
  color: var(--text-secondary);
  margin-bottom: 24px;
  line-height: 1.7;
  max-width: 680px;
}

/* Decision cards */
.decision-group {
  margin-bottom: 28px;
}

.decision-label {
  font-weight: 600;
  font-size: 0.88rem;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.decision-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.decision-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

.decision-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: transparent;
  transition: background 0.25s ease;
}

.decision-card:hover {
  background: var(--bg-card-hover);
  border-color: rgba(232, 185, 49, 0.3);
  transform: translateX(4px);
}

.decision-card.selected {
  border-color: var(--accent-gold);
  background: rgba(232, 185, 49, 0.08);
}

.decision-card.selected::before {
  background: var(--accent-gold);
}

.decision-card .card-title {
  font-weight: 600;
  font-size: 1rem;
  margin-bottom: 4px;
}

.decision-card .card-desc {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* Slider inputs */
.slider-group {
  margin-bottom: 28px;
}

.slider-label-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}

.slider-label {
  font-weight: 600;
  font-size: 0.88rem;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-dim);
}

.slider-value {
  font-size: 0.92rem;
  color: var(--accent-gold);
  font-weight: 600;
}

input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  background: var(--bg-card);
  border-radius: 3px;
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  background: var(--accent-gold);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(232, 185, 49, 0.3);
}

input[type="range"]::-moz-range-thumb {
  width: 20px;
  height: 20px;
  background: var(--accent-gold);
  border-radius: 50%;
  cursor: pointer;
  border: none;
}

.slider-endpoints {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 4px;
}

/* Trade-off feedback */
.tradeoff-panel {
  background: rgba(62, 201, 176, 0.06);
  border: 1px solid rgba(62, 201, 176, 0.2);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin: 20px 0 28px;
  display: none;
}

.tradeoff-panel.visible {
  display: block;
  animation: fadeSlideIn 0.4s ease;
}

.tradeoff-panel h4 {
  font-family: 'Bitter', serif;
  color: var(--accent-teal);
  font-size: 0.95rem;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tradeoff-panel p {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.65;
}

.tradeoff-icon {
  font-size: 1.1rem;
}

/* Warning panel */
.warning-panel {
  background: rgba(232, 115, 90, 0.08);
  border: 1px solid rgba(232, 115, 90, 0.25);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin: 20px 0 28px;
  display: none;
}

.warning-panel.visible {
  display: block;
  animation: fadeSlideIn 0.4s ease;
}

.warning-panel h4 {
  font-family: 'Bitter', serif;
  color: var(--accent-coral);
  font-size: 0.95rem;
  margin-bottom: 8px;
}

.warning-panel p {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.65;
}

/* Buttons */
.btn-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 30px;
  padding-bottom: 40px;
}

.btn {
  font-family: 'Source Sans 3', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-sm);
  padding: 12px 28px;
  cursor: pointer;
  transition: all 0.25s ease;
  letter-spacing: 0.3px;
}

.btn-primary {
  background: var(--accent-gold);
  color: var(--bg-primary);
}

.btn-primary:hover {
  background: var(--accent-gold-dim);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(232, 185, 49, 0.25);
}

.btn-primary:disabled {
  background: var(--text-dim);
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.btn-secondary {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  border-color: var(--text-dim);
  color: var(--text-primary);
}

/* Scenario Event (mid-sim disruption) */
.scenario-event {
  background: linear-gradient(135deg, rgba(155, 123, 234, 0.1), rgba(91, 141, 239, 0.08));
  border: 1px solid rgba(155, 123, 234, 0.3);
  border-radius: var(--radius);
  padding: 24px;
  margin: 20px 0;
}

.scenario-event h4 {
  font-family: 'Bitter', serif;
  color: var(--accent-purple);
  margin-bottom: 8px;
  font-size: 1.05rem;
}

.scenario-event p {
  color: var(--text-secondary);
  font-size: 0.92rem;
  line-height: 1.6;
}

/* Summary / Reflection */
.summary-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 20px;
}

.summary-section h3 {
  font-family: 'Bitter', serif;
  font-size: 1.15rem;
  color: var(--accent-gold);
  margin-bottom: 14px;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 0.92rem;
}

.summary-row:last-child { border-bottom: none; }

.summary-row .label {
  color: var(--text-dim);
  font-weight: 500;
}

.summary-row .value {
  color: var(--text-primary);
  font-weight: 600;
  text-align: right;
  max-width: 55%;
}

/* Score gauges */
.gauge-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin: 20px 0;
}

.gauge-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-sm);
  padding: 20px;
  text-align: center;
}

.gauge-ring {
  width: 90px;
  height: 90px;
  margin: 0 auto 10px;
  position: relative;
}

.gauge-ring svg {
  transform: rotate(-90deg);
  width: 90px;
  height: 90px;
}

.gauge-ring circle {
  fill: none;
  stroke-width: 6;
}

.gauge-ring .bg { stroke: var(--bg-card); }

.gauge-ring .fill {
  stroke-dasharray: 245;
  stroke-dashoffset: 245;
  stroke-linecap: round;
  transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.gauge-number {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Bitter', serif;
  font-size: 1.3rem;
  font-weight: 700;
}

.gauge-label {
  font-size: 0.82rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-dim);
}

/* Reflection text */
.reflection-box {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin: 20px 0;
}

.reflection-box h4 {
  font-family: 'Bitter', serif;
  color: var(--accent-teal);
  margin-bottom: 10px;
  font-size: 1rem;
}

.reflection-box p {
  color: var(--text-secondary);
  font-size: 0.92rem;
  line-height: 1.7;
  margin-bottom: 10px;
}

.reflection-box p:last-child { margin-bottom: 0; }

/* Textarea for reflection */
.reflect-textarea {
  width: 100%;
  min-height: 100px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: 'Source Sans 3', sans-serif;
  font-size: 0.92rem;
  padding: 14px;
  resize: vertical;
  line-height: 1.6;
  margin-top: 10px;
}

.reflect-textarea:focus {
  outline: none;
  border-color: var(--accent-gold);
}

.reflect-textarea::placeholder {
  color: var(--text-dim);
}

/* Kolb badge */
.kolb-badge {
  display: inline-block;
  background: rgba(232, 185, 49, 0.12);
  border: 1px solid rgba(232, 185, 49, 0.3);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--accent-gold);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 16px;
}

/* Intro screen */
.intro-features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin: 28px 0;
}

.intro-feature {
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  padding: 18px;
  border: 1px solid var(--border);
}

.intro-feature .feat-icon {
  font-size: 1.5rem;
  margin-bottom: 8px;
}

.intro-feature h4 {
  font-size: 0.92rem;
  font-weight: 600;
  margin-bottom: 4px;
}

.intro-feature p {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* Multi-select checkboxes */
.checkbox-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 20px;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  gap: 12px;
}

.checkbox-card:hover {
  background: var(--bg-card-hover);
}

.checkbox-card.checked {
  border-color: var(--accent-teal);
  background: rgba(62, 201, 176, 0.06);
}

.check-box {
  width: 20px;
  height: 20px;
  border: 2px solid var(--text-dim);
  border-radius: 4px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.checkbox-card.checked .check-box {
  background: var(--accent-teal);
  border-color: var(--accent-teal);
}

.check-box::after {
  content: '✓';
  color: var(--bg-primary);
  font-weight: 700;
  font-size: 0.75rem;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.checkbox-card.checked .check-box::after {
  opacity: 1;
}

/* Print styles */
@media print {
  body { background: #fff; color: #222; }
  .progress-container, .btn-row, .grain-overlay { display: none; }
  .summary-section, .reflection-box, .gauge-card { break-inside: avoid; }
}

@media (max-width: 600px) {
  .app-container { padding: 12px; }
  .sim-header { padding: 30px 10px 30px; }
  .gauge-grid { grid-template-columns: 1fr 1fr; }
  .btn-row { flex-direction: column; gap: 10px; }
  .btn-row .btn { width: 100%; text-align: center; }
}
</style>
</head>
<body>

<div class="grain-overlay"></div>

<div class="app-container" id="app">

  <!-- HEADER -->
  <div class="sim-header">
    <h1>Experiential Learning<br>Planning Simulation</h1>
    <p class="subtitle">Design a meaningful learning experience from concept to implementation, navigating real-world trade-offs along the way.</p>
  </div>

  <!-- PROGRESS -->
  <div class="progress-container" id="progressContainer" style="display:none;">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-label">
      <span id="progressPhase">Phase 1</span>
      <span id="progressPercent">0%</span>
    </div>
  </div>

  <!-- SCREENS CONTAINER -->
  <div id="screensContainer"></div>

</div>

<script>
// ========== SIMULATION ENGINE ==========

const state = {
  currentPhase: 0,
  decisions: {},
  tradeoffs: [],
  scores: { feasibility: 50, depth: 50, equity: 50, safety: 50, reflection: 50 }
};

const phases = [
  // 0: INTRO
  {
    id: 'intro',
    render: () => `
      <div class="phase-screen active" id="screen-intro">
        <div class="kolb-badge">Concrete Experience → Reflective Observation</div>
        <div class="phase-title">Welcome, Planner</div>
        <div class="phase-narrative">
          You are about to design an experiential learning activity for a group of young people. Over the next several phases, you will make decisions about who your learners are, what type of experience to create, how to manage logistics and partnerships, how to handle risk, and how to build in meaningful reflection. Along the way, you will encounter realistic trade-offs and at least one unexpected disruption that will require you to adapt your plan.
        </div>
        <div class="intro-features">
          <div class="intro-feature">
            <div class="feat-icon">🧭</div>
            <h4>7 Planning Phases</h4>
            <p>Move through the full arc of planning, from learner context to reflection design.</p>
          </div>
          <div class="intro-feature">
            <div class="feat-icon">⚖️</div>
            <h4>Real Trade-Offs</h4>
            <p>Every decision carries consequences. Budget, safety, equity, and depth interact.</p>
          </div>
          <div class="intro-feature">
            <div class="feat-icon">🌀</div>
            <h4>Disruption Event</h4>
            <p>An unexpected scenario will force you to adapt your plan mid-stream.</p>
          </div>
          <div class="intro-feature">
            <div class="feat-icon">📝</div>
            <h4>Reflection Summary</h4>
            <p>Review your plan, see your planning profile, and reflect on your decisions.</p>
          </div>
        </div>
        <div class="btn-row">
          <div></div>
          <button class="btn btn-primary" onclick="nextPhase()">Begin Planning →</button>
        </div>
      </div>
    `
  },

  // 1: LEARNER CONTEXT
  {
    id: 'learner-context',
    render: () => `
      <div class="phase-screen active">
        <div class="kolb-badge">Phase 1 of 7</div>
        <div class="phase-title">Who Are Your Learners?</div>
        <div class="phase-narrative">
          Before choosing the type of experience, ground yourself in the learners. Who are they, what do they bring with them, and what contextual factors will shape your planning?
        </div>

        <div class="decision-group">
          <div class="decision-label">Setting</div>
          <div class="decision-options">
            ${makeRadio('setting', [
              { value:'k12', title:'K–12 School', desc:'You are planning within a school setting with institutional support, schedules, and administrative approval processes.' },
              { value:'community', title:'Community or Youth Organization', desc:'You are working with a community group, Scout troop, faith organization, or after-school program with more flexibility but fewer institutional resources.' },
              { value:'informal', title:'Informal / Independent', desc:'You are designing for a homeschool co-op, museum program, summer camp, or other non-institutional context.' }
            ])}
          </div>
        </div>

        <div class="decision-group">
          <div class="decision-label">Age Group</div>
          <div class="decision-options">
            ${makeRadio('ageGroup', [
              { value:'elementary', title:'Elementary (Ages 5–10)', desc:'Shorter attention spans, need for concrete and sensory-rich experiences, high adult supervision requirements.' },
              { value:'middle', title:'Middle School (Ages 11–14)', desc:'Increasing capacity for abstraction, strong peer influence, growing need for autonomy and choice.' },
              { value:'high', title:'High School (Ages 15–18)', desc:'Can handle longer, more complex experiences; ready for authentic professional and community engagement.' }
            ])}
          </div>
        </div>

        <div class="slider-group">
          <div class="slider-label-row">
            <span class="slider-label">Group Size</span>
            <span class="slider-value" id="groupSizeVal">20 learners</span>
          </div>
          <input type="range" min="6" max="60" value="20" id="groupSize" oninput="updateSlider('groupSize', this.value, ' learners')">
          <div class="slider-endpoints"><span>6</span><span>60</span></div>
        </div>

        <div class="slider-group">
          <div class="slider-label-row">
            <span class="slider-label">Diversity of Needs</span>
            <span class="slider-value" id="diversityVal">Moderate</span>
          </div>
          <input type="range" min="1" max="5" value="3" id="diversity" oninput="updateDiversity(this.value)">
          <div class="slider-endpoints"><span>Homogeneous</span><span>Highly Diverse</span></div>
        </div>

        <div id="tradeoff-learner" class="tradeoff-panel"></div>

        <div class="btn-row">
          <button class="btn btn-secondary" onclick="prevPhase()">← Back</button>
          <button class="btn btn-primary" id="btn-next-1" onclick="submitPhase1()" disabled>Continue →</button>
        </div>
      </div>
    `
  },

  // 2: EXPERIENCE TYPE
  {
    id: 'experience-type',
    render: () => `
      <div class="phase-screen active">
        <div class="kolb-badge">Phase 2 of 7</div>
        <div class="phase-title">Choose the Experience Type</div>
        <div class="phase-narrative">
          Experiential learning takes many forms. The type you choose shapes everything that follows — logistics, partnerships, risk, reflection, and the kind of learning that becomes possible. Consider what is most appropriate given your learners.
        </div>

        <div class="decision-group">
          <div class="decision-label">Primary Experience Category</div>
          <div class="decision-options">
            ${makeRadio('expType', [
              { value:'discovery', title:'Discovery Experience', desc:'Field trips, nature exploration, museum visits, guided investigations — learners encounter new environments and phenomena directly.' },
              { value:'outdoor', title:'Outdoor Challenge', desc:'Hiking, camping, ropes courses, orienteering — learners face physical and interpersonal challenges in natural settings.' },
              { value:'apprenticeship', title:'Apprenticeship / Citizen Science', desc:'Internships, mentorships, citizen science projects, service learning — learners work alongside experts or contribute to real-world efforts.' },
              { value:'immersive', title:'Immersive Experience', desc:'Study abroad, cultural exchange, extended residency — learners are fully embedded in an unfamiliar context for a sustained period.' }
            ])}
          </div>
        </div>

        <div class="decision-group">
          <div class="decision-label">Duration</div>

// ========== HELPERS ==========

function makeRadio(name, options) {
  return options.map(o => `
    <div class="decision-card" onclick="selectRadio('${name}', '${o.value}', this)" data-group="${name}" data-value="${o.value}">
      <div class="card-title">${o.title}</div>
      <div class="card-desc">${o.desc}</div>
    </div>
  `).join('');
}

function makeCheckbox(name, options) {
  return options.map(o => `
    <div class="checkbox-card" onclick="toggleCheck('${name}', '${o.value}', this)" data-group="${name}" data-value="${o.value}">
      <div class="check-box"></div>
      <div>
        <div class="card-title">${o.title}</div>
        <div class="card-desc">${o.desc}</div>
      </div>
    </div>
  `).join('');
}

function selectRadio(name, value, el) {
  document.querySelectorAll(`[data-group="${name}"]`).forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  state.decisions[name] = value;
  checkPhaseReady();
}

function toggleCheck(name, value, el) {
  el.classList.toggle('checked');
  if (!state.decisions[name]) state.decisions[name] = [];
  const arr = state.decisions[name];
  const idx = arr.indexOf(value);
  if (idx > -1) arr.splice(idx, 1);
  else arr.push(value);

  // "none" is exclusive for partners
  if (name === 'partners') {
    if (value === 'none' && arr.includes('none')) {
      state.decisions[name] = ['none'];
      document.querySelectorAll(`[data-group="partners"]`).forEach(c => {
        if (c.dataset.value !== 'none') c.classList.remove('checked');
      });
    } else if (value !== 'none' && arr.includes('none')) {
      state.decisions[name] = arr.filter(v => v !== 'none');
      document.querySelectorAll(`[data-group="partners"][data-value="none"]`).forEach(c => c.classList.remove('checked'));
    }
  }
  checkPhaseReady();
}

function updateSlider(id, val, suffix) {
  document.getElementById(id + 'Val').textContent = val + suffix;
  state.decisions[id] = parseInt(val);
}

function updateDiversity(val) {
  const labels = ['Very Low', 'Low', 'Moderate', 'High', 'Very High'];
  document.getElementById('diversityVal').textContent = labels[val - 1];
  state.decisions.diversity = parseInt(val);
}

function updateRatio(val) {
  const ratios = ['1:4', '1:6', '1:8', '1:10', '1:15'];
  document.getElementById('ratioVal').textContent = ratios[val - 1];
  state.decisions.ratio = parseInt(val);
}

function checkPhaseReady() {
  const p = state.currentPhase;
  let ready = false;
  switch(p) {
    case 1: ready = state.decisions.setting && state.decisions.ageGroup; break;
    case 2: ready = state.decisions.expType && state.decisions.duration; break;
    case 3: ready = state.decisions.budget && state.decisions.transport; break;
    case 4: ready = state.decisions.familyComm && state.decisions.adminBuyin && (state.decisions.partners && state.decisions.partners.length > 0); break;
    case 5: ready = state.decisions.riskLevel && state.decisions.contingency && (state.decisions.equity && state.decisions.equity.length > 0); break;
    case 6: ready = state.decisions.disruptionResponse && state.decisions.agency && state.decisions.facilitatorRole; break;
    case 7: ready = state.decisions.reflectTiming && state.decisions.reflectDepth && (state.decisions.reflectMode && state.decisions.reflectMode.length > 0); break;
    default: ready = true;
  }
  const btn = document.getElementById(`btn-next-${p}`);
  if (btn) btn.disabled = !ready;
}

function updateProgress() {
  const pct = Math.round((state.currentPhase / (phases.length - 1)) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPercent').textContent = pct + '%';
  const names = ['Start', 'Learners', 'Experience', 'Logistics', 'Partners', 'Safety & Equity', 'Disruption & Facilitation', 'Reflection', 'Summary'];
  document.getElementById('progressPhase').textContent = names[state.currentPhase] || '';
}

function renderCurrentPhase() {
  const container = document.getElementById('screensContainer');
  container.innerHTML = phases[state.currentPhase].render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  updateProgress();
  if (state.currentPhase > 0) document.getElementById('progressContainer').style.display = 'block';

  // Restore slider defaults
  if (state.currentPhase === 1) {
    state.decisions.groupSize = state.decisions.groupSize || 20;
    state.decisions.diversity = state.decisions.diversity || 3;
  }
  if (state.currentPhase === 3) {
    state.decisions.ratio = state.decisions.ratio || 3;
  }
}

function nextPhase() {
  state.currentPhase++;
  renderCurrentPhase();
}

function prevPhase() {
  if (state.currentPhase > 0) {
    state.currentPhase--;
    renderCurrentPhase();
  }
}

function showTradeoff(panelId, title, text) {
  const panel = document.getElementById(panelId);
  if (!panel) return;
  panel.innerHTML = `<h4><span class="tradeoff-icon">⚖️</span> Trade-Off: ${title}</h4><p>${text}</p>`;
  panel.classList.add('visible');
}

function showWarning(panelId, title, text) {
  const panel = document.getElementById(panelId);
  if (!panel) return;
  panel.innerHTML = `<h4>⚠ ${title}</h4><p>${text}</p>`;
  panel.classList.add('visible');
}

// ========== PHASE SUBMISSIONS ==========

function submitPhase1() {
  const { setting, ageGroup, groupSize, diversity } = state.decisions;
  let tradeoff = '';
  if (groupSize > 30 && diversity >= 4) {
    tradeoff = 'Large groups with high diversity demand significantly more planning for differentiation and accommodations. You may need to increase your adult-to-learner ratio or narrow the scope of the experience to make it manageable.';
    state.scores.feasibility -= 8;
    state.scores.equity += 5;
  } else if (ageGroup === 'elementary' && setting === 'informal') {
    tradeoff = 'Elementary-age learners in informal settings can be wonderfully flexible, but without institutional structures, you bear full responsibility for safety protocols, medical information, and emergency procedures.';
    state.scores.safety -= 5;
  } else if (groupSize > 40) {
    tradeoff = 'Groups over 40 create logistical complexity that can overshadow the learning. Consider whether splitting into cohorts with staggered experiences might serve learners better.';
    state.scores.feasibility -= 10;
  } else {
    tradeoff = 'Your learner context is manageable. Keep this profile in mind as you choose your experience type — the best experiential learning matches the developmental needs of the specific learners in front of you.';
  }
  showTradeoff('tradeoff-learner', 'Learner Context', tradeoff);
  state.tradeoffs.push({ phase: 'Learner Context', text: tradeoff });
  nextPhase();
}

function submitPhase2() {
  const { expType, duration, ageGroup } = state.decisions;
  let tradeoff = '';

  if (expType === 'immersive' && duration === 'half-day') {
    tradeoff = 'An immersive experience in a half-day is a contradiction. Immersion requires sustained time in an unfamiliar context. Consider extending the duration or choosing a discovery experience instead. Your plan\'s depth score will reflect this tension.';
    state.scores.depth -= 15;
    state.scores.feasibility += 5;
  } else if (expType === 'outdoor' && ageGroup === 'elementary' && duration === 'multi-day') {
    tradeoff = 'Multi-day outdoor challenges with elementary learners are powerful but demand exceptional supervision, emotional readiness support, and parent/guardian trust. Your safety planning will need to be especially thorough.';
    state.scores.depth += 10;
    state.scores.safety -= 10;
  } else if (expType === 'apprenticeship') {
    tradeoff = 'Apprenticeship models depend heavily on the quality and reliability of your community partner. The learning ceiling is high, but so is your dependence on someone outside your direct control.';
    state.scores.depth += 8;
    state.scores.feasibility -= 5;
  } else if (expType === 'discovery' && duration === 'extended') {
    tradeoff = 'Extended discovery experiences are unusual. Most discovery activities are shorter. If you are planning a week-long investigation, consider whether this is really becoming an apprenticeship or immersive model — and plan accordingly.';
    state.scores.depth += 5;
  } else if (expType === 'immersive' && duration === 'extended') {
    tradeoff = 'This is the gold standard of experiential learning — deep, sustained immersion. The planning burden is enormous, but the potential for transformative learning (Mezirow) is at its highest. Every other planning decision must be made with exceptional care.';
    state.scores.depth += 15;
    state.scores.feasibility -= 12;
    state.scores.safety -= 5;
  } else {
    tradeoff = 'Your experience type and duration are well-matched. The key now is ensuring the logistics and partnerships support the depth of engagement you are designing for.';
    state.scores.depth += 5;
  }
  showTradeoff('tradeoff-exptype', 'Experience Design', tradeoff);
  state.tradeoffs.push({ phase: 'Experience Type', text: tradeoff });
  nextPhase();
}

function submitPhase3() {
  const { budget, transport, ratio, expType, groupSize, duration } = state.decisions;
  let tradeoff = '';
  let warning = '';

  if (budget === 'minimal' && transport === 'regional') {
    tradeoff = 'You have a minimal budget but regional transportation needs. Transportation is often the single largest expense. You will need to secure donated bus service, organize a volunteer carpool, or find grant funding for transport alone.';
    state.scores.feasibility -= 10;
  } else if (budget === 'major' && expType === 'discovery') {
    tradeoff = 'You are allocating major funding to a discovery experience. That is a significant investment — make sure the experience justifies it. Could a moderate budget achieve similar learning outcomes, freeing resources for reflection activities or follow-up experiences?';
    state.scores.feasibility += 5;
  } else if (budget === 'minimal' && duration === 'extended') {
    tradeoff = 'Extended experiences on a minimal budget require extraordinary creativity — donated lodging, volunteer-cooked meals, borrowed equipment. It is possible, but your planning time will multiply.';
    state.scores.feasibility -= 12;
  } else {
    tradeoff = 'Your budget and transportation choices are aligned with your experience type. Solid logistical planning is what separates a good idea from a good experience.';
  }

  const ratioNum = [4, 6, 8, 10, 15][ratio - 1];
  if (ratioNum > 10 && groupSize > 25 && (expType === 'outdoor' || expType === 'immersive')) {
    warning = `A 1:${ratioNum} ratio with ${groupSize} learners in an ${expType} experience may not provide adequate supervision for safety. Consider recruiting additional volunteers or reducing group size.`;
    state.scores.safety -= 10;
  }

  showTradeoff('tradeoff-logistics', 'Logistics', tradeoff);
  if (warning) showWarning('warning-logistics', 'Supervision Concern', warning);
  state.tradeoffs.push({ phase: 'Logistics', text: tradeoff + (warning ? ' ' + warning : '') });
  nextPhase();
}

function submitPhase4() {
  const { partners, familyComm, adminBuyin, expType } = state.decisions;
  let tradeoff = '';

  if (partners.includes('co-designer') && adminBuyin === 'uphill') {
    tradeoff = 'You are co-designing with a community partner but facing institutional resistance. This is a powerful combination — your partner\'s credibility and enthusiasm can help you make the case to leadership. Consider having the partner present alongside you.';
    state.scores.depth += 5;
  } else if (partners.includes('none') && expType === 'apprenticeship') {
    tradeoff = 'An apprenticeship without an external partner is unusual. Apprenticeship models depend on learners working alongside people who do this work professionally. Reconsider whether a discovery or outdoor challenge might better fit your solo facilitation plan.';
    state.scores.depth -= 10;
  } else if (familyComm === 'family-involved') {
    tradeoff = 'Family involvement deepens the experience and builds community support. It also adds coordination complexity — you are now planning for two audiences. Make sure the family role is meaningful, not performative.';
    state.scores.equity += 8;
    state.scores.feasibility -= 5;
  } else if (familyComm === 'permission-only' && (expType === 'immersive' || expType === 'outdoor')) {
    tradeoff = 'A permission slip alone may not be sufficient for this type of experience. Families who do not understand the purpose and safety plan may resist — or worse, pull learners out at the last minute. An information session builds trust and reduces attrition.';
    state.scores.safety -= 5;
    state.scores.equity -= 5;
  } else {
    tradeoff = 'Your partnership and communication plan is appropriate for the experience. Strong stakeholder relationships create a foundation that absorbs disruptions more gracefully.';
    state.scores.feasibility += 3;
  }

  showTradeoff('tradeoff-partners', 'Partnerships', tradeoff);
  state.tradeoffs.push({ phase: 'Partnerships', text: tradeoff });
  nextPhase();
}

function submitPhase5() {
  const { riskLevel, equity, contingency, expType, ageGroup, ratio } = state.decisions;
  let tradeoff = '';
  let warning = '';

  const equityCount = equity.length;
  if (equityCount >= 3) {
    state.scores.equity += 15;
    tradeoff = 'You are investing heavily in equity and access. This is admirable and important — but each strategy requires planning time and potentially budget. Make sure your equity intentions translate into concrete, actionable steps rather than aspirational statements.';
  } else if (equityCount === 1) {
    tradeoff = 'You have selected only one equity strategy. Consider whether other barriers exist that you have not addressed. The learners most likely to be excluded are often the ones who benefit most from experiential learning.';
    state.scores.equity -= 5;
  } else {
    tradeoff = 'Your equity strategies are reasonable. Keep pressure-testing them as you finalize the plan — access barriers often hide in details.';
    state.scores.equity += 5;
  }

  if (riskLevel === 'high' && contingency === 'minimal') {
    warning = 'You have a high-risk activity with no formal contingency plan. This is a significant concern. What happens if a learner is injured? What happens if weather makes the activity unsafe? Without a plan, you are relying entirely on improvisation in moments that demand clarity.';
    state.scores.safety -= 15;
  } else if (riskLevel === 'high' && contingency === 'full-contingency') {
    state.scores.safety += 10;
  }

  if (contingency === 'minimal' && expType === 'immersive') {
    warning = (warning ? warning + ' ' : '') + 'Immersive experiences have so many potential failure points that improvisation is not a strategy — it is a gamble.';
    state.scores.safety -= 8;
  }

  showTradeoff('tradeoff-safety', 'Safety & Equity', tradeoff);
  if (warning) showWarning('warning-safety', 'Safety Concern', warning);
  state.tradeoffs.push({ phase: 'Safety & Equity', text: tradeoff + (warning ? ' ' + warning : '') });
  nextPhase();
}

function submitPhase6() {
  const { disruptionResponse, agency, facilitatorRole, expType, ageGroup } = state.decisions;
  let tradeoff = '';

  // Score disruption response
  const disruption = state.decisions.disruption;
  const responseScores = disruption.scoring[disruptionResponse];
  if (responseScores) {
    Object.entries(responseScores).forEach(([key, val]) => {
      state.scores[key] = Math.max(0, Math.min(100, state.scores[key] + val));
    });
  }

  if (agency === 'open' && ageGroup === 'elementary') {
    tradeoff = 'Open inquiry with elementary learners is ambitious. Young learners thrive with choice within structure. Consider scaffolded choice instead — give them agency within guardrails. Dewey\'s interaction principle suggests the environment must be designed to meet the learner where they are.';
    state.scores.depth -= 5;
  } else if (facilitatorRole === 'co-learner' && agency === 'guided') {
    tradeoff = 'You want to be a co-learner while also maintaining a guided structure. These can coexist, but there is tension — someone has to manage the logistics while you are in the experience. Make sure another adult is handling transitions and time.';
    state.scores.feasibility -= 3;
  } else if (agency === 'scaffolded' && facilitatorRole === 'facilitator') {
    tradeoff = 'Scaffolded choice with facilitator guidance is a sweet spot in experiential learning. Learners have agency, and you are positioned to deepen their thinking in real-time. This is Vygotsky\'s zone of proximal development in action.';
    state.scores.depth += 8;
    state.scores.reflection += 5;
  } else {
    tradeoff = 'Your facilitation design reflects clear intentionality. Remember that the facilitator\'s role is not fixed — even within a single experience, you may need to shift between directing, facilitating, and participating based on what the moment requires.';
    state.scores.depth += 3;
  }

  showTradeoff('tradeoff-disruption', 'Facilitation', tradeoff);
  state.tradeoffs.push({ phase: 'Facilitation', text: tradeoff });
  nextPhase();
}

function submitPhase7() {
  const { reflectTiming, reflectMode, reflectDepth, duration } = state.decisions;
  let tradeoff = '';

  if (reflectTiming === 'after' && duration === 'extended') {
    tradeoff = 'Saving all reflection for the end of an extended experience is a missed opportunity. Days of experience without processing can lead to surface-level recall rather than deep learning. Kolb\'s cycle is iterative — reflection should spiral throughout.';
    state.scores.reflection -= 10;
  } else if (reflectTiming === 'both') {
    state.scores.reflection += 10;
    tradeoff = 'Embedding reflection throughout AND holding a post-experience debrief maximizes the learning cycle. You are honoring both Kolb\'s iterative model and Dewey\'s insistence that reflection is where experience becomes education.';
  }

  if (reflectDepth === 'transformative' && reflectMode.length >= 3) {
    state.scores.reflection += 12;
    tradeoff += ' You are designing for transformative learning with multiple modalities — this is sophisticated reflection design. Make sure you give learners enough time and safety to genuinely examine their assumptions.';
  } else if (reflectDepth === 'descriptive') {
    tradeoff += ' Descriptive reflection is a starting point, not an endpoint. Even young learners can move toward "So what?" with good prompting. Consider building in at least one analytical question.';
    state.scores.reflection -= 5;
  }

  if (reflectMode && reflectMode.includes('creative')) {
    state.scores.reflection += 5;
  }

  showTradeoff('tradeoff-reflection', 'Reflection Design', tradeoff);
  state.tradeoffs.push({ phase: 'Reflection', text: tradeoff });
  nextPhase();
}

// ========== DISRUPTION GENERATOR ==========

function generateDisruption() {
  const { expType, duration, budget, setting, partners } = state.decisions;
  const disruptions = [];

  if (expType === 'outdoor' || expType === 'discovery') {
    disruptions.push({
      narrative: 'Two days before your planned experience, a severe weather advisory is issued for the area. Rain and thunderstorms are expected throughout your scheduled time. Your partner site remains available, but outdoor activities will be unsafe.',
      options: [
        { value: 'postpone', title: 'Postpone to Next Available Date', desc: 'Delay the entire experience to wait for good weather. This preserves the original plan but disrupts schedules and may lose momentum.' },
        { value: 'modify', title: 'Modify to Indoor Alternative', desc: 'Adapt the experience to work indoors or under shelter. Learners still go — the activities change.' },
        { value: 'hybrid', title: 'Split: Virtual Prep Now, In-Person Later', desc: 'Use the scheduled day for virtual preparation and relationship-building, then do the field experience on a makeup day.' }
      ],
      scoring: {
        postpone: { feasibility: -5, depth: 3, safety: 8 },
        modify: { feasibility: 5, depth: -3, safety: 5, reflection: 3 },
        hybrid: { feasibility: -3, depth: 5, reflection: 5 }
      }
    });
  }

  if (partners && !partners.includes('none')) {
    disruptions.push({
      narrative: 'Your primary community partner contact has just informed you — 48 hours before the experience — that they have a scheduling conflict and cannot be present. A colleague they recommended is available but has never worked with young people before and does not know your learning objectives.',
      options: [
        { value: 'substitute', title: 'Accept the Substitute', desc: 'Work with the new contact. Brief them quickly on objectives and learner needs. Accept that the interaction may be less refined.' },
        { value: 'self-facilitate', title: 'Facilitate Without a Partner', desc: 'Drop the partner component and lead the experience yourself. You lose expert authenticity but gain full control.' },
        { value: 'reschedule', title: 'Reschedule for Original Partner', desc: 'Push back the date to have your established partner. Preserves relationship quality but disrupts logistics.' }
      ],
      scoring: {
        substitute: { feasibility: 5, depth: -5, safety: -3 },
        'self-facilitate': { feasibility: 3, depth: -8, safety: 5 },
        reschedule: { feasibility: -8, depth: 5, reflection: 3 }
      }
    });
  }

  if (budget === 'minimal' || budget === 'moderate') {
    disruptions.push({
      narrative: 'A week before the experience, you learn that three families have not returned permission forms and two have indicated their children cannot participate due to cost concerns — even though the activity is described as free. You suspect there are hidden costs (appropriate clothing, packed lunch, sunscreen) that create barriers.',
      options: [
        { value: 'fund-solve', title: 'Remove All Hidden Costs', desc: 'Use emergency funds, donations, or your own money to provide everything needed. Every learner participates identically.' },
        { value: 'personal-outreach', title: 'Personal Family Outreach', desc: 'Call each family individually, learn their specific concerns, and problem-solve one by one. More time-intensive but relationship-building.' },
        { value: 'alt-path', title: 'Create Alternative Participation', desc: 'Design a meaningful parallel experience for learners who cannot attend in person — not busy work, but genuine learning connected to the same objectives.' }
      ],
      scoring: {
        'fund-solve': { equity: 12, feasibility: -5, safety: 3 },
        'personal-outreach': { equity: 10, depth: 3, feasibility: -3, reflection: 3 },
        'alt-path': { equity: 5, depth: -3, feasibility: 5, reflection: 5 }
      }
    });
  }

  if (expType === 'immersive') {
    disruptions.push({
      narrative: 'During the immersive experience, one learner becomes emotionally overwhelmed — they are homesick, anxious, and beginning to withdraw from the group. Other learners are noticing and it is affecting group dynamics. The learner says they want to go home.',
      options: [
        { value: 'one-on-one', title: 'Individual Support & Processing', desc: 'Sit with the learner privately. Listen, validate, and co-create a plan for the rest of the experience. Another adult covers the group.' },
        { value: 'group-address', title: 'Address It With the Group', desc: 'Use this as a learning moment. Facilitate a group discussion about challenge, discomfort, and supporting each other. With the learner\'s permission.' },
        { value: 'send-home', title: 'Arrange Early Departure', desc: 'Respect the learner\'s stated wish. Arrange safe transportation home and provide a reflection activity to complete independently.' }
      ],
      scoring: {
        'one-on-one': { safety: 8, depth: 3, equity: 5, reflection: 5 },
        'group-address': { depth: 8, reflection: 8, safety: -3, equity: 3 },
        'send-home': { safety: 5, feasibility: 5, depth: -8, equity: -3 }
      }
    });
  }

  // Default fallback
  if (disruptions.length === 0) {
    disruptions.push({
      narrative: 'On the morning of the experience, the transportation you arranged falls through. The bus company double-booked and has no vehicles available. Your experience site is 25 minutes away by car. You have 30 learners and the experience starts in two hours.',
      options: [
        { value: 'scramble-rides', title: 'Emergency Carpool', desc: 'Call every parent, colleague, and volunteer you know. Organize an emergency carpool. Some learners may arrive late.' },
        { value: 'relocate', title: 'Relocate the Experience', desc: 'Find a walkable alternative location and adapt the activities. The site changes but the learning objectives stay.' },
        { value: 'postpone', title: 'Cancel and Reschedule', desc: 'Call it off. Use the day for preparation activities and reschedule the experience with confirmed transportation.' }
      ],
      scoring: {
        'scramble-rides': { feasibility: -8, depth: 0, safety: -5 },
        relocate: { feasibility: 3, depth: -5, reflection: 5, safety: 3 },
        postpone: { feasibility: -3, depth: 3, safety: 8 }
      }
    });
  }

  // Pick a random disruption
  return disruptions[Math.floor(Math.random() * disruptions.length)];
}

// ========== SUMMARY RENDER ==========

function renderSummary() {
  const d = state.decisions;
  const s = state.scores;

  // Clamp scores
  Object.keys(s).forEach(k => { s[k] = Math.max(5, Math.min(100, s[k])); });

  const labels = {
    setting: { 'k12': 'K–12 School', community: 'Community / Youth Org', informal: 'Informal / Independent' },
    ageGroup: { elementary: 'Elementary (5–10)', middle: 'Middle School (11–14)', high: 'High School (15–18)' },
    expType: { discovery: 'Discovery Experience', outdoor: 'Outdoor Challenge', apprenticeship: 'Apprenticeship / Citizen Science', immersive: 'Immersive Experience' },
    duration: { 'half-day': 'Half Day', 'full-day': 'Full Day', 'multi-day': 'Multi-Day', extended: 'Extended (1 week+)' },
    budget: { minimal: 'Minimal ($0–100)', moderate: 'Moderate ($100–500)', substantial: 'Substantial ($500–2K)', major: 'Major ($2K+)' },
    transport: { walk: 'Walking / On-Site', local: 'Local Transit', regional: 'Regional Travel', distant: 'Distant Travel' },
    agency: { guided: 'Guided / Structured', scaffolded: 'Scaffolded Choice', open: 'Open Inquiry' },
    facilitatorRole: { director: 'Director', facilitator: 'Facilitator', 'co-learner': 'Co-Learner' },
    familyComm: { 'permission-only': 'Permission Slip Only', 'info-session': 'Info Session + Permission', 'family-involved': 'Family Involvement' },
    adminBuyin: { 'pre-approved': 'Pre-Approved', 'needs-pitch': 'Needs a Pitch', uphill: 'Uphill Battle' },
    riskLevel: { low: 'Low', moderate: 'Moderate', high: 'High' },
    contingency: { minimal: 'Minimal', 'backup-plan': 'Backup Plan', 'full-contingency': 'Full Contingency Framework' },
    reflectTiming: { during: 'Embedded Throughout', after: 'Post-Experience', both: 'Both During & After' },
    reflectDepth: { descriptive: 'Descriptive (What happened?)', analytical: 'Analytical (So what?)', transformative: 'Transformative (Now what?)' }
  };

  const l = (key) => labels[key]?.[d[key]] || d[key] || '—';
  const ratioLabels = ['1:4', '1:6', '1:8', '1:10', '1:15'];
  const partnerLabels = { 'site-host': 'Site Host', 'expert-mentor': 'Expert/Mentor', 'co-designer': 'Co-Designer', none: 'No External Partner' };
  const equityLabels = { 'cost-barrier': 'Eliminate Cost Barriers', accommodations: 'Accommodations & UDL', 'cultural-sensitivity': 'Cultural Sensitivity Review', 'alt-participation': 'Alternative Participation' };
  const reflectModeLabels = { discussion: 'Discussion/Debrief', journal: 'Written Journal', creative: 'Creative Expression', presentation: 'Presentation' };

  const gaugeColor = (val) => val >= 65 ? 'var(--accent-teal)' : val >= 40 ? 'var(--accent-gold)' : 'var(--accent-coral)';

  // Generate Kolb connection
  let kolbText = '';
  if (d.reflectTiming === 'both' && d.reflectDepth === 'transformative') {
    kolbText = 'Your plan engages the full Kolb cycle: concrete experience through the activity itself, reflective observation through embedded processing, abstract conceptualization through analytical and transformative questioning, and active experimentation through learners applying new understanding. This is sophisticated experiential design.';
  } else if (d.reflectTiming === 'after' && d.reflectDepth === 'descriptive') {
    kolbText = 'Your plan emphasizes concrete experience and basic reflective observation. Consider how you might push learners further into abstract conceptualization — connecting what they experienced to broader ideas — and active experimentation — trying out new approaches based on what they learned.';
  } else {
    kolbText = 'Your plan moves learners through concrete experience into reflection. Strengthening the connections between reflection, conceptualization, and future action will complete the Kolb cycle and deepen learning transfer.';
  }

  // Generate Dewey connection
  let deweyText = '';
  if (d.agency === 'open' || d.agency === 'scaffolded') {
    deweyText = 'Dewey argued that genuine learning requires both continuity (building on prior experience) and interaction (active engagement with the environment and other people). Your choice to give learners agency in the experience honors the interaction principle — they are not passive receivers but active meaning-makers.';
  } else {
    deweyText = 'Dewey\'s principles of continuity and interaction remind us that learning is most powerful when it connects to learners\' prior experience and involves genuine interaction with the world. Consider whether your guided structure still allows for authentic encounters with the unexpected — that is often where the deepest learning happens.';
  }

  return `
    <div class="phase-screen active">
      <div class="kolb-badge">Your Planning Profile</div>
      <div class="phase-title">Experience Plan Summary</div>
      <div class="phase-narrative">Here is the experiential learning activity you designed, along with a profile of your planning trade-offs. Review the scores, reflect on your decisions, and consider what you might change.</div>

      <div class="summary-section">
        <h3>Your Decisions</h3>
        <div class="summary-row"><span class="label">Setting</span><span class="value">${l('setting')}</span></div>
        <div class="summary-row"><span class="label">Age Group</span><span class="value">${l('ageGroup')}</span></div>
        <div class="summary-row"><span class="label">Group Size</span><span class="value">${d.groupSize || 20} learners</span></div>
        <div class="summary-row"><span class="label">Experience Type</span><span class="value">${l('expType')}</span></div>
        <div class="summary-row"><span class="label">Duration</span><span class="value">${l('duration')}</span></div>
        <div class="summary-row"><span class="label">Budget</span><span class="value">${l('budget')}</span></div>
        <div class="summary-row"><span class="label">Transportation</span><span class="value">${l('transport')}</span></div>
        <div class="summary-row"><span class="label">Adult:Learner Ratio</span><span class="value">${ratioLabels[(d.ratio || 3) - 1]}</span></div>
        <div class="summary-row"><span class="label">Partners</span><span class="value">${(d.partners || []).map(p => partnerLabels[p]).join(', ')}</span></div>
        <div class="summary-row"><span class="label">Family Communication</span><span class="value">${l('familyComm')}</span></div>
        <div class="summary-row"><span class="label">Admin Buy-In</span><span class="value">${l('adminBuyin')}</span></div>
        <div class="summary-row"><span class="label">Risk Level</span><span class="value">${l('riskLevel')}</span></div>
        <div class="summary-row"><span class="label">Equity Strategies</span><span class="value">${(d.equity || []).map(e => equityLabels[e]).join(', ')}</span></div>
        <div class="summary-row"><span class="label">Contingency</span><span class="value">${l('contingency')}</span></div>
        <div class="summary-row"><span class="label">Student Agency</span><span class="value">${l('agency')}</span></div>
        <div class="summary-row"><span class="label">Your Role</span><span class="value">${l('facilitatorRole')}</span></div>
        <div class="summary-row"><span class="label">Reflection Timing</span><span class="value">${l('reflectTiming')}</span></div>
        <div class="summary-row"><span class="label">Reflection Modes</span><span class="value">${(d.reflectMode || []).map(r => reflectModeLabels[r]).join(', ')}</span></div>
        <div class="summary-row"><span class="label">Reflection Depth</span><span class="value">${l('reflectDepth')}</span></div>
      </div>

      <div class="summary-section">
        <h3>Planning Profile Scores</h3>
        <p style="font-size:0.88rem; color:var(--text-secondary); margin-bottom:16px;">These scores reflect the cumulative trade-offs of your decisions. No plan scores perfectly in every dimension — the goal is intentional balance.</p>
        <div class="gauge-grid">
          ${renderGauge('Feasibility', s.feasibility, gaugeColor(s.feasibility))}
          ${renderGauge('Depth', s.depth, gaugeColor(s.depth))}
          ${renderGauge('Equity', s.equity, gaugeColor(s.equity))}
          ${renderGauge('Safety', s.safety, gaugeColor(s.safety))}
          ${renderGauge('Reflection', s.reflection, gaugeColor(s.reflection))}
        </div>
      </div>

      <div class="summary-section">
        <h3>Trade-Offs You Navigated</h3>
        ${state.tradeoffs.map(t => `
          <div style="margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,0.04);">
            <div style="font-weight:600; color:var(--accent-gold); font-size:0.85rem; margin-bottom:4px;">${t.phase}</div>
            <div style="font-size:0.88rem; color:var(--text-secondary); line-height:1.6;">${t.text}</div>
          </div>
        `).join('')}
      </div>

      <div class="reflection-box">
        <h4>Connecting to Theory: Kolb's Experiential Learning Cycle</h4>
        <p>${kolbText}</p>
      </div>

      <div class="reflection-box">
        <h4>Connecting to Theory: Dewey's Continuity & Interaction</h4>
        <p>${deweyText}</p>
      </div>

      <div class="summary-section">
        <h3>Your Reflection</h3>
        <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:6px;">Take a moment to reflect on your planning process. What did you learn about designing experiential learning? What trade-offs surprised you? What would you do differently?</p>
        <textarea class="reflect-textarea" placeholder="Write your reflection here..."></textarea>
        <p style="font-size:0.9rem; color:var(--text-secondary); margin-top:16px;">Consider these prompts:</p>
        <p style="font-size:0.88rem; color:var(--text-dim); line-height:1.7;">
          • Which decision was hardest to make, and why?<br>
          • Where did you feel tension between what you wanted to do and what was feasible?<br>
          • How did the disruption event change your thinking about contingency planning?<br>
          • If you could redesign one aspect of your plan, what would it be?<br>
          • How does this planning process connect to your own experiences as a learner?
        </p>
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="location.reload()">↺ Start Over</button>
        <button class="btn btn-primary" onclick="window.print()">Print Summary</button>
      </div>
    </div>
  `;
}

function renderGauge(label, value, color) {
  const offset = 245 - (245 * value / 100);
  return `
    <div class="gauge-card">
      <div class="gauge-ring">
        <svg viewBox="0 0 90 90">
          <circle class="bg" cx="45" cy="45" r="39"/>
          <circle class="fill" cx="45" cy="45" r="39" stroke="${color}" style="stroke-dashoffset:${offset}" id="gauge-${label}"/>
        </svg>
        <div class="gauge-number" style="color:${color}">${value}</div>
      </div>
      <div class="gauge-label">${label}</div>
    </div>
  `;
}

// ========== INIT ==========
renderCurrentPhase();

// Animate gauges when summary appears
const observer = new MutationObserver(() => {
  document.querySelectorAll('.gauge-ring .fill').forEach(el => {
    const target = el.style.strokeDashoffset;
    el.style.strokeDashoffset = '245';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        el.style.strokeDashoffset = target;
      });
    });
  });
});
observer.observe(document.getElementById('screensContainer'), { childList: true, subtree: true });
</script>
</body>
</html>

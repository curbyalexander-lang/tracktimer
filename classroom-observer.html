<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Classroom Observer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header { text-align: center; padding: 20px 0 8px; flex-shrink: 0; }
  .header h1 { font-size: 18px; font-weight: 700; color: #1a1a2e; letter-spacing: -0.3px; }
  .clock { font-size: 52px; font-weight: 500; font-family: 'DM Mono', monospace; color: #1a1a2e; letter-spacing: -2px; margin-top: 8px; line-height: 1; }
  .hint { font-size: 13px; color: #94a3b8; margin-top: 8px; }
  .active-badge {
    display: inline-block; padding: 4px 14px; border-radius: 20px;
    font-size: 13px; font-weight: 600; margin-top: 6px;
  }

  /* Mini progress bar */
  .mini-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin: 12px 20px; gap: 2px; flex-shrink: 0; }
  .mini-bar-seg { border-radius: 3px; transition: flex 0.3s ease; }

  /* Button grid */
  .button-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 16px 20px; flex: 1; align-content: start;
    overflow-y: auto;
  }
  .cat-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 18px 8px; border-radius: 16px; border: 2px solid transparent;
    cursor: pointer; transition: all 0.2s ease; outline: none; min-height: 100px;
    -webkit-tap-highlight-color: transparent; font-family: 'DM Sans', sans-serif;
  }
  .cat-btn:disabled { opacity: 0.45; cursor: default; }
  .cat-btn .icon { font-size: 28px; line-height: 1; }
  .cat-btn .label { font-size: 14px; font-weight: 600; line-height: 1.2; }
  .cat-btn .time { font-size: 12px; font-family: 'DM Mono', monospace; opacity: 0.8; margin-top: 2px; }

  /* Controls */
  .controls { padding: 8px 20px 24px; flex-shrink: 0; display: flex; gap: 12px; }
  .btn-start {
    width: 100%; padding: 16px; border-radius: 14px; border: none;
    background: #1a1a2e; color: #fff; font-size: 16px; font-weight: 700;
    font-family: 'DM Sans', sans-serif; cursor: pointer; letter-spacing: 0.3px;
  }
  .btn-stop {
    width: 100%; padding: 16px; border-radius: 14px;
    border: 2px solid #E8453C; background: #FEF0EF; color: #E8453C;
    font-size: 16px; font-weight: 700; font-family: 'DM Sans', sans-serif; cursor: pointer;
  }
  .btn-reset {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    background: #1a1a2e; color: #fff; font-size: 15px; font-weight: 700;
    font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 12px;
  }

  /* Summary */
  .summary-wrap { flex: 1; overflow-y: auto; padding: 20px; }
  .summary-card { background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
  .summary-card h1 { font-size: 22px; font-weight: 700; color: #1a1a2e; }
  .summary-card .sub { font-size: 14px; color: #64748b; font-family: 'DM Mono', monospace; margin-top: 6px; }
  .bar-row { margin-bottom: 16px; }
  .bar-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .bar-label .name { font-size: 15px; font-weight: 600; color: #1a1a2e; }
  .bar-label .val { font-size: 14px; color: #64748b; font-family: 'DM Mono', monospace; }
  .bar-track { height: 10px; background: #f1f5f9; border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; transition: width 0.5s ease; }
  .log-title { font-size: 14px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .log-list { max-height: 200px; overflow-y: auto; }
  .log-entry { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; align-items: center; }
  .log-entry .ts { font-size: 13px; color: #94a3b8; font-family: 'DM Mono', monospace; min-width: 52px; }
  .log-entry .act { font-size: 13px; font-weight: 600; }

  /* Share buttons */
  .share-row { display: flex; gap: 10px; margin-top: 24px; }
  .share-btn {
    flex: 1; padding: 12px 8px; border-radius: 12px; border: 2px solid #e2e8f0;
    background: #fff; color: #1a1a2e; font-size: 14px; font-weight: 600;
    font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s ease;
  }
  .share-btn:active { background: #f1f5f9; }

  /* Safe area padding for notched phones */
  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    .controls { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    .summary-wrap { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const CATEGORIES = [
  { id: "teacher", label: "Teacher Talk", icon: "🎓", color: "#E8453C", bg: "#FEF0EF" },
  { id: "student", label: "Student Talk", icon: "💬", color: "#2D8CFF", bg: "#EBF4FF" },
  { id: "independent", label: "Independent Work", icon: "✏️", color: "#16A34A", bg: "#ECFDF5" },
  { id: "group", label: "Group Work", icon: "👥", color: "#9333EA", bg: "#F5F3FF" },
  { id: "transition", label: "Transition", icon: "🔄", color: "#D97706", bg: "#FFFBEB" },
];

let state = {
  running: false,
  elapsed: 0,
  activeCategory: null,
  times: { teacher: 0, student: 0, independent: 0, group: 0, transition: 0 },
  log: [],
  showSummary: false,
  copied: false,
  lastTick: null,
  interval: null,
};

function fmt(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  return `${m}:${String(sec).padStart(2,"0")}`;
}

function pct(s, t) { return t === 0 ? "0%" : `${Math.round((s/t)*100)}%`; }

function totalTracked() { return Object.values(state.times).reduce((a,b) => a+b, 0); }

function tick() {
  const now = Date.now();
  const delta = Math.floor((now - state.lastTick) / 1000);
  if (delta >= 1) {
    state.lastTick = now;
    state.elapsed += delta;
    if (state.activeCategory) state.times[state.activeCategory] += delta;
    render();
  }
}

function start() {
  state.running = true;
  state.lastTick = Date.now();
  state.interval = setInterval(tick, 250);
  render();
}

function stop() {
  state.running = false;
  state.activeCategory = null;
  clearInterval(state.interval);
  state.showSummary = true;
  render();
}

function reset() {
  clearInterval(state.interval);
  state = { running: false, elapsed: 0, activeCategory: null, times: { teacher:0, student:0, independent:0, group:0, transition:0 }, log: [], showSummary: false, copied: false, lastTick: null, interval: null };
  render();
}

function selectCategory(id) {
  if (!state.running || state.activeCategory === id) return;
  state.log.push({ category: id, at: fmt(state.elapsed) });
  state.activeCategory = id;
  render();
}

function buildTextSummary() {
  const sorted = [...CATEGORIES].sort((a,b) => state.times[b.id] - state.times[a.id]);
  const t = totalTracked();
  const date = new Date().toLocaleDateString("en-US", { weekday:"long", year:"numeric", month:"long", day:"numeric" });
  let text = `CLASSROOM OBSERVATION SUMMARY\n${date}\nTotal Session: ${fmt(state.elapsed)} | Tracked: ${fmt(t)}\n${"─".repeat(38)}\n`;
  sorted.forEach(c => {
    const bar = "█".repeat(Math.round((state.times[c.id] / Math.max(t,1)) * 20));
    text += `${c.label.padEnd(18)} ${fmt(state.times[c.id]).padStart(7)}  ${pct(state.times[c.id],t).padStart(4)}  ${bar}\n`;
  });
  if (state.log.length > 0) {
    text += `\n${"─".repeat(38)}\nACTIVITY LOG\n`;
    state.log.forEach(e => {
      const c = CATEGORIES.find(x => x.id === e.category);
      text += `  ${e.at}  → ${c.label}\n`;
    });
  }
  return text;
}

function buildCSV() {
  const t = totalTracked();
  let csv = "Category,Seconds,Time,Percent\n";
  CATEGORIES.forEach(c => { csv += `"${c.label}",${state.times[c.id]},"${fmt(state.times[c.id])}","${pct(state.times[c.id],t)}"\n`; });
  csv += `\nTimestamp,Activity\n`;
  state.log.forEach(e => { const c = CATEGORIES.find(x => x.id === e.category); csv += `"${e.at}","${c.label}"\n`; });
  return csv;
}

async function copyText() {
  try { await navigator.clipboard.writeText(buildTextSummary()); }
  catch { const ta = document.createElement("textarea"); ta.value = buildTextSummary(); document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }
  state.copied = true; render();
  setTimeout(() => { state.copied = false; render(); }, 2000);
}

function downloadCSV() {
  const blob = new Blob([buildCSV()], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = `observation-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
}

async function nativeShare() {
  if (navigator.share) { try { await navigator.share({ title: "Classroom Observation", text: buildTextSummary() }); } catch {} }
  else copyText();
}

function render() {
  const app = document.getElementById("app");
  const t = totalTracked();

  if (state.showSummary) {
    const sorted = [...CATEGORIES].sort((a,b) => state.times[b.id] - state.times[a.id]);
    let logHTML = "";
    if (state.log.length > 0) {
      logHTML = `<div style="margin-top:28px"><div class="log-title">Activity Log</div><div class="log-list">`;
      state.log.forEach(e => {
        const c = CATEGORIES.find(x => x.id === e.category);
        logHTML += `<div class="log-entry"><span class="ts">${e.at}</span><span class="act" style="color:${c.color}">${c.icon} ${c.label}</span></div>`;
      });
      logHTML += `</div></div>`;
    }

    let barsHTML = "";
    sorted.forEach(c => {
      const p = t > 0 ? (state.times[c.id]/t)*100 : 0;
      barsHTML += `<div class="bar-row"><div class="bar-label"><span class="name">${c.icon} ${c.label}</span><span class="val">${fmt(state.times[c.id])} (${pct(state.times[c.id],t)})</span></div><div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${c.color}"></div></div></div>`;
    });

    app.innerHTML = `
      <div class="summary-wrap">
        <div class="summary-card">
          <h1>Session Summary</h1>
          <p class="sub">Total: ${fmt(state.elapsed)} · Tracked: ${fmt(t)}</p>
          <div style="margin-top:24px">${barsHTML}</div>
          ${logHTML}
          <div class="share-row">
            <button class="share-btn" onclick="nativeShare()">📤 Share</button>
            <button class="share-btn" onclick="copyText()">${state.copied ? "✅ Copied!" : "📋 Copy"}</button>
            <button class="share-btn" onclick="downloadCSV()">📊 CSV</button>
          </div>
          <button class="btn-reset" onclick="reset()">New Session</button>
        </div>
      </div>`;
    return;
  }

  // Active badge
  let badgeHTML = "";
  if (state.activeCategory) {
    const ac = CATEGORIES.find(c => c.id === state.activeCategory);
    badgeHTML = `<div><span class="active-badge" style="color:${ac.color};background:${ac.bg}">${ac.icon} ${ac.label}</span></div>`;
  }

  // Hint
  let hintHTML = (!state.running && state.elapsed === 0) ? `<p class="hint">Tap Start, then select an activity</p>` : "";

  // Mini bar
  let miniHTML = "";
  if (state.running && t > 0) {
    miniHTML = `<div class="mini-bar">`;
    CATEGORIES.filter(c => state.times[c.id] > 0).forEach(c => {
      miniHTML += `<div class="mini-bar-seg" style="flex:${state.times[c.id]};background:${c.color};opacity:${state.activeCategory===c.id?1:0.5}"></div>`;
    });
    miniHTML += `</div>`;
  }

  // Buttons
  let btnsHTML = "";
  CATEGORIES.forEach(c => {
    const isActive = state.activeCategory === c.id;
    const bg = isActive ? c.color : c.bg;
    const col = isActive ? "#fff" : c.color;
    const bdr = isActive ? c.color : "transparent";
    const op = state.running ? 1 : 0.45;
    const scale = isActive ? "scale(1.03)" : "scale(1)";
    const shadow = isActive ? `0 4px 20px ${c.color}44` : "0 2px 8px rgba(0,0,0,0.04)";
    const timeHTML = state.times[c.id] > 0 ? `<span class="time">${fmt(state.times[c.id])}</span>` : "";
    btnsHTML += `<button class="cat-btn" ${state.running?"":' disabled'} onclick="selectCategory('${c.id}')" style="background:${bg};color:${col};border-color:${bdr};opacity:${op};transform:${scale};box-shadow:${shadow}"><span class="icon">${c.icon}</span><span class="label">${c.label}</span>${timeHTML}</button>`;
  });

  // Controls
  let ctrlHTML = "";
  if (!state.running && state.elapsed === 0) {
    ctrlHTML = `<button class="btn-start" onclick="start()">▶ Start Session</button>`;
  } else if (state.running) {
    ctrlHTML = `<button class="btn-stop" onclick="stop()">■ End Session</button>`;
  } else {
    ctrlHTML = `<button class="btn-start" style="flex:1" onclick="state.showSummary=true;render()">View Summary</button><button class="btn-stop" style="flex:1" onclick="reset()">Reset</button>`;
  }

  app.innerHTML = `
    <div class="header">
      <h1>Classroom Observer</h1>
      <div class="clock">${fmt(state.elapsed)}</div>
      ${badgeHTML}${hintHTML}
    </div>
    ${miniHTML}
    <div class="button-grid">${btnsHTML}</div>
    <div class="controls">${ctrlHTML}</div>`;
}

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryMotion — Digital Story Creator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(145deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
    color: #e0e0e0;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.2); flex-shrink: 0;
  }
  .logo {
    font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700;
    background: linear-gradient(135deg, #E8A87C, #D4845A);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .topbar-info { font-size: 11px; color: #6a6a7a; border-left: 1px solid #333; padding-left: 12px; margin-left: 12px; }
  .topbar-actions { display: flex; gap: 10px; align-items: center; }

  .btn-small {
    background: transparent; border: 1px solid rgba(232,168,124,0.4);
    color: #E8A87C; padding: 6px 14px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif;
    transition: all 0.2s; white-space: nowrap;
  }
  .btn-small:hover { background: rgba(232,168,124,0.1); }
  .btn-small:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, #E8A87C, #D4845A);
    border: none; color: #1a1a2e; padding: 10px 24px; border-radius: 8px;
    cursor: pointer; font-size: 14px; font-weight: 600;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-danger {
    background: transparent; border: 1px solid rgba(192,57,43,0.5);
    color: #e74c3c; padding: 6px 14px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif;
  }
  .btn-danger:hover { background: rgba(192,57,43,0.15); }

  .main { flex: 1; display: flex; overflow: hidden; }
  .preview-area { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 16px; min-width: 0; }

  .preview-canvas {
    flex: 1; border-radius: 12px; overflow: hidden;
    background: #000; display: flex; align-items: center; justify-content: center;
    position: relative; min-height: 0;
  }
  .preview-canvas img {
    position: absolute; width: 100%; height: 100%; object-fit: contain;
    pointer-events: none;
  }
  .preview-empty { text-align: center; color: #555; padding: 40px; }
  .preview-empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }

  .crop-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    cursor: crosshair; z-index: 10;
  }
  .crop-box {
    position: absolute; border: 2px solid #E8A87C;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
    z-index: 11; cursor: move;
  }
  .crop-box::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background:
      linear-gradient(to right, rgba(232,168,124,0.3) 1px, transparent 1px) 0 0 / 33.33% 100%,
      linear-gradient(to bottom, rgba(232,168,124,0.3) 1px, transparent 1px) 0 0 / 100% 33.33%;
  }
  .crop-handle {
    position: absolute; width: 12px; height: 12px;
    background: #E8A87C; border-radius: 2px; z-index: 12;
  }
  .crop-handle.tl { top: -6px; left: -6px; cursor: nw-resize; }
  .crop-handle.tr { top: -6px; right: -6px; cursor: ne-resize; }
  .crop-handle.bl { bottom: -6px; left: -6px; cursor: sw-resize; }
  .crop-handle.br { bottom: -6px; right: -6px; cursor: se-resize; }

  .crop-toolbar {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 20;
    background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 10px;
    backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
  }

  .zoom-toolbar {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; z-index: 5;
    background: rgba(0,0,0,0.6); padding: 6px 16px; border-radius: 20px;
    backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
  }
  .zoom-toolbar button {
    background: none; border: none; color: #ccc; font-size: 16px;
    cursor: pointer; width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .zoom-toolbar button:hover { background: rgba(255,255,255,0.1); }
  .zoom-toolbar input[type=range] { width: 100px; accent-color: #E8A87C; }
  .zoom-toolbar span { color: #999; font-size: 11px; min-width: 36px; text-align: center; }

  .mode-tabs {
    display: flex; gap: 2px; background: rgba(0,0,0,0.3); border-radius: 8px;
    padding: 3px; align-self: flex-start;
  }
  .mode-tab {
    padding: 5px 14px; border-radius: 6px; border: none;
    background: transparent; color: #888; font-size: 11px;
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .mode-tab.active { background: rgba(232,168,124,0.15); color: #E8A87C; }

  .slide-strip {
    display: flex; gap: 8px; overflow-x: auto; padding: 8px 4px;
    background: rgba(0,0,0,0.2); border-radius: 10px;
    min-height: 96px; align-items: center; flex-shrink: 0;
  }
  .slide-thumb {
    position: relative; width: 120px; min-width: 120px; height: 80px;
    border-radius: 8px; overflow: hidden; cursor: pointer;
    border: 2px solid transparent; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3); transition: all 0.2s;
  }
  .slide-thumb.selected { border-color: #E8A87C; box-shadow: 0 0 16px rgba(232,168,124,0.3); }
  .slide-thumb.dragover { border: 2px dashed #E8A87C; }
  .slide-thumb img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .slide-thumb-label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    padding: 12px 6px 4px; font-size: 10px; color: #ccc; text-align: center;
  }
  .slide-thumb-remove {
    position: absolute; top: 3px; right: 3px;
    background: rgba(0,0,0,0.6); border: none; color: #aaa;
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    font-size: 11px; display: flex; align-items: center; justify-content: center;
  }
  .slide-thumb-remove:hover { color: #fff; background: rgba(200,50,50,0.7); }
  .slide-add-btn {
    width: 80px; min-width: 80px; height: 80px; border-radius: 8px;
    border: 2px dashed rgba(255,255,255,0.12); background: transparent;
    color: #555; font-size: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .slide-add-btn:hover { border-color: rgba(232,168,124,0.3); color: #E8A87C; }

  .sidebar {
    width: 320px; min-width: 320px;
    border-left: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.15);
    overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px; flex-shrink: 0;
  }
  .panel {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 16px;
  }
  .label { font-size: 11px; color: #8a8a9a; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .kb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .kb-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.1);
    color: #999; padding: 5px 8px; border-radius: 6px; cursor: pointer;
    font-size: 10px; text-align: center; font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .kb-btn:hover { border-color: rgba(232,168,124,0.3); color: #ccc; }
  .kb-btn.active { background: rgba(232,168,124,0.15); border-color: rgba(232,168,124,0.5); color: #E8A87C; }
  .tune-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .tune-label { font-size: 10px; color: #777; width: 56px; flex-shrink: 0; }
  .tune-val { font-size: 10px; color: #999; width: 28px; text-align: right; }
  input[type=range] { accent-color: #E8A87C; flex: 1; }
  .audio-row { display: flex; flex-direction: column; gap: 8px; }
  .audio-file-info { font-size: 11px; color: #888; display: flex; align-items: center; gap: 6px; }
  .audio-file-info span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .audio-remove { background: none; border: none; color: #666; cursor: pointer; font-size: 14px; }
  .audio-remove:hover { color: #c0392b; }
  .volume-row { display: flex; align-items: center; gap: 8px; }
  .volume-label { font-size: 10px; color: #666; }
  .volume-val { font-size: 10px; color: #999; width: 28px; }
  .rec-row { display: flex; gap: 8px; }
  .btn-record {
    background: transparent; border: 1px solid rgba(232,168,124,0.4);
    color: #E8A87C; padding: 6px 14px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif;
  }
  .btn-recording { background: #c0392b; border-color: #c0392b; color: #fff; }
  .dur-row { display: flex; align-items: center; gap: 10px; }
  .dur-val { font-size: 14px; color: #E8A87C; min-width: 32px; text-align: right; }
  .tips {
    padding: 12px; border-radius: 8px;
    background: rgba(232,168,124,0.05); border: 1px solid rgba(232,168,124,0.1);
    font-size: 11px; color: #8a7a6a; line-height: 1.5;
  }
  .tips strong { color: #E8A87C; }

  .playback-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 9999;
  }
  .playback-stop {
    position: absolute; top: 16px; left: 16px;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 6px 16px; border-radius: 20px; cursor: pointer;
    font-size: 13px; font-family: 'DM Sans', sans-serif; backdrop-filter: blur(8px); z-index: 10;
  }
  .playback-counter {
    position: absolute; top: 16px; right: 16px;
    background: rgba(0,0,0,0.5); color: #fff;
    padding: 4px 12px; border-radius: 20px; font-size: 13px; z-index: 10;
  }
  .playback-progress {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: rgba(255,255,255,0.15); z-index: 10;
  }
  .playback-progress-bar { height: 100%; background: #E8A87C; transition: width 0.1s linear; }

  .modal-backdrop {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.7); z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
  }
  .modal {
    background: #1e1e30; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 32px; max-width: 480px; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal h2 {
    font-family: 'Playfair Display', serif; font-size: 20px; color: #E8A87C; margin-bottom: 8px;
  }
  .modal p { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .export-progress {
    background: rgba(255,255,255,0.05); border-radius: 8px; padding: 16px; margin-top: 12px;
  }
  .export-bar-bg {
    height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 8px;
  }
  .export-bar { height: 100%; background: linear-gradient(90deg, #E8A87C, #D4845A); border-radius: 3px; transition: width 0.3s; }
  .export-status { font-size: 12px; color: #aaa; }
  select {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    color: #e0e0e0; padding: 8px 12px; border-radius: 8px; font-size: 13px;
    font-family: 'DM Sans', sans-serif; width: 100%; cursor: pointer;
  }
  select option { background: #1e1e30; }
  .form-row { margin-bottom: 14px; }
  .form-label { font-size: 11px; color: #8a8a9a; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }

  .search-panel {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 16px;
  }
  .search-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .search-input {
    flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: #e0e0e0; padding: 8px 12px; border-radius: 8px; font-size: 13px;
    font-family: 'DM Sans', sans-serif; outline: none;
  }
  .search-input:focus { border-color: rgba(232,168,124,0.4); }
  .search-input::placeholder { color: #555; }
  .search-engines { display: flex; gap: 4px; flex-wrap: wrap; }
  .search-eng-btn {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    color: #999; padding: 4px 10px; border-radius: 5px; cursor: pointer;
    font-size: 10px; font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .search-eng-btn:hover { border-color: rgba(232,168,124,0.3); color: #E8A87C; }
  .search-hint { font-size: 10px; color: #666; margin-top: 8px; line-height: 1.5; }

  .drop-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(232,168,124,0.08); border: 3px dashed #E8A87C;
    border-radius: 12px; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .drop-overlay-text {
    background: rgba(0,0,0,0.7); color: #E8A87C; padding: 16px 32px;
    border-radius: 12px; font-size: 16px; font-weight: 600;
    backdrop-filter: blur(8px);
  }

  @media (max-width: 900px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; min-width: unset; border-left: none; border-top: 1px solid rgba(255,255,255,0.06); max-height: 50vh; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ═══════════════ STATE ═══════════════
const KEN_BURNS_PRESETS = [
  { name: "Zoom In", startScale: 1, endScale: 1.4, startX: 50, startY: 50, endX: 50, endY: 50 },
  { name: "Zoom Out", startScale: 1.4, endScale: 1, startX: 50, startY: 50, endX: 50, endY: 50 },
  { name: "Pan Right", startScale: 1.3, endScale: 1.3, startX: 30, startY: 50, endX: 70, endY: 50 },
  { name: "Pan Left", startScale: 1.3, endScale: 1.3, startX: 70, startY: 50, endX: 30, endY: 50 },
  { name: "Pan Down", startScale: 1.3, endScale: 1.3, startX: 50, startY: 30, endX: 50, endY: 70 },
  { name: "Pan Up", startScale: 1.3, endScale: 1.3, startX: 50, startY: 70, endX: 50, endY: 30 },
  { name: "Zoom In + Pan Right", startScale: 1, endScale: 1.5, startX: 30, startY: 40, endX: 70, endY: 60 },
  { name: "Zoom Out + Pan Left", startScale: 1.5, endScale: 1, startX: 70, startY: 60, endX: 30, endY: 40 },
  { name: "Dramatic Zoom", startScale: 1, endScale: 1.8, startX: 50, startY: 40, endX: 50, endY: 40 },
  { name: "Slow Drift", startScale: 1.15, endScale: 1.25, startX: 45, startY: 45, endX: 55, endY: 55 },
];

let state = {
  slides: [], selectedIndex: -1, playing: false,
  editorMode: 'preview',
  musicUrl: null, musicName: "",
  narrationUrl: null, narrationName: "",
  musicVolume: 0.4, narrationVolume: 1.0,
  showExportModal: false, exporting: false,
  exportProgress: 0, exportStatus: '',
  exportResolution: '1280x720',
};

let editorZoom = 1, editorPanX = 0, editorPanY = 0;
let isPanning = false, panStartX = 0, panStartY = 0, panOriginX = 0, panOriginY = 0;
let cropBox = null, cropDragging = null, cropStartMouse = {x:0,y:0}, cropStartBox = null;
let previewAnimId = null, playbackState = null;
let mediaRecorder = null, recordingChunks = [], recordingTimer = null, recordingSeconds = 0;
const imageCache = {};

function loadImage(src) {
  if (imageCache[src]) return Promise.resolve(imageCache[src]);
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => { imageCache[src] = img; res(img); };
    img.onerror = rej; img.src = src;
  });
}
function createSlide(url, name) {
  return { id: Date.now()+Math.random(), imageUrl: url, fileName: name,
    duration: 5, kenBurns: {...KEN_BURNS_PRESETS[0]},
    cropX:0, cropY:0, cropW:1, cropH:1, croppedUrl: null };
}
function getDisplayUrl(s) { return s.croppedUrl || s.imageUrl; }
function totalDuration() { return state.slides.reduce((a,s)=>a+s.duration,0); }
function getSlideAtTime(time) {
  let acc=0;
  for (let i=0;i<state.slides.length;i++) {
    if (time < acc+state.slides[i].duration) return {index:i, slideProgress:(time-acc)/state.slides[i].duration};
    acc+=state.slides[i].duration;
  }
  return {index:state.slides.length-1, slideProgress:1};
}
function qs(sel){return document.querySelector(sel)}

// ═══════════════ RENDER ═══════════════
function render() {
  if (state.playing) { renderPlayback(); return; }
  renderEditor();
  if (state.showExportModal) renderExportModal();
}

function renderEditor() {
  const sel = state.selectedIndex>=0 && state.selectedIndex<state.slides.length ? state.slides[state.selectedIndex] : null;
  const total = totalDuration();
  const isCrop = state.editorMode==='crop' && sel;
  const dUrl = sel ? getDisplayUrl(sel) : '';

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div style="display:flex;align-items:center">
        <span class="logo">StoryMotion</span>
        <span class="topbar-info">${state.slides.length} slide${state.slides.length!==1?'s':''} · ${total}s total</span>
      </div>
      <div class="topbar-actions">
        <button class="btn-small" onclick="document.getElementById('photoInput').click()">+ Add Photos</button>
        ${state.slides.length>=1?`
          <button class="btn-small" onclick="openExportModal()">⬇ Export Video</button>
          <button class="btn-primary" onclick="startPlayback()">▶ Play Story</button>
        `:''}
      </div>
    </div>
    <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="handlePhotoUpload(event)">
    <input type="file" id="musicInput" accept="audio/*" style="display:none" onchange="handleAudioUpload(event,'music')">
    <input type="file" id="narrationInput" accept="audio/*" style="display:none" onchange="handleAudioUpload(event,'narration')">

    <div class="main">
      <div class="preview-area">
        ${sel?`<div class="mode-tabs">
          <button class="mode-tab ${state.editorMode==='preview'?'active':''}" onclick="setEditorMode('preview')">Preview</button>
          <button class="mode-tab ${state.editorMode==='crop'?'active':''}" onclick="setEditorMode('crop')">Crop</button>
        </div>`:''}

        <div class="preview-canvas" id="previewCanvas" ${!isCrop&&sel?'onwheel="handleEditorWheel(event)"':''}>
          <div class="drop-overlay" id="dropOverlay" style="display:none">
            <div class="drop-overlay-text">Drop image here to add as slide</div>
          </div>
          ${sel?`<img id="previewImg" src="${dUrl}" alt=""
            style="transform:scale(${isCrop?1:editorZoom}) translate(${isCrop?0:editorPanX}px,${isCrop?0:editorPanY}px);
                   transform-origin:center center;">`:`
            <div class="preview-empty">
              <div class="preview-empty-icon">🎬</div>
              <div style="font-size:16px">${state.slides.length===0?'Add photos to begin your story':'Select a slide to preview'}</div>
              ${state.slides.length===0?'<button class="btn-primary" style="margin-top:20px" onclick="document.getElementById(\'photoInput\').click()">+ Upload Photos</button>':''}
            </div>`}
          ${isCrop?'<div class="crop-overlay" id="cropOverlay"></div>':''}
          ${isCrop&&cropBox?renderCropBox():''}
          ${!isCrop&&sel?`<div class="zoom-toolbar">
            <button onclick="editorZoomTo(editorZoom-0.25)">−</button>
            <input type="range" min="0.5" max="4" step="0.1" value="${editorZoom}" oninput="editorZoomTo(parseFloat(this.value))">
            <span>${Math.round(editorZoom*100)}%</span>
            <button onclick="editorZoomTo(editorZoom+0.25)">+</button>
            <button onclick="editorZoomTo(1);editorPanX=0;editorPanY=0;render();" style="font-size:11px;width:auto;padding:0 8px">Reset</button>
          </div>`:''}
          ${isCrop?`<div class="crop-toolbar">
            <button class="btn-small" onclick="initFullCrop()">Select All</button>
            <button class="btn-primary" onclick="applyCrop()" style="padding:6px 18px;font-size:12px" ${!cropBox?'disabled':''}>Apply Crop</button>
            <button class="btn-small" onclick="resetCrop()">Reset</button>
            <button class="btn-danger" onclick="setEditorMode('preview')">Cancel</button>
          </div>`:''}
        </div>

        <div class="slide-strip">
          ${state.slides.map((s,i)=>`

// ═══════════════ EDITOR ZOOM/PAN ═══════════════
function editorZoomTo(v) {
  editorZoom = Math.max(0.5,Math.min(4,v));
  if (editorZoom<=1){editorPanX=0;editorPanY=0;}
  render();
}
function handleEditorWheel(e) { e.preventDefault(); editorZoomTo(editorZoom + (e.deltaY>0?-0.15:0.15)); }
function setupPanListeners() {
  const c = document.getElementById('previewCanvas'); if(!c) return;
  c.addEventListener('mousedown', e=>{
    if (e.target.closest('.zoom-toolbar')) return;
    if (editorZoom<=1) return;
    isPanning=true; panStartX=e.clientX; panStartY=e.clientY; panOriginX=editorPanX; panOriginY=editorPanY;
    c.style.cursor='grabbing';
  });
  c.addEventListener('mousemove', e=>{
    if (!isPanning) return;
    editorPanX = panOriginX + (e.clientX-panStartX)/editorZoom;
    editorPanY = panOriginY + (e.clientY-panStartY)/editorZoom;
    const img = document.getElementById('previewImg');
    if(img) img.style.transform = `scale(${editorZoom}) translate(${editorPanX}px,${editorPanY}px)`;
  });
  const stop = ()=>{isPanning=false; if(c) c.style.cursor='';};
  c.addEventListener('mouseup',stop); c.addEventListener('mouseleave',stop);
}

// ═══════════════ CROP ═══════════════
function setEditorMode(m) { state.editorMode=m; if(m==='crop'){cropBox=null;editorZoom=1;editorPanX=0;editorPanY=0;} render(); }
function initFullCrop() { cropBox={x:5,y:5,w:90,h:90}; render(); }

function setupCropListeners() {
  const ov = document.getElementById('cropOverlay'); if(!ov) return;
  ov.addEventListener('mousedown', e=>{
    const h = e.target.closest('.crop-handle'), b = e.target.closest('.crop-box');
    const r = ov.getBoundingClientRect();
    const mx = ((e.clientX-r.left)/r.width)*100, my = ((e.clientY-r.top)/r.height)*100;
    if (h) { cropDragging=h.dataset.handle; cropStartMouse={x:mx,y:my}; cropStartBox={...cropBox}; }
    else if (b) { cropDragging='move'; cropStartMouse={x:mx,y:my}; cropStartBox={...cropBox}; }
    else { cropBox={x:mx,y:my,w:0,h:0}; cropDragging='br'; cropStartMouse={x:mx,y:my}; cropStartBox={...cropBox}; render(); setupCropListeners(); return; }
    e.preventDefault(); e.stopPropagation();
  });
  document.addEventListener('mousemove', cropMouseMove);
  document.addEventListener('mouseup', cropMouseUp);
}

function cropMouseMove(e) {
  if (!cropDragging||!cropBox) return;
  const ov = document.getElementById('cropOverlay'); if(!ov) return;
  const r = ov.getBoundingClientRect();
  const mx = Math.max(0,Math.min(100,((e.clientX-r.left)/r.width)*100));
  const my = Math.max(0,Math.min(100,((e.clientY-r.top)/r.height)*100));
  const dx=mx-cropStartMouse.x, dy=my-cropStartMouse.y, sb=cropStartBox;
  if (cropDragging==='move') { let nx=sb.x+dx,ny=sb.y+dy; nx=Math.max(0,Math.min(100-sb.w,nx)); ny=Math.max(0,Math.min(100-sb.h,ny)); cropBox={...sb,x:nx,y:ny}; }
  else if (cropDragging==='br') { cropBox={...sb,w:Math.max(5,sb.w+dx),h:Math.max(5,sb.h+dy)}; }
  else if (cropDragging==='tl') { cropBox={x:sb.x+dx,y:sb.y+dy,w:Math.max(5,sb.w-dx),h:Math.max(5,sb.h-dy)}; }
  else if (cropDragging==='tr') { cropBox={x:sb.x,y:sb.y+dy,w:Math.max(5,sb.w+dx),h:Math.max(5,sb.h-dy)}; }
  else if (cropDragging==='bl') { cropBox={x:sb.x+dx,y:sb.y,w:Math.max(5,sb.w-dx),h:Math.max(5,sb.h+dy)}; }
  cropBox.x=Math.max(0,cropBox.x); cropBox.y=Math.max(0,cropBox.y);
  if(cropBox.x+cropBox.w>100) cropBox.w=100-cropBox.x;
  if(cropBox.y+cropBox.h>100) cropBox.h=100-cropBox.y;
  const el=document.getElementById('cropBox');
  if(el){el.style.left=cropBox.x+'%';el.style.top=cropBox.y+'%';el.style.width=cropBox.w+'%';el.style.height=cropBox.h+'%';}
}
function cropMouseUp(){cropDragging=null;document.removeEventListener('mousemove',cropMouseMove);document.removeEventListener('mouseup',cropMouseUp);}

async function applyCrop() {
  if (!cropBox||state.selectedIndex<0) return;
  const slide = state.slides[state.selectedIndex];
  const img = await loadImage(slide.imageUrl);
  const cx=(cropBox.x/100)*img.naturalWidth, cy=(cropBox.y/100)*img.naturalHeight;
  const cw=(cropBox.w/100)*img.naturalWidth, ch=(cropBox.h/100)*img.naturalHeight;
  const canvas=document.createElement('canvas'); canvas.width=Math.round(cw); canvas.height=Math.round(ch);
  canvas.getContext('2d').drawImage(img,cx,cy,cw,ch,0,0,canvas.width,canvas.height);
  slide.croppedUrl = canvas.toDataURL('image/jpeg',0.92);
  slide.cropX=cropBox.x/100; slide.cropY=cropBox.y/100; slide.cropW=cropBox.w/100; slide.cropH=cropBox.h/100;
  cropBox=null; state.editorMode='preview'; render();
}
function resetCrop() {
  if(state.selectedIndex<0) return;
  const s=state.slides[state.selectedIndex]; s.croppedUrl=null; s.cropX=0;s.cropY=0;s.cropW=1;s.cropH=1;
  cropBox=null; render();
}

// ═══════════════ PREVIEW ANIMATION ═══════════════
function startPreviewAnimation() {
  cancelAnimationFrame(previewAnimId);
  const sel = state.selectedIndex>=0?state.slides[state.selectedIndex]:null;
  if (!sel||state.playing||state.editorMode==='crop') return;
  const dur=sel.duration*1000, start=performance.now();
  function animate(){
    const el=document.getElementById('previewImg');
    if(!el||state.editorMode==='crop') return;
    const t=((performance.now()-start)%dur)/dur;
    const kb=state.slides[state.selectedIndex]?.kenBurns; if(!kb) return;
    const scale=(kb.startScale+(kb.endScale-kb.startScale)*t)*editorZoom;
    const x=kb.startX+(kb.endX-kb.startX)*t, y=kb.startY+(kb.endY-kb.startY)*t;
    el.style.transform=`scale(${scale}) translate(${editorPanX}px,${editorPanY}px)`;
    el.style.transformOrigin=`${x}% ${y}%`;
    previewAnimId=requestAnimationFrame(animate);
  }
  previewAnimId=requestAnimationFrame(animate);
}

// ═══════════════ PLAYBACK ═══════════════
function startPlayback() {
  if(!state.slides.length) return;
  state.playing=true;
  const total=totalDuration();
  playbackState={startTime:performance.now(),musicAudio:null,narrationAudio:null,animId:null};
  if(state.musicUrl){playbackState.musicAudio=new Audio(state.musicUrl);playbackState.musicAudio.volume=state.musicVolume;playbackState.musicAudio.loop=true;playbackState.musicAudio.play().catch(()=>{});}
  if(state.narrationUrl){playbackState.narrationAudio=new Audio(state.narrationUrl);playbackState.narrationAudio.volume=state.narrationVolume;playbackState.narrationAudio.play().catch(()=>{});}
  render();
  function anim(){
    const elapsed=(performance.now()-playbackState.startTime)/1000;
    if(elapsed>=total){stopPlayback();return;}
    const{index,slideProgress}=getSlideAtTime(elapsed);
    const slide=state.slides[index],kb=slide.kenBurns;
    const scale=kb.startScale+(kb.endScale-kb.startScale)*slideProgress;
    const x=kb.startX+(kb.endX-kb.startX)*slideProgress, y=kb.startY+(kb.endY-kb.startY)*slideProgress;
    const img=document.getElementById('playImg');
    if(img){if(img.dataset.idx!=''+index){img.src=getDisplayUrl(slide);img.dataset.idx=index;}
      img.style.transform=`scale(${scale})`;img.style.transformOrigin=`${x}% ${y}%`;}
    const tr=0.8,rem=slide.duration-(slideProgress*slide.duration);
    let a=1;if(rem<tr)a=rem/tr;else if(slideProgress*slide.duration<tr)a=Math.min(1,(slideProgress*slide.duration)/tr);
    const w=document.getElementById('playWrapper');if(w)w.style.opacity=a;
    const bar=document.getElementById('playBar');if(bar)bar.style.width=`${(elapsed/total)*100}%`;
    const ctr=document.getElementById('playCounter');if(ctr)ctr.textContent=`${index+1} / ${state.slides.length}`;
    playbackState.animId=requestAnimationFrame(anim);
  }
  playbackState.animId=requestAnimationFrame(anim);
}
function stopPlayback(){
  if(playbackState){cancelAnimationFrame(playbackState.animId);
    if(playbackState.musicAudio){playbackState.musicAudio.pause();playbackState.musicAudio=null;}
    if(playbackState.narrationAudio){playbackState.narrationAudio.pause();playbackState.narrationAudio=null;}
    playbackState=null;}
  state.playing=false;render();
}
function renderPlayback(){
  document.getElementById('app').innerHTML=`<div class="playback-overlay">
    <div id="playWrapper" style="width:100%;height:100%;position:relative;overflow:hidden">
      <img id="playImg" src="${getDisplayUrl(state.slides[0])}" data-idx="0" alt="" style="position:absolute;width:100%;height:100%;object-fit:contain;">
    </div>
    <div class="playback-progress"><div class="playback-progress-bar" id="playBar"></div></div>
    <div class="playback-counter" id="playCounter">1 / ${state.slides.length}</div>
    <button class="playback-stop" onclick="stopPlayback()">■ Stop</button></div>`;
}

// ═══════════════ VIDEO EXPORT ═══════════════
function openExportModal(){state.showExportModal=true;state.exporting=false;state.exportProgress=0;state.exportStatus='';render();}
function closeExportModal(){state.showExportModal=false;render();}

function renderExportModal(){
  let el=document.getElementById('exportModal'); if(el) el.remove();
  const div=document.createElement('div');div.id='exportModal';div.className='modal-backdrop';
  div.innerHTML=`<div class="modal">
    <h2>Export Video</h2>
    <p>Render your story as a downloadable WebM video file with all audio tracks.</p>
    <div class="form-row"><div class="form-label">Resolution</div>
      <select id="exportRes" onchange="state.exportResolution=this.value" ${state.exporting?'disabled':''}>
        <option value="1280x720" ${state.exportResolution==='1280x720'?'selected':''}>720p (1280×720)</option>
        <option value="1920x1080" ${state.exportResolution==='1920x1080'?'selected':''}>1080p (1920×1080)</option>
        <option value="854x480" ${state.exportResolution==='854x480'?'selected':''}>480p (854×480)</option>
      </select></div>
    ${state.exporting?`<div class="export-progress"><div class="export-status" id="expStatus">${state.exportStatus}</div>
      <div class="export-bar-bg"><div class="export-bar" id="expBar" style="width:${state.exportProgress}%"></div></div></div>`:''}
    <div class="modal-actions">
      <button class="btn-small" onclick="closeExportModal()" ${state.exporting?'disabled':''}>Cancel</button>
      <button class="btn-primary" onclick="startExport()" ${state.exporting?'disabled':''}>${state.exporting?'Exporting...':'⬇ Export'}</button>
    </div></div>`;
  document.body.appendChild(div);

async function startExport(){
  state.exporting=true;state.exportProgress=0;state.exportStatus='Loading images...';renderExportModal();
  const[w,h]=state.exportResolution.split('x').map(Number);
  const fps=30, total=totalDuration();
  const images=[];
  for(const slide of state.slides) images.push(await loadImage(getDisplayUrl(slide)));

  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');
  const stream=canvas.captureStream(fps);

  // Audio
  const audioCtx=new AudioContext();
  const dest=audioCtx.createMediaStreamDestination();
  let mSrc=null,nSrc=null;
  async function loadBuf(url){const r=await fetch(url);const b=await r.arrayBuffer();return await audioCtx.decodeAudioData(b);}
  if(state.musicUrl) try{const buf=await loadBuf(state.musicUrl);mSrc=audioCtx.createBufferSource();mSrc.buffer=buf;mSrc.loop=true;
    const g=audioCtx.createGain();g.gain.value=state.musicVolume;mSrc.connect(g).connect(dest);}catch(e){console.warn(e);}
  if(state.narrationUrl) try{const buf=await loadBuf(state.narrationUrl);nSrc=audioCtx.createBufferSource();nSrc.buffer=buf;
    const g=audioCtx.createGain();g.gain.value=state.narrationVolume;nSrc.connect(g).connect(dest);}catch(e){console.warn(e);}
  if(state.musicUrl||state.narrationUrl){const at=dest.stream.getAudioTracks()[0];if(at)stream.addTrack(at);}

  let mimeType='video/webm;codecs=vp9,opus';
  if(!MediaRecorder.isTypeSupported(mimeType)){mimeType='video/webm;codecs=vp8,opus';
    if(!MediaRecorder.isTypeSupported(mimeType))mimeType='video/webm';}
  const rec=new MediaRecorder(stream,{mimeType,videoBitsPerSecond:5000000});
  const chunks=[];
  rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  rec.onstop=()=>{
    audioCtx.close();
    const blob=new Blob(chunks,{type:'video/webm'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='StoryMotion-export.webm';a.click();
    URL.revokeObjectURL(url);
    state.exporting=false;closeExportModal();
  };
  rec.start();
  if(mSrc)mSrc.start();if(nSrc)nSrc.start();
  state.exportStatus='Rendering frames...';
  const se=document.getElementById('expStatus');if(se)se.textContent=state.exportStatus;

  const startTime=performance.now(), dMs=total*1000;
  function renderFrame(){
    const elapsed=(performance.now()-startTime)/1000;
    if(elapsed>=total){rec.stop();if(mSrc)try{mSrc.stop();}catch(e){}if(nSrc)try{nSrc.stop();}catch(e){}return;}
    const{index,slideProgress}=getSlideAtTime(elapsed);
    const slide=state.slides[index],img=images[index],kb=slide.kenBurns;
    const scale=kb.startScale+(kb.endScale-kb.startScale)*slideProgress;
    const ox=(kb.startX+(kb.endX-kb.startX)*slideProgress)/100;
    const oy=(kb.startY+(kb.endY-kb.startY)*slideProgress)/100;
    ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
    const tr=0.8,rem=slide.duration-(slideProgress*slide.duration);
    let alpha=1;if(rem<tr)alpha=rem/tr;else if(slideProgress*slide.duration<tr)alpha=Math.min(1,(slideProgress*slide.duration)/tr);
    ctx.globalAlpha=alpha;
    const ia=img.naturalWidth/img.naturalHeight,ca=w/h;let dW,dH;
    if(ia>ca){dW=w*scale;dH=dW/ia;}else{dH=h*scale;dW=dH*ia;}
    const dX=(w-dW)*ox, dY=(h-dH)*oy;
    ctx.drawImage(img,dX,dY,dW,dH);ctx.globalAlpha=1;

    const pct=Math.round((elapsed/total)*100);
    const se2=document.getElementById('expStatus'),be=document.getElementById('expBar');
    if(se2)se2.textContent=`Rendering... ${pct}% (Slide ${index+1}/${state.slides.length})`;
    if(be)be.style.width=pct+'%';
    requestAnimationFrame(renderFrame);
  }
  requestAnimationFrame(renderFrame);
}

// ═══════════════ EVENTS ═══════════════
function handlePhotoUpload(e){
  const files=Array.from(e.target.files);let loaded=0;const ns=[];
  files.forEach(f=>{const r=new FileReader();r.onload=ev=>{ns.push(createSlide(ev.target.result,f.name));loaded++;
    if(loaded===files.length){if(!state.slides.length)state.selectedIndex=0;state.slides=[...state.slides,...ns];editorZoom=1;editorPanX=0;editorPanY=0;render();}};r.readAsDataURL(f);});
  e.target.value='';
}
function handleAudioUpload(e,type){const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);
  if(type==='music'){state.musicUrl=url;state.musicName=f.name;}else{state.narrationUrl=url;state.narrationName=f.name;}e.target.value='';render();}
function removeAudio(t){if(t==='music'){state.musicUrl=null;state.musicName='';}else{state.narrationUrl=null;state.narrationName='';}render();}
function selectSlide(i){state.selectedIndex=i;state.editorMode='preview';editorZoom=1;editorPanX=0;editorPanY=0;cropBox=null;render();}
function removeSlide(i){state.slides.splice(i,1);if(state.selectedIndex>=state.slides.length)state.selectedIndex=Math.max(0,state.slides.length-1);if(!state.slides.length)state.selectedIndex=-1;render();}
function updateSlideDuration(i,v){state.slides[i].duration=v;const el=document.getElementById('durVal');if(el)el.textContent=v+'s';}
function applyPreset(i){if(state.selectedIndex<0)return;state.slides[state.selectedIndex].kenBurns={...KEN_BURNS_PRESETS[i]};render();}
function updateKenBurns(si,key,val){state.slides[si].kenBurns[key]=val;state.slides[si].kenBurns.name='Custom';
  const el=document.getElementById('tune_'+key);if(el)el.textContent=key.includes('Scale')?val.toFixed(1):Math.round(val);
  document.querySelectorAll('.kb-btn').forEach(b=>b.classList.remove('active'));}

let dragFromIndex=-1;
function onDragStart(e,i){dragFromIndex=i;e.dataTransfer.effectAllowed='move';}
function onDragOver(e,i){e.preventDefault();document.getElementById('thumb_'+i)?.classList.add('dragover');}
function onDragLeave(e,i){document.getElementById('thumb_'+i)?.classList.remove('dragover');}
function onDrop(e,to){e.preventDefault();if(dragFromIndex===to||dragFromIndex<0)return;
  const[m]=state.slides.splice(dragFromIndex,1);state.slides.splice(to,0,m);
  if(state.selectedIndex===dragFromIndex)state.selectedIndex=to;dragFromIndex=-1;render();}

async function toggleRecording(){
  if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();clearInterval(recordingTimer);mediaRecorder=null;return;}
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recordingChunks=[];
    mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>recordingChunks.push(e.data);
    mediaRecorder.onstop=()=>{const blob=new Blob(recordingChunks,{type:'audio/webm'});
      state.narrationUrl=URL.createObjectURL(blob);state.narrationName='Recording';
      stream.getTracks().forEach(t=>t.stop());mediaRecorder=null;render();};
    mediaRecorder.start();recordingSeconds=0;
    recordingTimer=setInterval(()=>{recordingSeconds++;const btn=document.getElementById('recBtn');
      if(btn)btn.textContent=`■ Stop (${Math.floor(recordingSeconds/60)}:${String(recordingSeconds%60).padStart(2,'0')})`;},1000);
    render();
  }catch(err){alert('Microphone access denied. Please allow microphone access and try again.');}
}

document.addEventListener('keydown',e=>{
  if(state.showExportModal){if(e.key==='Escape')closeExportModal();return;}
  if(state.playing&&e.key==='Escape'){stopPlayback();return;}
  if(!state.playing&&state.slides.length>0){
    if(e.key==='ArrowRight'&&document.activeElement.tagName!=='INPUT')selectSlide(Math.min(state.selectedIndex+1,state.slides.length-1));
    if(e.key==='ArrowLeft'&&document.activeElement.tagName!=='INPUT')selectSlide(Math.max(state.selectedIndex-1,0));
    if(e.key==='Delete'&&state.selectedIndex>=0&&document.activeElement.tagName!=='INPUT')removeSlide(state.selectedIndex);
    if(e.key===' '&&document.activeElement.tagName!=='INPUT'){e.preventDefault();startPlayback();}
  }
});

// ═══════════════ IMAGE SEARCH ═══════════════
function searchImages(engine) {
  const input = document.getElementById('imgSearchInput');
  const query = input ? input.value.trim() : '';
  if (!query) { if(input) input.focus(); return; }
  engine = engine || 'google';
  const urls = {
    google: `https://www.google.com/search?q=${encodeURIComponent(query)}&tbm=isch`,
    unsplash: `https://unsplash.com/s/photos/${encodeURIComponent(query)}`,
    pexels: `https://www.pexels.com/search/${encodeURIComponent(query)}/`,
    pixabay: `https://pixabay.com/images/search/${encodeURIComponent(query)}/`,
  };
  window.open(urls[engine], '_blank');
}

// ═══════════════ DRAG & DROP FROM EXTERNAL ═══════════════
let dropCounter = 0;

document.addEventListener('dragenter', e => {
  if (state.playing || state.showExportModal) return;
  // Only show for external drags (files or images from other tabs)
  if (e.dataTransfer && (e.dataTransfer.types.includes('Files') || e.dataTransfer.types.includes('text/uri-list') || e.dataTransfer.types.includes('text/html'))) {
    dropCounter++;
    const ov = document.getElementById('dropOverlay');
    if (ov) ov.style.display = 'flex';
  }
});

document.addEventListener('dragleave', e => {
  dropCounter--;
  if (dropCounter <= 0) {
    dropCounter = 0;
    const ov = document.getElementById('dropOverlay');
    if (ov) ov.style.display = 'none';
  }
});

document.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});

document.addEventListener('drop', e => {
  e.preventDefault();
  dropCounter = 0;
  const ov = document.getElementById('dropOverlay');
  if (ov) ov.style.display = 'none';
  if (state.playing || state.showExportModal) return;

  // Handle dropped files
  if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    if (files.length > 0) { addImageFiles(files); return; }
  }

  // Handle dropped image URL (from browser drag)
  const html = e.dataTransfer.getData('text/html');
  if (html) {
    const match = html.match(/<img[^>]+src=["']([^"']+)["']/i);
    if (match && match[1]) { addImageFromUrl(match[1]); return; }
  }

  const uri = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  if (uri && /\.(jpg|jpeg|png|gif|webp|bmp|svg)/i.test(uri)) {
    addImageFromUrl(uri);
  }
});

// ═══════════════ CLIPBOARD PASTE ═══════════════
document.addEventListener('paste', e => {
  if (state.playing || state.showExportModal) return;
  // Don't intercept paste in text inputs
  if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;

  const items = Array.from(e.clipboardData.items);

  // Check for pasted image files
  const imageItem = items.find(item => item.type.startsWith('image/'));
  if (imageItem) {
    e.preventDefault();
    const file = imageItem.getAsFile();
    if (file) addImageFiles([file]);
    return;
  }

  // Check for pasted URL
  const textItem = items.find(item => item.type === 'text/plain');
  if (textItem) {
    textItem.getAsString(text => {
      text = text.trim();
      if (/^https?:\/\/.+\.(jpg|jpeg|png|gif|webp|bmp|svg)/i.test(text)) {
        addImageFromUrl(text);
      }
    });
  }
});

// ═══════════════ IMAGE IMPORT HELPERS ═══════════════
function addImageFiles(files) {
  let loaded = 0;
  const ns = [];
  files.forEach(f => {
    const r = new FileReader();
    r.onload = ev => {
      ns.push(createSlide(ev.target.result, f.name || 'Dropped image'));
      loaded++;
      if (loaded === files.length) {
        if (!state.slides.length) state.selectedIndex = 0;
        state.slides = [...state.slides, ...ns];
        editorZoom = 1; editorPanX = 0; editorPanY = 0;
        render();
      }
    };
    r.readAsDataURL(f);
  });
}

function addImageFromUrl(url) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    // Convert to data URL to avoid CORS issues in playback/export
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext('2d').drawImage(img, 0, 0);
    try {
      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      const name = url.split('/').pop().split('?')[0] || 'Web image';
      if (!state.slides.length) state.selectedIndex = 0;
      state.slides.push(createSlide(dataUrl, decodeURIComponent(name).substring(0, 40)));
      editorZoom = 1; editorPanX = 0; editorPanY = 0;
      render();
    } catch (err) {
      // CORS blocked the canvas read — keep as URL
      const name = url.split('/').pop().split('?')[0] || 'Web image';
      if (!state.slides.length) state.selectedIndex = 0;
      state.slides.push(createSlide(url, decodeURIComponent(name).substring(0, 40)));
      editorZoom = 1; editorPanX = 0; editorPanY = 0;
      render();
    }
  };
  img.onerror = () => {
    // If crossOrigin load fails, try without it
    const img2 = new Image();
    img2.onload = () => {
      const name = url.split('/').pop().split('?')[0] || 'Web image';
      if (!state.slides.length) state.selectedIndex = 0;
      state.slides.push(createSlide(url, decodeURIComponent(name).substring(0, 40)));
      editorZoom = 1; editorPanX = 0; editorPanY = 0;
      render();
    };
    img2.onerror = () => alert('Could not load that image. Try right-click → "Copy Image" then paste here with Ctrl+V.');
    img2.src = url;
  };
  img.src = url;
}

render();
</script>

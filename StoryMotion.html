<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryMotion — Digital Story Creator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(145deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
    color: #e0e0e0;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700;
    background: linear-gradient(135deg, #E8A87C, #D4845A);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .topbar-info {
    font-size: 11px; color: #6a6a7a;
    border-left: 1px solid #333; padding-left: 12px; margin-left: 12px;
  }
  .topbar-actions { display: flex; gap: 10px; }

  /* Buttons */
  .btn-small {
    background: transparent;
    border: 1px solid rgba(232,168,124,0.4);
    color: #E8A87C; padding: 6px 14px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif;
    transition: all 0.2s; white-space: nowrap;
  }
  .btn-small:hover { background: rgba(232,168,124,0.1); }
  .btn-primary {
    background: linear-gradient(135deg, #E8A87C, #D4845A);
    border: none; color: #1a1a2e; padding: 10px 24px; border-radius: 8px;
    cursor: pointer; font-size: 14px; font-weight: 600;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-record {
    background: transparent; border: 1px solid rgba(232,168,124,0.4);
    color: #E8A87C; padding: 6px 14px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif;
  }
  .btn-recording {
    background: #c0392b; border-color: #c0392b; color: #fff;
  }

  /* Main layout */
  .main { flex: 1; display: flex; overflow: hidden; }
  .preview-area { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 16px; min-width: 0; }

  /* Preview canvas */
  .preview-canvas {
    flex: 1; border-radius: 12px; overflow: hidden;
    background: #000; display: flex; align-items: center; justify-content: center;
    position: relative; min-height: 0;
  }
  .preview-canvas img {
    position: absolute; width: 100%; height: 100%; object-fit: cover;
  }
  .preview-empty { text-align: center; color: #555; padding: 40px; }
  .preview-empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }

  /* Slide strip */
  .slide-strip {
    display: flex; gap: 8px; overflow-x: auto; padding: 8px 4px;
    background: rgba(0,0,0,0.2); border-radius: 10px;
    min-height: 96px; align-items: center; flex-shrink: 0;
  }
  .slide-thumb {
    position: relative; width: 120px; min-width: 120px; height: 80px;
    border-radius: 8px; overflow: hidden; cursor: pointer;
    border: 2px solid transparent; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3); transition: all 0.2s;
  }
  .slide-thumb.selected { border-color: #E8A87C; box-shadow: 0 0 16px rgba(232,168,124,0.3); }
  .slide-thumb.dragover { border: 2px dashed #E8A87C; }
  .slide-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .slide-thumb-label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    padding: 12px 6px 4px; font-size: 10px; color: #ccc; text-align: center;
  }
  .slide-thumb-remove {
    position: absolute; top: 3px; right: 3px;
    background: rgba(0,0,0,0.6); border: none; color: #aaa;
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    font-size: 11px; display: flex; align-items: center; justify-content: center;
  }
  .slide-thumb-remove:hover { color: #fff; background: rgba(200,50,50,0.7); }
  .slide-add-btn {
    width: 80px; min-width: 80px; height: 80px; border-radius: 8px;
    border: 2px dashed rgba(255,255,255,0.12); background: transparent;
    color: #555; font-size: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .slide-add-btn:hover { border-color: rgba(232,168,124,0.3); color: #E8A87C; }

  /* Sidebar */
  .sidebar {
    width: 320px; min-width: 320px;
    border-left: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.15);
    overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
    flex-shrink: 0;
  }
  .panel {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 16px;
  }
  .label {
    font-size: 11px; color: #8a8a9a; text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 6px;
  }

  /* Ken Burns grid */
  .kb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .kb-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.1);
    color: #999; padding: 5px 8px; border-radius: 6px; cursor: pointer;
    font-size: 10px; text-align: center; font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }
  .kb-btn:hover { border-color: rgba(232,168,124,0.3); color: #ccc; }
  .kb-btn.active {
    background: rgba(232,168,124,0.15);
    border-color: rgba(232,168,124,0.5);
    color: #E8A87C;
  }

  /* Fine-tune row */
  .tune-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .tune-label { font-size: 10px; color: #777; width: 56px; flex-shrink: 0; }
  .tune-val { font-size: 10px; color: #999; width: 28px; text-align: right; }

  /* Range inputs */
  input[type=range] { accent-color: #E8A87C; flex: 1; }

  /* Audio row */
  .audio-row { display: flex; flex-direction: column; gap: 8px; }
  .audio-file-info {
    font-size: 11px; color: #888; display: flex; align-items: center; gap: 6px;
  }
  .audio-file-info span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .audio-remove { background: none; border: none; color: #666; cursor: pointer; font-size: 14px; }
  .audio-remove:hover { color: #c0392b; }
  .volume-row { display: flex; align-items: center; gap: 8px; }
  .volume-label { font-size: 10px; color: #666; }
  .volume-val { font-size: 10px; color: #999; width: 28px; }
  .rec-row { display: flex; gap: 8px; }

  /* Tips */
  .tips {
    padding: 12px; border-radius: 8px;
    background: rgba(232,168,124,0.05);
    border: 1px solid rgba(232,168,124,0.1);
    font-size: 11px; color: #8a7a6a; line-height: 1.5;
  }
  .tips strong { color: #E8A87C; }

  /* Playback overlay */
  .playback-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
  }
  .playback-overlay img {
    position: absolute; width: 100%; height: 100%; object-fit: cover;
  }
  .playback-progress {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: rgba(255,255,255,0.15);
  }
  .playback-progress-bar { height: 100%; background: #E8A87C; transition: width 0.1s linear; }
  .playback-counter {
    position: absolute; top: 16px; right: 16px;
    background: rgba(0,0,0,0.5); color: #fff;
    padding: 4px 12px; border-radius: 20px; font-size: 13px;
  }
  .playback-stop {
    position: absolute; top: 16px; left: 16px;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 6px 16px; border-radius: 20px; cursor: pointer;
    font-size: 13px; font-family: 'DM Sans', sans-serif;
    backdrop-filter: blur(8px);
  }
  .playback-stop:hover { background: rgba(60,60,60,0.6); }

  .dur-row { display: flex; align-items: center; gap: 10px; }
  .dur-val { font-size: 14px; color: #E8A87C; min-width: 32px; text-align: right; }

  /* Responsive */
  @media (max-width: 900px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; min-width: unset; border-left: none; border-top: 1px solid rgba(255,255,255,0.06); max-height: 50vh; }
  }
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
// ── State ──
const KEN_BURNS_PRESETS = [
  { name: "Zoom In", startScale: 1, endScale: 1.4, startX: 50, startY: 50, endX: 50, endY: 50 },
  { name: "Zoom Out", startScale: 1.4, endScale: 1, startX: 50, startY: 50, endX: 50, endY: 50 },
  { name: "Pan Right", startScale: 1.3, endScale: 1.3, startX: 30, startY: 50, endX: 70, endY: 50 },
  { name: "Pan Left", startScale: 1.3, endScale: 1.3, startX: 70, startY: 50, endX: 30, endY: 50 },
  { name: "Pan Down", startScale: 1.3, endScale: 1.3, startX: 50, startY: 30, endX: 50, endY: 70 },
  { name: "Pan Up", startScale: 1.3, endScale: 1.3, startX: 50, startY: 70, endX: 50, endY: 30 },
  { name: "Zoom In + Pan Right", startScale: 1, endScale: 1.5, startX: 30, startY: 40, endX: 70, endY: 60 },
  { name: "Zoom Out + Pan Left", startScale: 1.5, endScale: 1, startX: 70, startY: 60, endX: 30, endY: 40 },
  { name: "Dramatic Zoom", startScale: 1, endScale: 1.8, startX: 50, startY: 40, endX: 50, endY: 40 },
  { name: "Slow Drift", startScale: 1.15, endScale: 1.25, startX: 45, startY: 45, endX: 55, endY: 55 },
];

let state = {
  slides: [],
  selectedIndex: -1,
  playing: false,
  musicUrl: null,
  musicName: "",
  narrationUrl: null,
  narrationName: "",
  musicVolume: 0.4,
  narrationVolume: 1.0,
};

let previewAnimId = null;
let previewProgress = 0;
let playbackState = null;
let mediaRecorder = null;
let recordingChunks = [];
let recordingTimer = null;
let recordingSeconds = 0;

// ── Helpers ──
function createSlide(imageUrl, fileName) {
  return {
    id: Date.now() + Math.random(),
    imageUrl, fileName,
    duration: 5,
    kenBurns: { ...KEN_BURNS_PRESETS[0] },
  };
}

function getSlideAtTime(time) {
  let acc = 0;
  for (let i = 0; i < state.slides.length; i++) {
    if (time < acc + state.slides[i].duration) {
      return { index: i, slideProgress: (time - acc) / state.slides[i].duration };
    }
    acc += state.slides[i].duration;
  }
  return { index: state.slides.length - 1, slideProgress: 1 };
}

function totalDuration() {
  return state.slides.reduce((s, sl) => s + sl.duration, 0);
}

// ── Rendering ──
function render() {
  if (state.playing) {
    renderPlayback();
  } else {
    renderEditor();
  }
}

function renderEditor() {
  const sel = state.selectedIndex >= 0 && state.selectedIndex < state.slides.length
    ? state.slides[state.selectedIndex] : null;
  const total = totalDuration();

  document.getElementById('app').innerHTML = `
    <!-- Top bar -->
    <div class="topbar">
      <div style="display:flex;align-items:center">
        <span class="logo">StoryMotion</span>
        <span class="topbar-info">${state.slides.length} slide${state.slides.length !== 1 ? 's' : ''} · ${total}s total</span>
      </div>
      <div class="topbar-actions">
        <button class="btn-small" onclick="document.getElementById('photoInput').click()">+ Add Photos</button>
        ${state.slides.length >= 1 ? '<button class="btn-primary" onclick="startPlayback()">▶ Play Story</button>' : ''}
      </div>
    </div>
    <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="handlePhotoUpload(event)">
    <input type="file" id="musicInput" accept="audio/*" style="display:none" onchange="handleAudioUpload(event,'music')">
    <input type="file" id="narrationInput" accept="audio/*" style="display:none" onchange="handleAudioUpload(event,'narration')">

    <!-- Main -->
    <div class="main">
      <!-- Preview area -->
      <div class="preview-area">
        <div class="preview-canvas" id="previewCanvas">
          ${sel ? `<img id="previewImg" src="${sel.imageUrl}" alt="">` : `
            <div class="preview-empty">
              <div class="preview-empty-icon">🎬</div>
              <div style="font-size:16px">${state.slides.length === 0 ? 'Add photos to begin your story' : 'Select a slide to preview'}</div>
              ${state.slides.length === 0 ? '<button class="btn-primary" style="margin-top:20px" onclick="document.getElementById(\'photoInput\').click()">+ Upload Photos</button>' : ''}
            </div>
          `}
        </div>

        <!-- Slide strip -->
        <div class="slide-strip" id="slideStrip">
          ${state.slides.map((s, i) => `
            <div class="slide-thumb ${i === state.selectedIndex ? 'selected' : ''}"
                 id="thumb_${i}"
                 draggable="true"
                 onclick="selectSlide(${i})"
                 ondragstart="onDragStart(event,${i})"
                 ondragover="onDragOver(event,${i})"
                 ondragleave="onDragLeave(event,${i})"
                 ondrop="onDrop(event,${i})">
              <img src="${s.imageUrl}" alt="">
              <div class="slide-thumb-label">${i + 1} · ${s.duration}s</div>
              <button class="slide-thumb-remove" onclick="event.stopPropagation();removeSlide(${i})">×</button>
            </div>
          `).join('')}
          ${state.slides.length > 0 ? '<button class="slide-add-btn" onclick="document.getElementById(\'photoInput\').click()">+</button>' : ''}
        </div>
      </div>

      <!-- Sidebar -->
      <div class="sidebar">
        ${sel ? renderSlideSettings(sel) : `
          <div class="panel" style="text-align:center;color:#555;padding:32px">
            ${state.slides.length === 0 ? 'Upload photos to get started' : 'Select a slide to edit its properties'}
          </div>
        `}

        <!-- Music -->
        <div class="panel">
          <div class="label">🎵 Background Music</div>
          <div class="audio-row">
            <button class="btn-small" onclick="document.getElementById('musicInput').click()">
              ${state.musicUrl ? 'Change Music' : 'Upload Music'}
            </button>
            ${state.musicUrl ? `
              <div class="audio-file-info">
                <span>♫ ${state.musicName || 'Audio'}</span>
                <button class="audio-remove" onclick="removeAudio('music')">×</button>
              </div>
              <div class="volume-row">
                <span class="volume-label">Vol</span>
                <input type="range" min="0" max="1" step="0.05" value="${state.musicVolume}" oninput="state.musicVolume=parseFloat(this.value);renderVolumeVal('musicVol',this.value)">
                <span class="volume-val" id="musicVol">${Math.round(state.musicVolume * 100)}%</span>
              </div>
            ` : ''}
          </div>
        </div>

        <!-- Narration -->
        <div class="panel">
          <div class="label">🎙 Narration</div>
          <div class="audio-row">
            <div class="rec-row">
              <button class="btn-record ${mediaRecorder && mediaRecorder.state === 'recording' ? 'btn-recording' : ''}" id="recBtn" onclick="toggleRecording()">
                ${mediaRecorder && mediaRecorder.state === 'recording'
                  ? `■ Stop (${Math.floor(recordingSeconds/60)}:${String(recordingSeconds%60).padStart(2,'0')})`
                  : '⏺ Record'}
              </button>
              <button class="btn-small" onclick="document.getElementById('narrationInput').click()">Upload</button>
            </div>
            ${state.narrationUrl ? `
              <div class="audio-file-info">
                <span>🎙 ${state.narrationName}</span>
                <button class="audio-remove" onclick="removeAudio('narration')">×</button>
              </div>
              <div class="volume-row">
                <span class="volume-label">Vol</span>
                <input type="range" min="0" max="1" step="0.05" value="${state.narrationVolume}" oninput="state.narrationVolume=parseFloat(this.value);renderVolumeVal('narrVol',this.value)">
                <span class="volume-val" id="narrVol">${Math.round(state.narrationVolume * 100)}%</span>
              </div>
            ` : ''}
          </div>
        </div>

        <!-- Tips -->
        <div class="tips">
          <strong>Tips:</strong><br>
          · Drag slides to reorder them<br>
          · Use presets or fine-tune the Ken Burns effect<br>
          · Record narration directly or upload an audio file<br>
          · Music loops automatically during playback
        </div>
      </div>
    </div>
  `;

  startPreviewAnimation();
}

function renderSlideSettings(sel) {
  const idx = state.selectedIndex;
  const kb = sel.kenBurns;
  const tuneRows = [
    ["startScale", "Start Zoom", 0.8, 2, 0.05],
    ["endScale", "End Zoom", 0.8, 2, 0.05],
    ["startX", "Start X", 0, 100, 1],
    ["startY", "Start Y", 0, 100, 1],
    ["endX", "End X", 0, 100, 1],
    ["endY", "End Y", 0, 100, 1],
  ];

  return `
    <div><div class="label">Slide ${idx + 1}: ${sel.fileName}</div></div>

    <!-- Duration -->
    <div class="panel">
      <div class="label">Duration</div>
      <div class="dur-row">
        <input type="range" min="2" max="20" step="0.5" value="${sel.duration}"
               oninput="updateSlideDuration(${idx}, parseFloat(this.value))">
        <span class="dur-val" id="durVal">${sel.duration}s</span>
      </div>
    </div>

    <!-- Ken Burns -->
    <div class="panel">
      <div class="label">Ken Burns Effect</div>
      <div class="kb-grid">
        ${KEN_BURNS_PRESETS.map((p, i) => `
          <button class="kb-btn ${kb.name === p.name ? 'active' : ''}"
                  onclick="applyPreset(${i})">${p.name}</button>
        `).join('')}
      </div>
      <div style="font-size:11px;color:#666;margin-bottom:8px">Fine-tune</div>
      ${tuneRows.map(([key, lbl, min, max, step]) => `
        <div class="tune-row">
          <span class="tune-label">${lbl}</span>
          <input type="range" min="${min}" max="${max}" step="${step}" value="${kb[key]}"
                 oninput="updateKenBurns(${idx},'${key}',parseFloat(this.value))">
          <span class="tune-val" id="tune_${key}">${key.includes('Scale') ? kb[key].toFixed(1) : Math.round(kb[key])}</span>
        </div>
      `).join('')}
    </div>
  `;
}

// ── Preview Animation ──
function startPreviewAnimation() {
  cancelAnimationFrame(previewAnimId);
  const sel = state.selectedIndex >= 0 ? state.slides[state.selectedIndex] : null;
  if (!sel || state.playing) return;

  const dur = sel.duration * 1000;
  const startTime = performance.now();

  function animate() {
    const el = document.getElementById('previewImg');
    if (!el) return;
    const elapsed = performance.now() - startTime;
    const t = (elapsed % dur) / dur;
    previewProgress = t;

    const kb = state.slides[state.selectedIndex]?.kenBurns;
    if (!kb) return;
    const scale = kb.startScale + (kb.endScale - kb.startScale) * t;
    const x = kb.startX + (kb.endX - kb.startX) * t;
    const y = kb.startY + (kb.endY - kb.startY) * t;
    el.style.transform = `scale(${scale})`;
    el.style.transformOrigin = `${x}% ${y}%`;

    previewAnimId = requestAnimationFrame(animate);
  }
  previewAnimId = requestAnimationFrame(animate);
}

// ── Playback ──
function startPlayback() {
  if (state.slides.length === 0) return;
  state.playing = true;
  const total = totalDuration();

  playbackState = {
    startTime: performance.now(),
    musicAudio: null,
    narrationAudio: null,
    animId: null,
  };

  if (state.musicUrl) {
    playbackState.musicAudio = new Audio(state.musicUrl);
    playbackState.musicAudio.volume = state.musicVolume;
    playbackState.musicAudio.loop = true;
    playbackState.musicAudio.play().catch(() => {});
  }
  if (state.narrationUrl) {
    playbackState.narrationAudio = new Audio(state.narrationUrl);
    playbackState.narrationAudio.volume = state.narrationVolume;
    playbackState.narrationAudio.play().catch(() => {});
  }

  render();

  function animatePlayback() {
    const elapsed = (performance.now() - playbackState.startTime) / 1000;
    if (elapsed >= total) { stopPlayback(); return; }

    const { index, slideProgress } = getSlideAtTime(elapsed);
    const slide = state.slides[index];
    const kb = slide.kenBurns;
    const scale = kb.startScale + (kb.endScale - kb.startScale) * slideProgress;
    const x = kb.startX + (kb.endX - kb.startX) * slideProgress;
    const y = kb.startY + (kb.endY - kb.startY) * slideProgress;

    const img = document.getElementById('playImg');
    if (img) {
      img.src = slide.imageUrl;
      img.style.transform = `scale(${scale})`;
      img.style.transformOrigin = `${x}% ${y}%`;
    }

    // Crossfade
    const transTime = 0.8;
    const remaining = slide.duration - (slideProgress * slide.duration);
    let opacity = 1;
    if (remaining < transTime) opacity = remaining / transTime;
    else if (slideProgress * slide.duration < transTime) opacity = Math.min(1, (slideProgress * slide.duration) / transTime);
    const wrapper = document.getElementById('playWrapper');
    if (wrapper) wrapper.style.opacity = opacity;

    // Progress bar
    const bar = document.getElementById('playBar');
    if (bar) bar.style.width = `${(elapsed / total) * 100}%`;

    // Counter
    const counter = document.getElementById('playCounter');
    if (counter) counter.textContent = `${index + 1} / ${state.slides.length}`;

    playbackState.animId = requestAnimationFrame(animatePlayback);
  }
  playbackState.animId = requestAnimationFrame(animatePlayback);
}

function stopPlayback() {
  if (playbackState) {
    cancelAnimationFrame(playbackState.animId);
    if (playbackState.musicAudio) { playbackState.musicAudio.pause(); playbackState.musicAudio = null; }
    if (playbackState.narrationAudio) { playbackState.narrationAudio.pause(); playbackState.narrationAudio = null; }
    playbackState = null;
  }
  state.playing = false;
  render();
}

function renderPlayback() {
  document.getElementById('app').innerHTML = `
    <div class="playback-overlay">
      <div id="playWrapper" style="width:100%;height:100%;position:relative;overflow:hidden">
        <img id="playImg" src="${state.slides[0].imageUrl}" alt="">
      </div>
      <div class="playback-progress"><div class="playback-progress-bar" id="playBar"></div></div>
      <div class="playback-counter" id="playCounter">1 / ${state.slides.length}</div>
      <button class="playback-stop" onclick="stopPlayback()">■ Stop</button>
    </div>
  `;
}

// ── Event Handlers ──
function handlePhotoUpload(e) {
  const files = Array.from(e.target.files);
  let loaded = 0;
  const newSlides = [];
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      newSlides.push(createSlide(ev.target.result, file.name));
      loaded++;
      if (loaded === files.length) {
        if (state.slides.length === 0) state.selectedIndex = 0;
        state.slides = [...state.slides, ...newSlides];
        render();
      }
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function handleAudioUpload(e, type) {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  if (type === 'music') { state.musicUrl = url; state.musicName = file.name; }
  else { state.narrationUrl = url; state.narrationName = file.name; }
  e.target.value = '';
  render();
}

function removeAudio(type) {
  if (type === 'music') { state.musicUrl = null; state.musicName = ''; }
  else { state.narrationUrl = null; state.narrationName = ''; }
  render();
}

function selectSlide(i) { state.selectedIndex = i; render(); }

function removeSlide(i) {
  state.slides.splice(i, 1);
  if (state.selectedIndex >= state.slides.length) state.selectedIndex = Math.max(0, state.slides.length - 1);
  if (state.slides.length === 0) state.selectedIndex = -1;
  render();
}

function updateSlideDuration(i, val) {
  state.slides[i].duration = val;
  const el = document.getElementById('durVal');
  if (el) el.textContent = val + 's';
}

function applyPreset(presetIdx) {
  if (state.selectedIndex < 0) return;
  state.slides[state.selectedIndex].kenBurns = { ...KEN_BURNS_PRESETS[presetIdx] };
  render();
}

function updateKenBurns(slideIdx, key, val) {
  state.slides[slideIdx].kenBurns[key] = val;
  state.slides[slideIdx].kenBurns.name = 'Custom';
  const el = document.getElementById('tune_' + key);
  if (el) el.textContent = key.includes('Scale') ? val.toFixed(1) : Math.round(val);
  // Update active states
  document.querySelectorAll('.kb-btn').forEach(b => b.classList.remove('active'));
}

function renderVolumeVal(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = Math.round(val * 100) + '%';
}

// ── Drag & Drop ──
let dragFromIndex = -1;
function onDragStart(e, i) { dragFromIndex = i; e.dataTransfer.effectAllowed = 'move'; }
function onDragOver(e, i) { e.preventDefault(); document.getElementById('thumb_' + i)?.classList.add('dragover'); }
function onDragLeave(e, i) { document.getElementById('thumb_' + i)?.classList.remove('dragover'); }
function onDrop(e, toIndex) {
  e.preventDefault();
  if (dragFromIndex === toIndex || dragFromIndex < 0) return;
  const [moved] = state.slides.splice(dragFromIndex, 1);
  state.slides.splice(toIndex, 0, moved);
  if (state.selectedIndex === dragFromIndex) state.selectedIndex = toIndex;
  dragFromIndex = -1;
  render();
}

// ── Recording ──
async function toggleRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    clearInterval(recordingTimer);
    mediaRecorder = null;
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordingChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => recordingChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordingChunks, { type: 'audio/webm' });
      state.narrationUrl = URL.createObjectURL(blob);
      state.narrationName = 'Recording';
      stream.getTracks().forEach(t => t.stop());
      mediaRecorder = null;
      render();
    };
    mediaRecorder.start();
    recordingSeconds = 0;
    recordingTimer = setInterval(() => {
      recordingSeconds++;
      const btn = document.getElementById('recBtn');
      if (btn) btn.textContent = `■ Stop (${Math.floor(recordingSeconds/60)}:${String(recordingSeconds%60).padStart(2,'0')})`;
    }, 1000);
    render();
  } catch (err) {
    alert('Microphone access denied. Please allow microphone access and try again.');
  }
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (state.playing && e.key === 'Escape') { stopPlayback(); return; }
  if (!state.playing && state.slides.length > 0) {
    if (e.key === 'ArrowRight') { selectSlide(Math.min(state.selectedIndex + 1, state.slides.length - 1)); }
    if (e.key === 'ArrowLeft') { selectSlide(Math.max(state.selectedIndex - 1, 0)); }
    if (e.key === 'Delete' && state.selectedIndex >= 0) { removeSlide(state.selectedIndex); }
    if (e.key === ' ' && e.target.tagName !== 'INPUT') { e.preventDefault(); startPlayback(); }
  }
});

// ── Init ──
render();
</script>

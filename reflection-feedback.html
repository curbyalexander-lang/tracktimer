<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflection Feedback</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  ::selection { background: #4a2d6b; color: #f0e6d3; }

  body {
    min-height: 100vh;
    background: linear-gradient(168deg, #f7f5f0 0%, #ede8df 50%, #e4ddd2 100%);
    font-family: 'Lora', Georgia, serif;
    padding: 2rem 1rem;
  }

  .container { max-width: 680px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 2.5rem; }

  .badge {
    display: inline-block;
    background: #4a2d6b;
    color: #f0e6d3;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.35rem 1rem;
    border-radius: 2px;
    margin-bottom: 1rem;
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    color: #2c1810;
    margin: 0.5rem 0 0.25rem;
    line-height: 1.3;
  }

  .subtitle {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    color: #7a6b5d;
    font-style: italic;
  }

  .card {
    background: #fffdf9;
    border: 1px solid #d8cfc2;
    border-radius: 6px;
    padding: 2rem;
    box-shadow: 0 2px 12px rgba(44, 24, 16, 0.06);
  }

  .field { margin-bottom: 1.5rem; }
  .field.corrective { margin-bottom: 1.75rem; }

  label {
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    color: #4a2d6b;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
  }

  label .optional {
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    color: #9a8b7d;
    margin-left: 0.5rem;
    font-size: 0.72rem;
  }

  .hint {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    color: #9a8b7d;
    margin: 0 0 0.5rem;
    font-style: italic;
  }

  input[type="text"], textarea {
    width: 100%;
    padding: 0.7rem 0.9rem;
    color: #2c1810;
    background: #faf8f4;
    border: 1px solid #d8cfc2;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"] {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
  }

  textarea {
    font-family: 'Lora', Georgia, serif;
    font-size: 0.9rem;
    line-height: 1.7;
    resize: vertical;
  }

  textarea.corrective-input {
    font-family: 'DM Sans', sans-serif;
    line-height: 1.6;
    border-style: dashed;
    border-color: #c9bfb0;
  }

  input:focus, textarea:focus {
    border-color: #4a2d6b;
    border-style: solid;
  }

  .btn-generate {
    width: 100%;
    padding: 0.85rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    color: #f0e6d3;
    background: linear-gradient(135deg, #4a2d6b, #5e3a85);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: all 0.25s;
  }

  .btn-generate:hover { transform: translateY(-1px); }
  .btn-generate:disabled {
    color: #a09585;
    background: #d8cfc2;
    cursor: not-allowed;
    transform: none;
  }

  .btn-generate .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(240, 230, 211, 0.3);
    border-top-color: #f0e6d3;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 0.5rem;
  }

  .error-msg {
    margin-top: 1rem;
    padding: 0.75rem 1rem;
    background: #fdf0ec;
    border: 1px solid #e8c4b8;
    border-radius: 4px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    color: #8b3a2a;
    display: none;
  }

  .output {
    margin-top: 1.75rem;
    background: #fffdf9;
    border: 1px solid #d8cfc2;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(44, 24, 16, 0.06);
    display: none;
    animation: fadeIn 0.4s ease;
  }

  .output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.8rem 1.5rem;
    border-bottom: 1px solid #ece5da;
    background: #f7f3ed;
  }

  .output-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    color: #4a2d6b;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .output-actions { display: flex; gap: 0.5rem; }

  .btn-small {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    border: none;
    border-radius: 3px;
    padding: 0.35rem 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-copy { color: #4a2d6b; background: #ede4f5; }
  .btn-copy.copied { color: #3a7a4a; background: #e8f5ec; }
  .btn-reset { color: #7a6b5d; background: #ece5da; }

  .output-body { padding: 1.5rem 1.75rem; }

  .output-body p {
    font-family: 'Lora', Georgia, serif;
    font-size: 0.95rem;
    line-height: 1.8;
    color: #2c1810;
  }

  .citation-indicator {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.85rem 1.25rem;
    margin: 0 1.5rem 0;
    border-radius: 4px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    line-height: 1.5;
  }

  .citation-indicator .ci-icon {
    flex-shrink: 0;
    font-size: 1rem;
    margin-top: 0.05rem;
  }

  .citation-indicator .ci-label {
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    margin-bottom: 0.15rem;
  }

  .citation-indicator .ci-note {
    color: inherit;
    opacity: 0.85;
  }

  .citation-none {
    background: #fdf0ec;
    border: 1px solid #e8c4b8;
    color: #8b3a2a;
  }

  .citation-performative {
    background: #fef8e8;
    border: 1px solid #e0d3a8;
    color: #7a6520;
  }

  .citation-substantive {
    background: #eef6ef;
    border: 1px solid #b8d4ba;
    color: #3a6b3e;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="badge">Reflection Feedback</div>
    <h1>Student Reflection Review</h1>
    <p class="subtitle">Paste a reflection, get a personalized feedback paragraph</p>
  </div>

  <div class="card">
    <div class="field">
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" placeholder="e.g. Jordan">
    </div>

    <div class="field">
      <label for="reflection">Student Reflection</label>
      <textarea id="reflection" rows="10" placeholder="Paste the student's reflection paper here..."></textarea>
    </div>

    <div class="field corrective">
      <label for="corrective">Corrective Feedback <span class="optional">optional</span></label>
      <p class="hint">Anything specific the student needs to hear — it'll be woven in gently.</p>
      <textarea id="corrective" class="corrective-input" rows="3" placeholder="e.g. Needed more connection to the readings..."></textarea>
    </div>

    <button class="btn-generate" id="generateBtn" onclick="generateFeedback()" disabled>
      Generate Feedback
    </button>

    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="output" id="outputSection">
    <div class="output-header">
      <span class="output-label" id="outputLabel">Feedback</span>
      <div class="output-actions">
        <button class="btn-small btn-copy" id="copyBtn" onclick="copyFeedback()">Copy</button>
        <button class="btn-small btn-reset" onclick="resetForm()">New Student</button>
      </div>
    </div>
    <div class="output-body">
      <div class="citation-indicator" id="citationIndicator" style="display:none;">
        <span class="ci-icon" id="citationIcon"></span>
        <div>
          <div class="ci-label" id="citationLabel"></div>
          <div class="ci-note" id="citationNote"></div>
        </div>
      </div>
      <p id="feedbackText"></p>
    </div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `You are Dr. Curby Alexander, an Associate Professor in the College of Education at TCU. You have two jobs in this task.

JOB 1 — CITATION ANALYSIS
Examine the student's reflection for references to course readings, authors, articles, books, or assigned texts. Classify as one of:
- "none" — No references to course readings at all.
- "performative" — Citations exist but are superficial. They're name-dropped or tacked on without meaningful connection to the student's ideas. The student seems to be checking a box.
- "substantive" — Citations are meaningfully integrated. The student engages with the ideas from the readings and connects them to their own thinking, experiences, or arguments.

Provide a brief 1-2 sentence explanation of your classification.

JOB 2 — FEEDBACK PARAGRAPH
Write brief feedback on the student's reflection paper. Your tone is warm, conversational, encouraging, and genuine — like a mentor who actually read what the student wrote and cares about their growth.

Your writing style:
- Casual and direct — you talk TO the student, not about them
- You use parenthetical asides naturally (like this one) to add warmth or a small aside
- You notice specific things the student said and call them out — not vaguely, but by pointing to actual ideas or moments in their writing
- You're positive without being saccharine — you sound like a real person, not a form letter
- You might say things like "I really appreciate how you..." or "This part stood out to me because..." or "What I love about this is..."
- Avoid stiff academic language — no "demonstrates" or "evidences" or "articulates" unless it fits naturally
- NEVER use dashes (em dashes, en dashes, or hyphens used as dashes) in your writing. Use parenthetical asides, commas, or separate sentences instead. This is a hard rule.
- Keep it to one paragraph, roughly 4-5 sentences
- Address the student by their first name at least once

Do NOT mention the citation analysis in the feedback paragraph. The citation analysis is for the instructor only.

Respond with ONLY valid JSON, no markdown backticks, no preamble:
{"citation_level":"none|performative|substantive","citation_note":"your 1-2 sentence explanation","feedback":"your feedback paragraph"}`;

const nameInput = document.getElementById('studentName');
const reflectionInput = document.getElementById('reflection');
const correctiveInput = document.getElementById('corrective');
const generateBtn = document.getElementById('generateBtn');
const errorMsg = document.getElementById('errorMsg');
const outputSection = document.getElementById('outputSection');
const outputLabel = document.getElementById('outputLabel');
const feedbackText = document.getElementById('feedbackText');
const copyBtn = document.getElementById('copyBtn');
const citationIndicator = document.getElementById('citationIndicator');
const citationIcon = document.getElementById('citationIcon');
const citationLabel = document.getElementById('citationLabel');
const citationNote = document.getElementById('citationNote');

const CITATION_CONFIG = {
  none: { icon: '⚠', label: 'No Course Readings Referenced', cls: 'citation-none' },
  performative: { icon: '◑', label: 'Performative Citations', cls: 'citation-performative' },
  substantive: { icon: '✓', label: 'Substantive Citations', cls: 'citation-substantive' },
};

function updateButton() {
  generateBtn.disabled = !(nameInput.value.trim() && reflectionInput.value.trim());
}

nameInput.addEventListener('input', updateButton);
reflectionInput.addEventListener('input', updateButton);

async function generateFeedback() {
  const name = nameInput.value.trim();
  const reflection = reflectionInput.value.trim();
  const corrective = correctiveInput.value.trim();

  if (!name || !reflection) return;

  generateBtn.disabled = true;
  generateBtn.innerHTML = '<span class="spinner"></span> Writing feedback...';
  errorMsg.style.display = 'none';
  outputSection.style.display = 'none';

  let userPrompt = `Student name: ${name}\n\nHere is the student's reflection paper:\n\n${reflection}`;
  if (corrective) {
    userPrompt += `\n\n---\nIMPORTANT: In addition to the positive feedback, you MUST also weave in the following corrective note naturally. Don't make it harsh — keep your warm tone — but make sure this point lands clearly as something to work on or be aware of. Here is the corrective feedback to include:\n\n${corrective}`;
  }

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: userPrompt }],
      }),
    });

    const data = await res.json();

    if (data.error) {
      showError(data.error.message || 'Something went wrong.');
      return;
    }

    const text = (data.content || [])
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('');

      let feedback, citLevel, citNote;
      try {
        const clean = text.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(clean);
        feedback = parsed.feedback || 'No feedback generated.';
        citLevel = parsed.citation_level || 'none';
        citNote = parsed.citation_note || '';
      } catch (e) {
        feedback = text || 'No feedback generated.';
        citLevel = null;
        citNote = '';
      }

      feedbackText.textContent = feedback;
      outputLabel.textContent = 'Feedback for ' + name;

      if (citLevel && CITATION_CONFIG[citLevel]) {
        const cfg = CITATION_CONFIG[citLevel];
        citationIndicator.className = 'citation-indicator ' + cfg.cls;
        citationIcon.textContent = cfg.icon;
        citationLabel.textContent = cfg.label;
        citationNote.textContent = citNote;
        citationIndicator.style.display = 'flex';
      } else {
        citationIndicator.style.display = 'none';
      }

      outputSection.style.display = 'block';

    setTimeout(() => {
      outputSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);

  } catch (e) {
    showError('Failed to connect. Please try again.');
  } finally {
    generateBtn.innerHTML = 'Generate Feedback';
    updateButton();
  }
}

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
}

function copyFeedback() {
  try {
    const textarea = document.createElement('textarea');
    textarea.value = feedbackText.textContent;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);

    copyBtn.textContent = '✓ Copied';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Copy';
      copyBtn.classList.remove('copied');
    }, 2000);
  } catch (e) {
    console.error('Copy failed', e);
  }
}

function resetForm() {
  nameInput.value = '';
  reflectionInput.value = '';
  correctiveInput.value = '';
  feedbackText.textContent = '';
  citationIndicator.style.display = 'none';
  outputSection.style.display = 'none';
  errorMsg.style.display = 'none';
  generateBtn.disabled = true;
  nameInput.focus();
}
</script>

</body>
</html>
